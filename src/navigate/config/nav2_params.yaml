          # min_observation_height: 0.0    # 最小观测高度(米)
          # max_observation_height: 2.0    # 最大观测高度(米)
          # min_z: 0.1                     # 最小Z值(米)，用于过滤地面
          # max_z: 2.0                     # 最大Z值(米)
        # #距离范围  
          # obstacle_max_range: 2.5        # 障碍物检测最大范围(米)
          # obstacle_min_range: 0.0        # 障碍物检测最小范围(米)
