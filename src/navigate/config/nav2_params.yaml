          # raytrace_min_range: 0.0        # 射线追踪最小范围(米)
          # max_obstacle_range: 2.5        # 最大障碍物范围(米)，同obstacle_max_range
          # min_obstacle_range: 0.0        # 最小障碍物范围(米)，同obstacle_min_range
        # #更新和时间参数
          # expected_update_rate: 0.0      # 预期更新频率(Hz)，0表示不检查
          # observation_persistence: 0.0   # 观测持续时间(秒)，0表示立即过期
          # inf_is_valid: false            # 无穷大值是否有效
          # clear_after_reading: true      # 读取后清除数据
        # #点云处理参数
          # filter_speckles: True       # 过滤离散点
          # voxel_filter: True          # 启用体素滤波
          # voxel_min_points: 3         # 每个体素最小点数，用于滤波
          # decay_time: 0.5             # 数据衰减时间(秒)
        # #视野角度参数(弧度)
          # vertical_fov_angle: 0.8745     # 垂直视野角(弧度)，50度
          # vertical_fov_padding: 0.1      # 垂直视野填充(弧度)
          # horizontal_fov_angle: 1.0472   # 水平视野角(弧度)，60度
          # horizontal_fov_padding: 0.0    # 水平视野填充(弧度)
        # #其他高级参数
          # decay_acceleration: 0.0        # 衰减加速度
          # clearing_threshold: 0.2        # 清除阈值
          # marking_threshold: 0.0         # 标记阈值
          # combination_method: 1          # 组合方法(0=覆盖, 1=最大值)


# 全局代价
global_costmap:
  global_costmap:
    ros__parameters:
      # === 基础参数 ===
      update_frequency: 1.0        # 全局代价地图更新频率(Hz)
      publish_frequency: 1.0       # 全局代价地图发布频率(Hz)
      global_frame: map           # 全局坐标系，通常是map
      robot_base_frame: base_link # 机器人基础坐标系
      use_sim_time: True         # 是否使用仿真时间
      # === 机器人和地图参数 ===
      robot_radius: 0.22         # 机器人半径(米)，用于碰撞检测
      resolution: 0.05           # 地图分辨率(米/像素)
      track_unknown_space: true  # 是否追踪未知空间
      # === 使用的插件层 ===
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # === 障碍物层配置 ===
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"  # 障碍物层插件
        enabled: True                              # 启用障碍物层
        observation_sources: scan                  # 观测源名称
        scan:                                      # 激光雷达配置
          topic: /scan                            # 激光雷达话题
          max_obstacle_height: 2.0                # 最大障碍物高度(米)
          clearing: True                          # 启用清除功能
          marking: True                           # 启用标记功能
          data_type: "LaserScan"                 # 数据类型
          raytrace_max_range: 3.0                # 射线追踪最大范围(米)
          raytrace_min_range: 0.0                # 射线追踪最小范围(米)
          obstacle_max_range: 2.5                # 障碍物检测最大范围(米)
          obstacle_min_range: 0.0                # 障碍物检测最小范围(米)
      # === 静态层配置 ===
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"   # 静态层插件
        map_subscribe_transient_local: True      # 使用本地临时订阅地图
      # === 膨胀层配置 ===
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # 膨胀层插件
        cost_scaling_factor: 3.0                  # 代价缩放因子，越大衰减越快
        inflation_radius: 0.55                    # 膨胀半径(米)，障碍物影响范围
      # === 其他配置 ===
      always_send_full_costmap: True             # 始终发送完整代价地图
# 地图
map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: "/home/rm/learn_ws/src/navigate/map/rmuc_2025.yaml"
    # yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# 路径规划服务器
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0    # 期望的规划频率(Hz)
    use_sim_time: True                  # 使用仿真时间
    planner_plugins: ["GridBased"]      # 使用的规划器插件列表
    GridBased:                          # 基于栅格的规划器配置
      plugin: "nav2_navfn_planner/NavfnPlanner"  # 使用Navfn规划器
      tolerance: 0.5                    # 目标点容差(米)
      use_astar: false                 # false使用Dijkstra算法，true使用A*算法
      allow_unknown: true              # 允许规划穿过未知区域
# 路径平滑服务器
smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]        # 使用的平滑器插件
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"    # 简单平滑器插件
      tolerance: 1.0e-10                         # 平滑收敛容差
      max_its: 1000                             # 最大迭代次数
      do_refinement: True                       # 是否进行路径精细化

# 行为树服务器
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw     # 代价地图话题
    footprint_topic: local_costmap/published_footprint  # 机器人轮廓话题
    cycle_frequency: 10.0                        # 行为执行频率(Hz)
    
    # 行为插件配置
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    
    # 各种行为插件定义
    spin:
      plugin: "nav2_behaviors/Spin"              # 原地旋转行为
    backup:
      plugin: "nav2_behaviors/BackUp"            # 后退行为
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"    # 定向行驶行为
    wait:
      plugin: "nav2_behaviors/Wait"              # 等待行为
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"    # 辅助遥控行为
    
    # 基础参数
    global_frame: odom                          # 全局坐标系
    robot_base_frame: base_link                 # 机器人坐标系
    transform_tolerance: 0.1                    # 坐标变换容差(秒)
    use_sim_time: true                         # 使用仿真时间
    simulate_ahead_time: 2.0                   # 前向模拟时间(秒)
    max_rotational_vel: 1.0                    # 最大旋转速度(rad/s)
    min_rotational_vel: 0.4                    # 最小旋转速度(rad/s)
    rotational_acc_lim: 3.2                    # 旋转加速度限制(rad/s^2)

robot_state_publisher:
  ros__parameters:
    use_sim_time: True
# 航点跟随服务器
waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20                               # 执行频率(Hz)
    stop_on_failure: false                      # 失败时是否停止
    waypoint_task_executor_plugin: "wait_at_waypoint"  # 航点执行器插件
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200              # 每个航点停留时间(ms)
# 速度平滑服务器
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0                   # 平滑频率(Hz)
    scale_velocities: False                     # 是否缩放速度
    feedback: "OPEN_LOOP"                       # 反馈类型
    
    # 速度限制
    max_velocity: [0.26, 0.0, 1.0]             # 最大速度[x,y,θ](m/s, m/s, rad/s)
    min_velocity: [-0.26, 0.0, -1.0]           # 最小速度[x,y,θ]
    
    # 加速度限制
    max_accel: [2.5, 0.0, 3.2]                # 最大加速度[x,y,θ]
    max_decel: [-2.5, 0.0, -3.2]              # 最大减速度[x,y,θ]
    
    # 其他参数
    odom_topic: "odom"                         # 里程计话题
    odom_duration: 0.1                         # 里程计数据有效期(秒)
    deadband_velocity: [0.0, 0.0, 0.0]         # 速度死区
    velocity_timeout: 1.0                      # 速度指令超时时间(秒)

