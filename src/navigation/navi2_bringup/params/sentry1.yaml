        enabled: true
        voxel_decay: 1.5
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 5
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: mid360
        mid360:
          data_type: PointCloud2
          topic: /cloud_registered_filtered
          marking: true
          clearing: true
          obstacle_range: 8.0
          min_obstacle_height: 0.1
          max_obstacle_height: 0.8
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true

          # 视锥模型参数，用于根据传感器的视锥体来更新STVL层的代价地图
          max_z: 10.0 # 清除距离
          min_z: 0.1
          vertical_fov_angle: 1.03   # default 0.7, radians. For 3D lidars it's the symmetric FOV about the planar axis.
          vertical_fov_offset: 0.3927  # default 0, radians. 3D Lidar only. Offset from planar axis. f.e. MID360 has a vFOV of -7deg to 52deg => offset +22.5deg (0.3927 rad)
          vertical_fov_padding: 0.05   # 3D Lidar only. Default 0, in meters 
          horizontal_fov_angle: 6.29   # 3D lidar scanners like the VLP16 have 360 deg horizontal FOV.
          decay_acceleration: 15.0
          model_type: 1
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["MincoPlanner"]

    MincoPlanner:
      plugin: "minco_planner/MincoPlanner"
      tolerance: 0.3  
      use_smac: true
      allow_unknown: false
      odom_topic: /aft_mapped_to_init

      corridor:
        robot_radius: 0.25
        extra_margin: 0.05

      smac_2d:
        use_esdf_cost: true
        esdf_weight: 0.2
        esdf_decay: 0.5
        esdf_max_cost: 0.5

      minco_optimizer:
        opt_freq: 10.0
        traj_goal_tolerance: 0.3
        enable_yaw_opt: true
        safe_dist: 0.40
        lookahead_dist: 6.0  # 前视距离,用于minco部分优化
        max_velocity: 3.5
        max_acceleration: 2.0
        max_yaw_dot: 5.0
        turn_angle_deadzone: 0.5
        turn_angle_saturation: 1.57
        min_turn_vel: 1.5
        decay_power: 1.5
        time_allocation_iters: 15
        smooth_eps: 0.01
        integral_res: 16
        opt_accuracy: 0.001
        print_optimizer_log: false
        penalty_weight_time: 100.0
        penalty_weight_pos: 50000.0
        penalty_weight_vel: 1500.0
        penalty_weight_acc: 1500.0
        penalty_weight_att: 500.0
        penalty_weight_time_barrier: 50.0
      recovery_server:
        fail_threshold: 5
        cooldown_sec: 1.0
        recovery_window_sec: 3.0
        escape_speed: 0.5
      static_esdf:
        # esdf_pcd_path: "src/utils/pcd2esdf/maps/rmuc2026_esdf.pcd"
        # esdf_pcd_path: "src/utils/pcd2esdf/maps/rmul2026_esdf.pcd"
        # esdf_pcd_path: "src/utils/pcd2esdf/maps/room_esdf.pcd"
        esdf_pcd_path: "src/utils/pcd2esdf/maps/first_floor_esdf.pcd"
        # esdf_pcd_path: "src/utils/pcd2esdf/maps/rmuc2026_back_esdf.pcd"
        esdf_resolution: 0.05
        dynamic_esdf_size: 8.0
        dynamic_dilation_radius: 0.05

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    # backup:
    #   # plugin: "nav2_behaviors/BackUp"
    #   plugin: "nav2_behaviors/BackUpTwzFree"
    #   local_costmap_global_frame: camera_init
    #   local_costmap_robot_base_frame: base_link
    #   robot_radius: 0.3
    #   cost_threshold: 0.0
    #   visualization: true
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    enabled: False
    use_sim_time: False
    smoothing_frequency: 100.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [3.5, 3.5, 5.0]
    min_velocity: [-3.5, -3.5, -5.0]
    max_accel: [5.0, 5.0, 5.0]
    max_decel: [-5.0, -5.0, -5.0]
    odom_topic: "aft_mapped_to_init"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0