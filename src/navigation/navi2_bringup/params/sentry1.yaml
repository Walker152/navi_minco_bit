bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    robot_base_frame: "base_link"
    use_sim_time: False
    controller_frequency: 100.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.1
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 1000.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: "minco_controller::MincoMpcController"
      # MPC sampling period (s) and lookahead time (s)
      dt: 0.05
      lookahead_time : 0.5
      use_small_gyro_mode: false
      deadzone_speed_threshold: 0.1
      control_delay_compensation: 0.15 

      # Cost weights: Q for state error [x, y, yaw], R for control error [vx, vy, omega]
      Q: [3.0, 3.0, 2.0]
      R: [1.5, 1.5, 1.0]

      # Velocity bounds
      vx_min: -3.0
      vx_max: 3.0
      vy_min: -3.0
      vy_max: 3.0
      fixed_wz: 4.18 # rad/s, used if use_small_gyro_mode is true
      omega_min: -5.0 
      omega_max: 5.0

      # Optional acceleration constraints
      use_acc_constraints: true
      ax_min: -2.0
      ax_max: 2.0
      ay_min: -2.0
      ay_max: 2.0
      alpha_min: -5.0
      alpha_max: 5.0

      # Lidar extrinsic parameters
      lidar_offset_x: 0.0
      lidar_offset_y: 0.20
      lidar_roll_offset: -0.3490

      # Frame settings
      odom_frame: "camera_init"
      map_frame: "map"

      performance:
        enable: true
        print_enable: true
        detailed_csv_enable: false
        odom_sub_debug_enable: true
        mpc_csv_path: /tmp/mpc_perf_detailed.csv
        print_period_sec: 1.0
        csv_flush_every_n: 30
        run_id: ""
        scenario: ""
        variant: ""


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: camera_init
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # robot_radius: 0.22
      robot_radius: 0.2
      plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.25
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.6
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 5
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: mid360
        mid360:
          data_type: PointCloud2
          topic: /cloud_registered_filtered
          marking: true
          clearing: true
          obstacle_range: 8.0
          min_obstacle_height: -0.1
          max_obstacle_height: 1.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true

          # 视锥模型参数，用于根据传感器的视锥体来更新STVL层的代价地图
          max_z: 10.0 # 清除距离
          min_z: 0.1
          vertical_fov_angle: 1.03   # default 0.7, radians. For 3D lidars it's the symmetric FOV about the planar axis.
          vertical_fov_offset: 0.3927  # default 0, radians. 3D Lidar only. Offset from planar axis. f.e. MID360 has a vFOV of -7deg to 52deg => offset +22.5deg (0.3927 rad)
          vertical_fov_padding: 0.05   # 3D Lidar only. Default 0, in meters 
          horizontal_fov_angle: 6.29   # 3D lidar scanners like the VLP16 have 360 deg horizontal FOV.
          decay_acceleration: 15.0
          model_type: 1
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
