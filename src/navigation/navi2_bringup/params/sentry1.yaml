      # plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.80
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.5
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 5
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: mid360
        mid360:
          data_type: PointCloud2
          topic: /cloud_registered_filtered
          marking: true
          clearing: true
          obstacle_range: 8.0
          min_obstacle_height: 0.1
          max_obstacle_height: 0.8
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true

          # 视锥模型参数，用于根据传感器的视锥体来更新STVL层的代价地图
          max_z: 10.0 # 清除距离
          min_z: 0.1
          vertical_fov_angle: 1.03   # default 0.7, radians. For 3D lidars it's the symmetric FOV about the planar axis.
          vertical_fov_offset: 0.3927  # default 0, radians. 3D Lidar only. Offset from planar axis. f.e. MID360 has a vFOV of -7deg to 52deg => offset +22.5deg (0.3927 rad)
          vertical_fov_padding: 0.05   # 3D Lidar only. Default 0, in meters 
          horizontal_fov_angle: 6.29   # 3D lidar scanners like the VLP16 have 360 deg horizontal FOV.
          decay_acceleration: 15.0
          model_type: 1
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["MincoPlanner"]

    MincoPlanner:
      plugin: "minco_planner/MincoPlanner"
      planner_mode: PRIORMAP
      # planner_mode: EXPLORATION
      frames:
        map_frame: map
        rog_frame: camera_init
      priormap:
        use_nav2_global_search: true
        clip_seed_by_rog_boundary: true
        rog_boundary_margin: 0.4
        rog_boundary_sample_step: 0.1
      exploration:
        boundary_margin: 0.8
        boundary_sample_step: 0.1
        unknown_as_occupied: true
        prefer_goal_direction: true
      tolerance: 0.3  
      use_smac: true
      allow_unknown: false
      odom_topic: /aft_mapped_to_init
      performance:
        enable: true
        print_enable: true
        detailed_csv_enable: false
        odom_sub_debug_enable: true
        minco_csv_path: /tmp/minco_perf_detailed.csv
        print_period_sec: 1.0
        csv_flush_every_n: 30
        run_id: ""
        scenario: ""
        variant: ""
      rog_map:
        frame_id: camera_init
        resolution: 0.05
        # [基础地图][m/cell] 三维膨胀地图分辨率；通常与 resolution 保持一致，过细增加膨胀查询计算量，过粗会让碰撞边界变粗糙。
        inflation_resolution: 0.05
        map_size: [10.0, 10.0, 1.5]
        fix_map_origin: [0.0, 0.0, 0.0]

        map_sliding:
          enable: true
          # [map_sliding][m] 触发地图滑动的位移阈值；过小会频繁滑动并带来计算抖动，过大可能让机器人靠近局部地图边缘。
          threshold: 0.2

        ros_callback:
          enable: true
          cloud_topic: /cloud_registered_full
          odom_topic: /aft_mapped_to_init
          odom_timeout: 0.08
          update_period_ms: 20

        raycasting:
          enable: true
          # [raycasting][帧] 每批处理点云帧数；调大可攒批减少调度开销，但会增加地图更新延迟。
          batch_update_size: 1
          # [raycasting][m,m] 射线有效距离 [min,max]；min 过大会忽略近处点，max 过大会增加计算量并可能引入远处噪声。
          ray_range: [0.30, 10.0]
          # [raycasting][m,m,m] 每次局部更新盒尺寸；调大覆盖更多点但 raycasting 和 dirty column 数量上升。
          local_update_box: [10.0, 10.0, 2.5]
          # [raycasting][概率] unknown 判断阈值相关参数；影响 UNKNOWN/FREE/OCCUPIED 判定，进而影响 projection layer。
          unk_thresh: 0.70
          p_hit: 0.9
          p_miss: 0.45
          p_min: 0.12
          p_max: 0.97
          p_occ: 0.85
          p_free: 0.499
          # [raycasting/performance][bool] raycast 并行开关；会被 performance.parallel_raycast_enable 后加载覆盖，影响 CPU 占用和更新延迟。
          parallel_enable: false
          # [raycasting/performance][线程] raycast 线程数；不宜超过可用 CPU 核数，过大可能因竞争导致抖动。
          num_threads: 4

        decay:
          enable: true
          # [decay][s] 最后一次 hit 后保持 occupied 的最小时间；过短障碍闪烁，过长动态障碍残留。
          keep_time: 0.8
          # [decay][s] 最后一次 hit 后强制衰减到 free 的最大时间；必须大于 keep_time。
          clear_time: 1.2
          # [decay][bool] 只维护活跃 cell 衰减列表；开启通常降低计算量，若列表维护异常会影响动态清除完整性。
          active_list_enable: false

        projection:
          enable: true

          # [absolute Z coordinate, m]
          # ROGMap frame 中参与单柱扫描的绝对 Z 下界。
          # 这是坐标值，不是地面相对高度，也不是高度差。
          scan_z_min_abs: -0.20

          # [absolute Z coordinate, m]
          # ROGMap frame 中参与单柱扫描的绝对 Z 上界。
          # 这是坐标值，不是障碍高度，也不是高度差。
          scan_z_max_abs: 1.50

          # UNKNOWN 是否作为 ESDF 障碍。
          unknown_as_occupied: false

          # 每个 XY 柱中 KNOWN_FREE + OCCUPIED 的最小观测体素数。
          min_observed_voxels: 2

          # [vertical height difference, m]
          # 同一 XY 柱中最高与最低占据体素的垂直高度差 H。
          # 不超过该值时，分类为地面或坡面薄表面。
          # 这是差值，不是 ROGMap frame 中的绝对 Z 坐标。
          surface_height_delta_max: 0.1

          # [vertical height difference, m]
          # 判定竖直墙所需的最小单柱垂直高度差 H。
          # 这是差值，不是绝对 Z 坐标。
          wall_height_delta_min: 0.40

          # [dimensionless ratio, 0~1]
          # H 区间内的垂直占据率达到该值时，视为连续竖直墙。
          wall_occupancy_ratio_min: 0.60

          # [vertical height difference, m]
          # 可通行隧道所需的最小上下表面高度差。
          # 应包含机器人实际高度和安全余量。
          # 这是差值，不是绝对 Z 坐标。
          tunnel_height_delta_min: 0.2

          # [vertical height difference, m]
          # 当前 RM 场景中允许识别为目标隧道的最大上下表面高度差。
          # 这是差值，不是绝对 Z 坐标。
          tunnel_height_delta_max: 0.50

          # [dimensionless ratio, 0~1]
          # 隧道上下表面之间的最大垂直占据率。
          tunnel_occupancy_ratio_max: 0.45

          # PASSABLE 在 value layer 中的代价值。
          passable_cost: 50

          # PASSABLE 是否在 value layer 中写为 FREE。
          # PASSABLE 的 ESDF mask 始终为 1。
          passable_as_free: true

          hysteresis_enable: true
          hysteresis_count: 2

          hole_fill_enable: false
          hole_fill_radius: 1
          hole_fill_min_occupied_neighbors: 4
        field:
          enable: true
          inflation_radius: 0.0
          # [field][m] ESDF 正向最大截断距离；调大提供更远梯度但代价有限，过小会让远离障碍区域梯度变少。
          max_distance: 5.0
          # [field][m] ESDF 负向最小截断距离；控制障碍内部负距离下限，影响优化代价范围。
          min_distance: -3.0
          clamp_distance: true
          # [field][枚举] 插值方式 bilinear/quadratic；quadratic 梯度更平滑，边界邻域不足时会回退到 bilinear。
          interpolation: quadratic
          update_rate: 50.0

        performance:
          enable: true
          detailed_csv_enable: false
          summary_csv_enable: false
          detailed_csv_path: /tmp/rog_map_perf_detailed.csv
          summary_csv_path: /tmp/rog_map_perf_summary.csv
          run_id: ""
          # [performance][string] 实验场景名。
          scenario: ""
          # [performance][string] 实验变体名。
          variant: ""
          # [performance][行] CSV flush 间隔；避免每行强制 flush 变成新瓶颈，节点退出时仍会关闭文件。
          csv_flush_every_n: 30
          print_enable: false
          # [performance][Hz] 性能摘要和 summary CSV 频率。
          summary_rate: 1.0
          # [performance][bool] 是否启用 dirty column 增量刷新；开启可减少 projection/field 全量刷新计算量。
          dirty_column_enable: false
          # [performance][比例] dirty column 超过地图总列数比例时转全量刷新；调低更常全量，调高更依赖增量更新。
          dirty_full_ratio: 0.30
          # [performance/raycasting][bool] 并行 raycast 开关；代码后加载该值，会覆盖 raycasting.parallel_enable。
          parallel_raycast_enable: false
          raycast_num_threads: 4

        visualization:
          # [visualization][bool] 总开关；false 时不创建可视化 timer，不发布任何可视化 topic。
          enable: true
          frame_id: camera_init
          # [visualization][Hz] 可视化发布上限频率；实际每个 topic 仅在存在订阅者时构造并发布。
          rate: 10.0
          range: [10.0, 10.0, 1.2]
      corridor:
        robot_radius: 0.25
        extra_margin: 0.05

      smac_2d:
        use_esdf_cost: false
        esdf_weight: 0.2
        esdf_decay: 0.5
        esdf_max_cost: 0.5

      minco_optimizer:
        opt_freq: 20.0
        traj_goal_tolerance: 0.3
        enable_yaw_opt: true
        safe_dist: 0.20
        lookahead_dist: 6.0  # 前视距离,用于minco部分优化
        max_velocity: 3.0
        max_acceleration: 2.0
        max_yaw_dot: 5.0
        turn_angle_deadzone: 0.1
        turn_angle_saturation: 0.8
        min_turn_vel: 0.6
        decay_power: 2.0
        time_allocation_iters: 15
        smooth_eps: 0.01
        integral_res: 16
        opt_accuracy: 0.001
        print_optimizer_log: false
        penalty_weight_time: 100.0
        penalty_weight_pos: 50000.0
        penalty_weight_vel: 1500.0
        penalty_weight_acc: 1500.0
        penalty_weight_att: 10.0
        penalty_weight_time_barrier: 50.0
      recovery_server:
        fail_threshold: 5
        cooldown_sec: 1.0
        recovery_window_sec: 3.0
        escape_speed: 0.5

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
