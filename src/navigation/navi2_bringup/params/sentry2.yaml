bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: "base_link"
    odom_topic: /aft_mapped_to_init
    bt_loop_duration: 5 # ms
    # 行为树超时时间，秒
    default_server_timeout: 20
    # 毫秒
    wait_for_service_timeout: 2000
