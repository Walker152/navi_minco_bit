controller_server:
  ros__parameters:
    robot_base_frame: "base_link"
    use_sim_time: False
    controller_frequency: 60.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.1
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 100.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 6.28

    # FollowPath:
    #   plugin: "nav2_mppi_controller::MPPIController"
    #   time_steps: 56
    #   model_dt: 0.0167
    #   batch_size: 2000
    #   vx_std: 0.4   # Average linear velocity noise standard deviation, this controls the real velocity standard
    #   vy_std: 0.4     # Average linear velocity noise standard deviation, this controls the real velocity standard
    #   wz_std: 0.1
    #   vx_max: 1.0
    #   vx_min: -1.0
    #   vy_max: 1.0
    #   wz_max: 0.1
    #   iteration_count: 1
    #   prune_distance: 1.7
    #   transform_tolerance: 0.1
    #   temperature: 0.3
    #   gamma: 0.015
    #   motion_model: "Omni"
    #   visualize: false
    #   reset_period: 1.0 # (only in Humble)
    #   TrajectoryVisualizer:
    #     trajectory_step: 5
    #     time_step: 3
    #   AckermannConstrains:
    #     min_turning_r: 0.2
    #   critics: ["ObstaclesCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "PreferForwardCritic", "VelocityDeadbandCritic"]
    #   GoalCritic:
    #     enabled: true
    #     cost_power: 1
    #     cost_weight: 5.0
    #     threshold_to_consider: 1.0
    #   PreferForwardCritic:
    #     enabled: true
    #     cost_power: 1
    #     cost_weight: 5.0
    #     threshold_to_consider: 1.0
    #   ## Only choose one between ObstaclesCritic and CostCritic
    #   ObstaclesCritic:
    #     enabled: true
    #     cost_power: 1
    #     repulsion_weight: 2.0
    #     critical_weight: 30.0
    #     consider_footprint: false
    #     collision_cost: 1000.0
    #     collision_margin_distance: 0.2
    #     near_goal_distance: 0.1
    #     inflation_layer_name: "inflation_layer"
    #   # CostCritic:
    #   #   enabled: true
    #   #   cost_power: 1
    #   #   cost_weight: 3.81
    #   #   critical_cost: 300.0
    #   #   consider_footprint: true
    #   #   collision_cost: 1000000.0
    #   #   near_goal_distance: 1.0
    #   #   trajectory_point_step: 2
    #   PathAlignCritic:
    #     enabled: true
    #     cost_power: 1
    #     cost_weight: 14.0
    #     max_path_occupancy_ratio: 0.05
    #     trajectory_point_step: 3
    #     threshold_to_consider: 0.40   # Distance between robot and goal above which path align cost stops being considered
    #     offset_from_furthest: 20      # Distance checks that the candidate trajectories are sufficiently far along their way tracking the path to apply the alignment critic.
    #   PathFollowCritic:
    #     enabled: true
    #     cost_power: 1
    #     cost_weight: 5.0
    #     offset_from_furthest: 10
    #     threshold_to_consider: 0.6
    #   # PathAngleCritic:
    #   #   enabled: true
    #   #   cost_power: 1
    #   #   cost_weight: 2.0
    #   #   offset_from_furthest: 4
    #   #   threshold_to_consider: 0.40
    #   #   max_angle_to_furthest: 1.0
    #   VelocityDeadbandCritic:
    #     enabled: true
    #     cost_power: 1
    #     cost_weight: 5.0
    #     deadband_velocities: [0.05, 0.05, 0.05]
    #   # TwirlingCritic:
    #   #   enabled: true
    #   #   twirling_cost_power: 1
    #   #   twirling_cost_weight: 10.0
    
    FollowPath:
      plugin: "minco_controller::MincoMpcController"
      # MPC sampling period (s) and lookahead time (s)
      dt: 0.05
      lookahead_time : 3.0

      # Cost weights: Q for state error [x, y, yaw], R for control error [vx, vy, omega]
      Q: [5.0, 5.0, 2.0]
      R: [1.0, 1.0, 0.5]

      # Velocity bounds
      vx_min: -2.5
      vx_max: 5.0
      vy_min: -2.5
      vy_max: 5.0
      omega_min: -0.5
      omega_max: 0.5

      # Optional acceleration constraints
      use_acc_constraints: false
      ax_min: -2.5
      ax_max: 2.5
      ay_min: -2.5
      ay_max: 2.5
      alpha_min: -1.0
      alpha_max: 1.0

      # Frame settings (Explicitly match your costmap configurations)
      odom_frame: "camera_init"
      map_frame: "map"


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: camera_init
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      # robot_radius: 0.22
      robot_radius: 0.3
      plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.35
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.8
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 5
        update_footprint_enabled: true
        combination_method: 0
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: mid360
        mid360:
          data_type: PointCloud2
          topic: /cloud_registered
          marking: true
          clearing: true
          obstacle_range: 20.0
          min_obstacle_height: 0.1
          max_obstacle_height: 0.5
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 7.0
          min_z: 0.1
          vertical_fov_angle: 0.8745
          horizontal_fov_angle: 1.048
          decay_acceleration: 15.0
          model_type: 0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      # robot_radius: 0.22
      robot_radius: 0.3
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.50
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.8
        decay_model: 0
        voxel_size: 0.15
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 5
        update_footprint_enabled: true
        combination_method: 0
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: mid360
        mid360:
          data_type: PointCloud2
          topic: /cloud_registered
          marking: true
          clearing: true
          obstacle_range: 10.0
          min_obstacle_height: 0.0
          max_obstacle_height: 0.5
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 2.0
          min_z: 0.1
          vertical_fov_angle: 0.8745
          horizontal_fov_angle: 1.048
          decay_acceleration: 15.0
          model_type: 0
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    # 同时加载 SmacPlanner 和 MincoPlanner 两个全局规划插件
    planner_plugins: ["SmacPlanner", "MincoPlanner"]

    SmacPlanner:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.1                      # tolerance for planning if unable to reach exact pose, in meters
      downsample_costmap: false           # whether or not to downsample the map
      downsampling_factor: 1              # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: true                 # allow traveling in unknown space
      max_iterations: 1000000             # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000    # Maximum number of iterations after within tolerances to continue to try to find exact solution
      max_planning_time: 1.0              # max time in s for planner to plan, smooth
      cost_travel_multiplier: 2.0         # Cost multiplier to apply to search to steer away from high cost areas.
      use_final_approach_orientation: true # Whether to set the final path pose to the goal's orientation.
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

    MincoPlanner:
      plugin: "minco_planner/MincoPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: false
      minco_optimizer:
        opt_freq: 20.0
        safe_dist: 0.4
        lookahead_dist: 25.0  # 前视距离,用于minco部分优化
        max_velocity: 3.0
        max_acceleration: 6.0
        time_allocation_iters: 15
        smooth_eps: 0.01
        integral_res: 16
        opt_accuracy: 0.0001
        print_optimizer_log: false
        penalty_weight_time: 500.0
        penalty_weight_pos: 100000.0
        penalty_weight_vel: 1000.0
        penalty_weight_acc: 1000.0
        penalty_weight_att: 100.0
      static_esdf:
        esdf_pcd_path: "src/utils/pcd2esdf/maps/2026_esdf.pcd"
        esdf_resolution: 0.05

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait", "backup"]
    wait:
      plugin: "nav2_behaviors/Wait"
    backup:
      plugin: "nav2_behaviors/BackUp"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enabled: False
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.5, 2.5, 0.5]
    min_velocity: [-2.5, -2.5, -0.5]
    max_accel: [2.5, 2.5, 1.0]
    max_decel: [-2.5, -2.5, -1.0]
    odom_topic: "aft_mapped_to_init"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0