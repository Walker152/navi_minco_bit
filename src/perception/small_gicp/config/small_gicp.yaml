small_gicp_relocalization:
  ros__parameters:
    # ==================== 文件路径 ====================
    # PCD地图文件路径（参考点云）
    prior_pcd_file: "/home/rm/loc_ws/src/small_gicpapp/PCD/scans.pcd"  # 留空将使用 PCD/reference.pcd
    
    # ==================== 初始位姿 ====================
    init_pose: [0.3, 0.3, 0.0, 0.0, 0.0, 0.0]
    
    # ==================== 配准触发参数 ====================
    # 累积多少帧点云后触发一次配准
    # 推荐范围: 5-20帧
    # 值越大累积点云越密集，但延迟越高
    frames_to_accumulate: 3
    pass_count: 5
    # ==================== 算法参数 ====================
    # 并行计算线程数（建议设置为CPU核心数）
    num_threads: 16
    # KD树近邻点数量（用于协方差估计）
    # 值越大越准确但计算越慢
    # 推荐范围: 10-20
    num_neighbors: 15
    # 全局地图降采样体素大小（米）
    # 值越大点云越稀疏，速度越快但精度降低
    # 推荐范围: 0.1-0.5
    global_leaf_size: 0.05
    # 输入扫描降采样体素大小（米）
    # 值越大点云越稀疏，速度越快但精度降低
    # 推荐范围: 0.1-0.5
    registered_leaf_size: 0.05
    # 点对匹配最大距离平方（米²）
    # 超过此距离的点对将被拒绝
    # 值越小匹配越严格但可能失败
    # 推荐范围: 0.5-2.0
    max_dist_sq: 1.0
