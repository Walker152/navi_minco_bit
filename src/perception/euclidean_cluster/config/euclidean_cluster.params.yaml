euclidean_cluster_node:
  ros__parameters:
    topics:
      input: /cloud_registered_dense
      output: /clustered_obstacles

    cluster:
      z_min: 0.05
      z_max: 0.8
      max_detection_range: 10.0
      leaf_size: 0.05
      cluster_tolerance: 0.15
      min_cluster_size: 40
      max_cluster_size: 500

    tracker:
      match_distance_threshold: 0.5
      max_missed_frames: 5
      dynamic_speed_threshold: 0.2
      alpha_size: 0.2
      alpha_orientation: 0.2
      class_confirm_frames: 5
      dt_default: 0.05
      q_pos_x: 0.01
      q_pos_y: 0.01
      q_vel_x: 0.05
      q_vel_y: 0.05
      r_pos_x: 0.05
      r_pos_y: 0.05
