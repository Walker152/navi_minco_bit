livox_to_pointcloud2:
  ros__parameters:
    # ==================== 话题配置 ====================
    input_topic: "/livox/lidar"
    output_topic: "/livox/stdpc"
    queue_size: 10
    frame_id: "body"
    # ==================== 平移变换 (米) ====================
    # 点云坐标系相对于目标坐标系的平移
    # 例如: 如果雷达安装在机器人中心前方0.3m，设置 translation_x: 0.3
    translation_x: 0.0
    translation_y: 0.0
    translation_z: 0.0
    
    # ==================== 旋转变换 (弧度) ====================
    # 点云坐标系相对于目标坐标系的旋转（欧拉角）
    # Roll (绕X轴旋转), Pitch (绕Y轴旋转), Yaw (绕Z轴旋转)
    # 例如: 如果雷达倒装，设置 rotation_roll: 3.14159 (180度)
    rotation_roll: 0.35   # 绕X轴旋转
    rotation_pitch: 0.0  # 绕Y轴旋转
    rotation_yaw: 0.0  # 绕Z轴旋转
    
    # ==================== 点云裁剪 ====================
    # 是否启用点云裁剪（移除范围外的点）
    enable_crop: false
    
    # 裁剪范围 (米) - 相对于变换后的坐标系
    # 保留范围: [crop_x_min, crop_x_max] x [crop_y_min, crop_y_max] x [crop_z_min, crop_z_max]
    crop_x_min: -10.0
    crop_x_max: 10.0
    crop_y_min: -10.0
    crop_y_max: 10.0
    crop_z_min: -1.0
    crop_z_max: 5.0
    

