cloud_registered_crop_filter:
  ros__parameters:
    input_topic: /cloud_registered
    output_topic: /cloud_registered_filtered
    queue_size: 10
    filter_mode: transform_center   # transform_cloud | transform_center
    remove_inside: true             # true: remove points inside box, false: keep points inside box
    position_frame: map
    # Multi-region mode only (index-aligned):
    # region0: center=(12, 6, 0), boundary=(3, 3, 0.8)
    # region1: center=(20, 10, 0), boundary=(4, 2, 1.2)
    centers_x: [12.0, 20.0]
    centers_y: [6.0, 10.0]
    centers_z: [0.0, 0.0]
    boundaries_x: [3.0, 4.0]
    boundaries_y: [3.0, 2.0]
    boundaries_z: [0.8, 1.2]
