# 立方体过滤区域配置
# 坐标系: map (全局/地图坐标系)
# 用途: 移除点云中的固定区域（如机器人本体、支架等）
# 格式: min: [x_min, y_min, z_min, intensity_min]
#       max: [x_max, y_max, z_max, intensity_max]
# 坐标轴: 标准笛卡尔坐标系（右手规则，x-前，y-左，z-上）

cube:
  # 过滤器1: 左前方区域（测试立方体1）
  - min: [0.0, -5.0, 0.0, 0.0]
    max: [10.0, 5.0, 3.0, 255.0]
  
  # 过滤器2: 右侧区域（测试立方体2）
  - min: [20.0, 0.0, 0.0, 0.0]
    max: [30.0, 10.0, 3.0, 255.0]
