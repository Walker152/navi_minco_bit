ros__parameters:
  # Depth Cluster 节点配置文件
  # 用途: 基于深度图像的点云聚类和地面检测
  # 参考: depth_cluster.hpp 中的构造函数参数

  # ==================== 输入/输出话题 ====================
  topics:
    # 输入点云话题 (sensor_msgs/PointCloud2)
    input_cloud_topic: "/gicp_source"
    
    # 地面点云输出 (绿色点, sensor_msgs/PointCloud2)
    output_ground_topic: "/ground_points_map"
    
    # 障碍物聚类输出 (彩色点, sensor_msgs/PointCloud2)
    output_obstacles_topic: "/obstacle_clusters_map"
  
  # ==================== 深度聚类算法参数 ====================
  clustering:
    # 雷达垂直分辨率 (度)
    # 典型值: Livox Avia=1, Velodyne 16=2, Velodyne 32=1, Hesai QT64=0.0375
    vertical_resolution: 1.0
    
    # 雷达水平分辨率 (度)
    # 典型值: Livox Avia=1.5-2, Velodyne=0.1-0.2
    horizontal_resolution: 0.2
    
    # 雷达线数 (扫描线)
    # 典型值: Livox Avia=32, Velodyne 16=16, Velodyne 32=32, Hesai QT64=64
    lidar_lines: 32
    
    # 最小聚类点数
    # 过小会产生噪声, 过大会漏检
    min_cluster_size: 5
    
    # 地面拟合参数
    ground:
      # 初始地面点高度阈值 (米)
      # 提取低于此高度的点作为初始地面点云
      height_threshold: 0.5
      
      # 地面点距离阈值 (米)
      # 点到地面平面的距离大于此值则判为非地面点
      distance_threshold: 2.0
      
      # 地面斜率阈值 (度)
      # 用于滤波不合理的地面平面估计
      max_slope_angle: 10.0

  # ==================== 点云处理参数 ====================
  filtering:
    # 点云范围限制
    range:
      # 最小距离 (米)
      min_range: 0.1
      
      # 最大距离 (米)
      max_range: 100.0
    
    # 点云高度范围
    z_range:
      # 最小高度 (米)
      min_height: -2.0
      
      # 最大高度 (米)
      max_height: 5.0

  # ==================== 性能优化参数 ====================
  performance:
    # 发布频率 (Hz)
    # 0 表示立即发布每个接收的消息
    publish_rate: 0.0
    
    # 点云缓冲大小
    queue_size: 10
    
    # 是否使用多线程处理
    use_multi_threading: false

  # ==================== 调试选项 ====================
  debug:
    # 是否启用详细日志
    verbose: false
    
    # 是否保存处理结果 (debug模式)
    save_results: false
    
    # 保存路径
    save_path: "/tmp/depth_cluster_debug"

  # ==================== 坐标系信息 ====================
  frames:
    # 输入点云坐标系 (来自 gicp 的地图坐标系)
    input_frame: "map"
    
    # 输出点云坐标系 (统一为全局地图坐标系)
    output_frame: "map"
    
    # 机器人基座坐标系
    base_frame: "base_link"
    
    # TF 监听超时 (秒)
    tf_timeout: 1.0

  # ==================== 算法说明 ====================
  # 深度聚类流程:
  # 1. 生成深度图像: 根据雷达分辨率将3D点云投影到2D深度图
  # 2. 地面检测: 提取低高度点, 拟合地面平面
  # 3. 点标记: 标记地面点和非地面点
  # 4. 区域增长: 基于深度相似性的连通域分析
  # 5. 聚类合并: 合并相邻的小聚类
  # 6. 输出: 发布地面点云(绿色)和障碍物(彩色)
  #
  # 关键参数调优:
  # - 增大 min_cluster_size 可减少噪声
  # - 减小 distance_threshold 可更严格的地面检测
  # - 调整 vertical/horizontal_resolution 应匹配实际雷达

