# Depth Cluster 节点配置文件
# 优化版：支持雷达倾斜安装、自适应聚类半径、时间滤波

# 输入/输出话题
topics:
  input_cloud_topic: "/cloud_registered"
  output_ground_topic: "/ground_points_map1"
  output_obstacles_topic: "/obstacle_clusters_map"

# 深度聚类算法参数
clustering:
  vertical_resolution: 1.0
  horizontal_resolution: 0.2
  lidar_lines: 32
  min_cluster_size: 2                     # 最小聚类点数（欧几里得聚类）
  ground:
    max_slope_angle: 30.0                 # 地面最大允许角度（度）
  normal_estimation_k: 10                 # 法线估计K近邻点数
  depth_threshold: 1.0                    # 深度聚类阈值（米）
  use_euclidean: true                     # 使用欧几里得聚类
  euclidean:
    cluster_tolerance: 1.0                # 基础聚类半径（米），若启用自适应则作为初始参考
    min_cluster_size: 3
    max_cluster_size: 25000
  # 法线曲率阈值（仅接受曲率小于此值的点作为可靠种子）
  normal_curvature_threshold: 0.1
  # 自动估计参考法线（如果为true，则忽略 sensor_tilt_angle）
  auto_estimate_reference_normal: false
  # 若 auto_estimate 为 false，则使用以下倾斜角度
  sensor_tilt_angle_x: 30.0
  sensor_tilt_angle_y: 0.0
  # 新增优化选项
  adaptive_radius: false                  # 是否自适应欧几里得聚类半径
  temporal_filter: false                  # 是否启用时间平滑滤波
  temporal_window_size: 5                 # 时间窗口帧数

# 点云处理参数
filtering:
  range:
    min_range: 0.1
    max_range: 100.0
  z_range:
    min_height: -2.0
    max_height: 5.0

# 性能优化
performance:
  publish_rate: 0.0
  queue_size: 10
  use_multi_threading: false

# 调试选项
debug:
  verbose: false
  save_results: false
  save_path: "/tmp/depth_cluster_debug"

# 坐标系信息
frames:
  input_frame: "map"
  output_frame: "map"
  base_frame: "base_link"
  tf_timeout: 1.0