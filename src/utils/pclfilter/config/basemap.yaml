# 基础地图多边形禁区配置
# 坐标系: map (全局固定坐标系，原点为map原点)
# 用途: 机器人进入这些区域时，清空点云发布（避免建图/导航干扰）
# 格式: 多边形顶点列表，按逆时针顺序
# 应用场景: 充电桩区域、仓库入口、电梯内部等

polygons:
  # 示例1: 充电桩区域 (map坐标系，原点附近2x2米区域)
  - [ {x: -1.0, y: -1.0}, {x: 1.0, y: -1.0}, 
      {x: 1.0, y: 1.0}, {x: -1.0, y: 1.0} ]
  
  # 示例2: 仓库入口禁区 (map坐标 x:10-15m, y:5-10m)
  # - [ {x: 10.0, y: 5.0}, {x: 15.0, y: 5.0}, 
  #     {x: 15.0, y: 10.0}, {x: 10.0, y: 10.0} ]
  
  # 示例3: 电梯内部区域 (map坐标)
  # - [ {x: 20.0, y: 8.0}, {x: 22.5, y: 8.0}, 
  #     {x: 22.5, y: 10.0}, {x: 20.0, y: 10.0} ]
