# 区域多边形配置 (备用场景)
# 坐标系: map (全局固定坐标系)
# 用途: 与basemap.yaml功能相同，可用于不同场景切换
# 建议: 可用于室内/室外场景切换，或多楼层配置

polygons:
  # 室外场景示例: 停车场禁区 (map坐标)
  - [ {x: 30.0, y: 15.0}, {x: 35.0, y: 15.0}, 
      {x: 35.0, y: 20.0}, {x: 30.0, y: 20.0} ]
  
  # 楼梯区域 (map坐标)
  # - [ {x: 5.0, y: 8.0}, {x: 7.0, y: 8.0}, 
  #     {x: 7.0, y: 12.0}, {x: 5.0, y: 12.0} ]

# ==================== 配置说明 ====================
# 坐标系关系:
#   map (全局固定) -> base_link (机器人) -> camera_init (雷达)
#
# 使用场景:
#   1. init_basemap() : 使用 cube.yaml，在camera_init坐标系过滤固定区域
#   2. init_odom()    : 使用 basemap.yaml，根据里程计位置判断是否清空点云
#   3. init_mapwithodom() : 结合里程计和多边形判断
#
# 里程计话题: /odom (nav_msgs/Odometry) - 发布base_link在map中的位置
# 点云话题: /cloud_registered - 输入的配准点云
# 输出话题: /cloud_filter_baselink - 过滤后的点云（base_link坐标系）
#
# 性能优化建议:
#   - 多边形顶点数越少越好（4-6个点即可）
#   - 避免过于复杂的凹多边形
#   - 立方体过滤优先于多边形判断（效率更高）