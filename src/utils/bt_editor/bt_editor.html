                                                <th className="py-1">Type</th>
                                                <th className="py-1">Value</th>
                                                <th className="py-1 w-8"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {blackboard.map((item, idx) => (
                                                <tr key={idx} className="border-b last:border-0 hover:bg-white transition-colors">
                                                    <td className="p-1">
                                                        <input 
                                                            type="text" 
                                                            disabled={isSimulating}
                                                            className="w-full bg-transparent border-b border-transparent focus:border-blue-400 outline-none px-1 disabled:text-gray-500"
                                                            value={item.key}
                                                            onChange={(e) => updateBlackboardItem(idx, 'key', e.target.value)}
                                                        />
                                                    </td>
                                                    <td className="p-1">
                                                        <div className="flex items-center gap-1">
                                                            <select 
                                                                disabled={isSimulating}
                                                                className="w-full bg-transparent border-b border-transparent focus:border-blue-400 outline-none disabled:text-gray-500"
                                                                value={item.type}
                                                                onChange={(e) => updateBlackboardItem(idx, 'type', e.target.value)}
                                                            >
                                                                <option value="int">Int</option>
                                                                <option value="float">Float</option>
                                                                <option value="double">Double</option>
                                                                <option value="string">String</option>
                                                                <option value="boolean">Boolean</option>
                                                                <option value="enum">Enum</option>
                                                            </select>
                                                            {item.type === 'enum' && !isSimulating && (
                                                                <button onClick={() => setEditingEnumIndex(idx)} className="text-gray-400 hover:text-blue-500">
                                                                    <Icons.Settings size={12} />
                                                                </button>
                                                            )}
                                                        </div>
                                                    </td>
                                                    <td className="p-1">
                                                        {item.type === 'boolean' ? (
                                                            <select 
                                                                disabled={isSimulating}
                                                                className={`w-full bg-transparent border-b border-transparent focus:border-blue-400 outline-none font-bold ${isSimulating ? 'text-gray-600' : 'text-blue-600'}`}
                                                                value={item.value.toString()}
                                                                onChange={(e) => updateBlackboardItem(idx, 'value', e.target.value === 'true')}
                                                            >
                                                                <option value="true">True</option>
                                                                <option value="false">False</option>
                                                            </select>
                                                        ) : item.type === 'enum' ? (
                                                            <select 
                                                                disabled={isSimulating}
                                                                className={`w-full bg-transparent border-b border-transparent focus:border-blue-400 outline-none font-bold ${isSimulating ? 'text-gray-600' : 'text-blue-600'}`}
                                                                value={item.value}
                                                                onChange={(e) => updateBlackboardItem(idx, 'value', e.target.value)}
                                                            >
                                                                {item.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                                            </select>
                                                        ) : (
                                                            <input 
                                                                type={['int', 'float', 'double'].includes(item.type) ? 'number' : 'text'}
                                                                disabled={isSimulating}
                                                                className={`w-full bg-transparent border-b border-transparent focus:border-blue-400 outline-none px-1 font-mono transition-colors duration-300 ${isSimulating ? 'text-green-600 font-bold bg-green-50' : 'text-blue-600'}`}
                                                                value={item.value}
                                                                step={item.type === 'int' ? 1 : 0.1}
                                                                onChange={(e) => updateBlackboardItem(idx, 'value', ['int', 'float', 'double'].includes(item.type) ? parseFloat(e.target.value) : e.target.value)}
                                                            />
                                                        )}
                                                    </td>
                                                    <td className="p-1 text-center">
                                                        {!isSimulating && (
                                                            <button onClick={() => deleteBlackboardItem(idx)} className="text-gray-400 hover:text-red-500">
                                                                <Icons.Minus size={12} />
                                                            </button>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                            {blackboard.length === 0 && (
                                                <tr>
                                                    <td colSpan="4" className="text-center py-4 text-gray-400 italic">暂无变量</td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BehaviorTreeEditor />);
    </script>
</body>
</html>
