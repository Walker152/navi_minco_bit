<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentry BT Visualizer Pro (ROS2 Enhanced)</title>
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ROS Libs -->
    <script src="https://unpkg.com/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script src="https://unpkg.com/roslib@1.3.0/build/roslib.min.js"></script>

    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes flash-green { 0% { background-color: #dcfce7; } 100% { background-color: transparent; } }
        @keyframes flash-blue { 0% { background-color: #dbeafe; } 100% { background-color: transparent; } }
        .animate-flash { animation: flash-green 1s ease-out; }
        .animate-flash-pub { animation: flash-blue 0.5s ease-out; }
        .ros-connected { color: #16a34a; }
        .ros-disconnected { color: #dc2626; }
        
        /* Resizer Handles */
        .resizer-col { width: 5px; cursor: col-resize; position: absolute; top: 0; bottom: 0; left: 0; z-index: 50; transition: background 0.2s; }
        .resizer-col:hover { background: #3b82f6; }
        .resizer-row { height: 5px; cursor: row-resize; position: absolute; top: 0; left: 0; right: 0; z-index: 50; transition: background 0.2s; }
        .resizer-row:hover { background: #3b82f6; }
    </style>
</head>
<body>
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useCallback, useRef, useEffect, useMemo } = React;

        // --- Icons ---
        const Icon = ({ path, className, size = 16, ...props }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{path}</svg>);
        const Icons = {
            Activity: (p) => <Icon {...p} path={<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>} />,
            Zap: (p) => <Icon {...p} path={<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>} />,
            ArrowRight: (p) => <Icon {...p} path={<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>} />,
            HelpCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            RefreshCw: (p) => <Icon {...p} path={<><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>} />,
            Play: (p) => <Icon {...p} path={<polygon points="5 3 19 12 5 21 5 3"/>} />,
            Square: (p) => <Icon {...p} path={<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>} />,
            FileCode: (p) => <Icon {...p} path={<><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="m10 13-2 2 2 2"/><path d="m14 17 2-2-2-2"/></>} />,
            Settings: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></>} />,
            Trash2: (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />,
            Database: (p) => <Icon {...p} path={<><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></>} />,
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Minus: (p) => <Icon {...p} path={<line x1="5" y1="12" x2="19" y2="12"/>} />,
            X: (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />,
            Copy: (p) => <Icon {...p} path={<><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>} />,
            Check: (p) => <Icon {...p} path={<polyline points="20 6 9 17 4 12"/>} />,
            Download: (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>} />,
            Wifi: (p) => <Icon {...p} path={<path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>} />,
            WifiOff: (p) => <Icon {...p} path={<><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></>} />,
            Send: (p) => <Icon {...p} path={<><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>} />,
            Inbox: (p) => <Icon {...p} path={<><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></>} />,
            Server: (p) => <Icon {...p} path={<><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></>} />
        };

        const NODE_TYPES = {
            ROOT: { label: 'Root', color: '#1e293b', icon: Icons.Zap, type: 'ROOT', desc: '树的根节点' },
            SEQUENCE: { label: 'Sequence', color: '#f59e0b', icon: Icons.ArrowRight, type: 'SEQUENCE', desc: '按顺序执行，全成功才成功' },
            FALLBACK: { label: 'Fallback', color: '#8b5cf6', icon: Icons.HelpCircle, type: 'FALLBACK', desc: '按顺序执行，有一个成功就成功' },
            ACTION: { label: 'Action', color: '#3b82f6', icon: Icons.Activity, type: 'ACTION', desc: '执行动作与ROS交互' },
            CONDITION: { label: 'Condition', color: '#10b981', icon: Icons.AlertCircle, type: 'CONDITION', desc: '检查变量与ROS话题' },
            DECORATOR: { label: 'Decorator', color: '#ec4899', icon: Icons.RefreshCw, type: 'DECORATOR', desc: '装饰并修改子节点结果' },
        };

        const NODE_WIDTH = 160;
        const NODE_HEIGHT = 80;
        const CANVAS_OFFSET = 5000;

        const INITIAL_NODES = [{ id: 'root', type: 'ROOT', x: 100, y: 300, data: { label: 'Root', status: 'IDLE' } }];
        const INITIAL_BLACKBOARD = [
            { key: 'health', value: 400, type: 'int' },
            { key: 'speed', value: 1.5, type: 'float' },
            { key: 'target_valid', value: false, type: 'boolean' },
            { key: 'nav_status', value: 'IDLE', type: 'enum', enumName: 'NavStatus', options: ['IDLE', 'RUNNING', 'SUCCESS', 'FAILURE', 'PENDING'] },
            { key: 'current_mode', value: 'PATROL', type: 'enum', enumName: 'NavMode', options: ['PATROL', 'ATTACK', 'RETREAT', 'RESPONSE'] }
        ];

        // --- Helpers ---
        const getBezierPath = (x1, y1, x2, y2) => {
            const dist = Math.abs(x2 - x1);
            const controlOffset = Math.max(dist * 0.5, 60);
            return `M ${x1} ${y1} C ${x1} ${y1 + controlOffset} ${x2} ${y2 - controlOffset} ${x2} ${y2}`;
        };
        const generateId = (prefix) => `${prefix}-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
        const downloadFile = (filename, content) => {
            const element = document.createElement('a');
            const file = new Blob([content], {type: 'text/plain'});
            element.href = URL.createObjectURL(file);
            element.download = filename;
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        };

        // --- ROS2 Type Helpers ---
        const rosToCppType = (rosType) => {
            if (!rosType) return 'auto';
            return rosType.replace('/', '::msg::');
        };
        const rosToHeader = (rosType) => {
            if (!rosType) return '';
            const parts = rosType.split('/');
            if (parts.length < 2) return '';
            const pkg = parts[0];
            const msg = parts[1].replace(/[A-Z]/g, letter => `_${letter.toLowerCase()}`).replace(/^_/, '');
            return `#include <${pkg}/msg/${msg}.hpp>`;
        };

        // Predefined field suggestions for common ROS types
        const getFieldSuggestions = (msgType) => {
            if (!msgType) return [];
            if (msgType.includes('Int') || msgType.includes('Float') || msgType.includes('String') || msgType.includes('Bool')) return ['data'];
            if (msgType === 'geometry_msgs/Pose') return ['position.x', 'position.y', 'orientation.z', 'orientation.w'];
            if (msgType === 'geometry_msgs/Twist') return ['linear.x', 'angular.z'];
            if (msgType === 'std_msgs/Header') return ['stamp.sec', 'frame_id'];
            if (msgType === 'sensor_msgs/BatteryState') return ['voltage', 'percentage'];
            return [];
        };

        // --- Code Generators ---
        const generateROSCpp = (nodes, blackboard, edges) => {
            const actions = [];
            const conditions = [];
            const seenLabels = new Set();
            const enumDefinitions = new Map();

            // Collect enums from blackboard
            blackboard.forEach(item => {
                if (item.type === 'enum' && item.enumName) {
                    enumDefinitions.set(item.enumName, item.options || []);
                }
            });

            // Standard Sentry Enums & Structs (Base Content)
            const baseNavZone = `
  struct Point2D { double x; double y; };

  struct Area_Square {
    Point2D top_left;
    Point2D bottom_right;
    bool contains(const Point2D& point) const {
      double min_x = std::min(top_left.x, bottom_right.x);
      double max_x = std::max(top_left.x, bottom_right.x);
      double min_y = std::min(top_left.y, bottom_right.y);
      double max_y = std::max(top_left.y, bottom_right.y);
      return (point.x >= min_x && point.x <= max_x && point.y >= min_y && point.y <= max_y);
    }
  };
`;

            // Collect Custom Nodes
            nodes.forEach(node => {
                if (node.type === 'ACTION' || node.type === 'CONDITION') {
                    const className = (node.data.label || "Unnamed").replace(/\s+/g, '');
                    if (!seenLabels.has(className)) {
                        seenLabels.add(className);
                        const n = { ...node, className };
                        if (node.type === 'ACTION') actions.push(n); else conditions.push(n);
                    }
                }
            });

            // 1. Generate nav_zone.hpp
            let navZoneHpp = `#pragma once\n\n#include <geometry_msgs/msg/point.hpp>\n#include <geometry_msgs/msg/pose.hpp>\n#include <vector>\n#include <algorithm>\n\n//ROS2\n#include <rclcpp/rclcpp.hpp>\n#include <rclcpp_action/rclcpp_action.hpp>\n#include <std_msgs/msg/int32.hpp>\n\nnamespace Sentry_BT\n{\n${baseNavZone}\n`;
            
            // Add Enums
            enumDefinitions.forEach((options, name) => {
                navZoneHpp += `  enum class ${name} {\n    ${options.join(',\n    ')}\n  };\n\n`;
            });
            // Standard Externs
            navZoneHpp += `  extern std::vector<std::string> current_nav_status;\n  extern std::vector<std::string> mode_names;\n  extern std::vector<Point2D> nav_points;\n  extern std::vector<Point2D> patrol_points_normal;\n  extern std::vector<int> patrol_points_milliseconds;\n  extern std::vector<Point2D> patrol_points_attack;\n} // namespace Sentry_BT\n`;

            // 2. Generate nav_zone.cpp (Simplified)
            const navZoneCpp = `#include "nav_zone.hpp"\n\nnamespace Sentry_BT\n{\n  // Define your points here (Placeholder from Editor)\n  std::vector<Point2D> nav_points = {{0.0, 0.0}};\n  std::vector<Point2D> patrol_points_normal = {{0.0, 0.0}};\n  std::vector<int> patrol_points_milliseconds = {1000};\n  std::vector<Point2D> patrol_points_attack = {{0.0, 0.0}};\n\n  std::vector<std::string> current_nav_status = {"IDLE", "RUNNING", "SUCCESS", "FAILURE"};\n  std::vector<std::string> mode_names = {"PATROL", "ATTACK", "RETREAT", "RESPONSE"};\n}`;

            // 3. Generate blackboard.hpp
            let blackboardHpp = `#pragma once\n\n#include "nav_zone.hpp"\n#include <behaviortree_cpp_v3/blackboard.h>\n#include <behaviortree_cpp_v3/bt_factory.h>\n#include <geometry_msgs/msg/point.hpp>\n#include <geometry_msgs/msg/pose.hpp>\n\nnamespace Sentry_BT\n{\n  class Blackboard\n  {\n  private:\n    std::shared_ptr<BT::Blackboard> blackboard_;\n\n  public:\n    Blackboard()\n    {\n      blackboard_ = BT::Blackboard::create();\n\n      // Init Variables\n`;
            blackboard.forEach(item => {
                let valStr = item.value;
                if (item.type === 'string') valStr = `"${item.value}"`;
                else if (item.type === 'boolean') valStr = item.value ? 'true' : 'false';
                else if (item.type === 'float') valStr = `${item.value}f`;
                else if (item.type === 'enum') valStr = `static_cast<int>(${item.enumName}::${item.value})`;
                blackboardHpp += `      blackboard_->set("${item.key}", ${valStr});\n`;
            });
            blackboardHpp += `    }\n\n    template <typename T> void set(const std::string& key, const T& value) { blackboard_->set(key, value); }\n    template <typename T> auto get(const std::string& key) { return blackboard_->get<T>(key); }\n    std::shared_ptr<BT::Blackboard> getBTBlackboard() { return blackboard_; }\n  };\n} // namespace Sentry_BT`;

            // Helper for logic generation
            const getCppType = (item) => {
                if(!item) return 'auto';
                if(item.type === 'string') return 'std::string';
                if(item.type === 'boolean') return 'bool';
                if(item.type === 'float') return 'float';
                return 'int'; // int, enum, double -> int/double (simplified)
            };

            // 4. Actions Header
            const actionsHpp = `#pragma once\n\n#include <behaviortree_cpp_v3/action_node.h>\n#include "blackboard.hpp"\n#include "nav_zone.hpp"\n#include <rclcpp/rclcpp.hpp>\n\nnamespace Sentry_BT\n{\n${actions.map(n => `class ${n.className} : public BT::SyncActionNode\n{\npublic:\n  ${n.className}(const std::string& name, const BT::NodeConfiguration& config) : BT::SyncActionNode(name, config) {}\n  static BT::PortsList providedPorts() { return {}; }\n  BT::NodeStatus tick() override;\n};`).join('\n')}\n}`;

            // 5. Actions Source
            const actionsCpp = `#include "auto_actions.hpp"\n#include <iostream>\n\nnamespace Sentry_BT\n{\n${actions.map(node => {
                let body = '';
                
                // ROS Logic Generation
                const rosPorts = node.data.rosPorts || [];
                let rosLogic = '';
                rosPorts.forEach(port => {
                    const cppType = rosToCppType(port.msgType);
                    const topic = port.topic;
                    const field = port.fieldPath || 'data';
                    const bbVar = port.varKey;
                    
                    if (port.type === 'PUB') {
                        rosLogic += `\n    // PUB: ${topic}\n    auto msg_${port.id} = ${cppType}();\n    // TODO: Assign fields from blackboard if needed\n    // msg_${port.id}.${field} = ...;\n    // publisher_->publish(msg_${port.id});\n`;
                    } else if (port.type === 'CLI') {
                        rosLogic += `\n    // CLI: ${topic}\n    // auto request = ...;\n    // auto result = client_->async_send_request(request);\n`;
                    }
                });

                const mode = node.data.logicMode || 'simple';
                if(mode === 'custom') {
                    body = node.data.customCode || 'return BT::NodeStatus::SUCCESS;';
                } else if (mode === 'complex') {
                    body = '// Complex logic placeholder\n    return BT::NodeStatus::SUCCESS;';
                } else {
                    // Simple
                    const bbItem = blackboard.find(b => b.key === node.data.variable);
                    const type = getCppType(bbItem);
                    let val = node.data.value;
                    if(bbItem?.type==='string') val=`"${val}"`;
                    else if(bbItem?.type==='float') val=`${val}f`;
                    else if(bbItem?.type==='enum') val=`static_cast<int>(${bbItem.enumName}::${val})`;
                    
                    const op = node.data.op || '=';
                    if(op === '=') body = `config().blackboard->set<${type}>("${node.data.variable}", ${val});`;
                    else body = `// Op ${op} implementation\n`;
                    body += `\n    return BT::NodeStatus::SUCCESS;`;
                }
                return `BT::NodeStatus ${node.className}::tick() {\n    ${rosLogic.replace(/\n/g, '\n    ')}\n    ${body.replace(/\n/g, '\n    ')}\n}`;
            }).join('\n\n')}\n}`;

            // 6. Conditions Header
            const conditionsHpp = `#pragma once\n\n#include <behaviortree_cpp_v3/condition_node.h>\n#include "blackboard.hpp"\n#include "nav_zone.hpp"\n\nnamespace Sentry_BT\n{\n${conditions.map(n => `class ${n.className} : public BT::ConditionNode\n{\npublic:\n  ${n.className}(const std::string& name, const BT::NodeConfiguration& config) : BT::ConditionNode(name, config) {}\n  static BT::PortsList providedPorts() { return {}; }\n  BT::NodeStatus tick() override;\n};`).join('\n')}\n}`;

            // 7. Conditions Source
            const conditionsCpp = `#include "auto_conditions.hpp"\n#include <iostream>\n\nnamespace Sentry_BT\n{\n${conditions.map(node => {
                let body = '';
                
                // ROS Logic Generation
                const rosPorts = node.data.rosPorts || [];
                let rosLogic = '';
                rosPorts.forEach(port => {
                    if (port.type === 'SUB') {
                        rosLogic += `\n    // SUB: ${port.topic}\n    // Check received message or update blackboard\n`;
                    }
                });

                const mode = node.data.logicMode || 'simple';
                if(mode === 'custom') {
                    body = node.data.customCode || 'return BT::NodeStatus::FAILURE;';
                } else if (mode === 'complex') {
                    body = '// Complex logic placeholder\n    return BT::NodeStatus::SUCCESS;';
                } else {
                    const bbItem = blackboard.find(b => b.key === node.data.variable);
                    const type = getCppType(bbItem);
                    let val = node.data.value;
                    if(bbItem?.type==='string') val=`"${val}"`;
                    else if(bbItem?.type==='float') val=`${val}f`;
                    else if(bbItem?.type==='enum') val=`static_cast<int>(${bbItem.enumName}::${val})`;
                    const op = node.data.operator || '==';
                    body = `auto res = config().blackboard->get<${type}>("${node.data.variable}");\n    if(!res) return BT::NodeStatus::FAILURE;\n    return (res.value() ${op} ${val}) ? BT::NodeStatus::SUCCESS : BT::NodeStatus::FAILURE;`;
                }
                return `BT::NodeStatus ${node.className}::tick() {\n    ${rosLogic.replace(/\n/g, '\n    ')}\n    ${body.replace(/\n/g, '\n    ')}\n}`;
            }).join('\n\n')}\n}`;

            // 8. Generate XML
            const buildTree = (parentId) => {
                const childrenEdges = edges.filter(e => e.source === parentId);
                const childrenNodes = childrenEdges.map(e => nodes.find(n => n.id === e.target)).filter(n => n).sort((a, b) => a.x - b.x);
                let xml = "";
                childrenNodes.forEach(node => {
                    const typeLabel = NODE_TYPES[node.type]?.label || "Action";
                    const nodeName = node.data.label || typeLabel;
                    // Map generic types to specific class names if needed, or use label as ID
                    const tag = (node.type === 'ACTION' || node.type === 'CONDITION') ? nodeName.replace(/\s+/g, '') : typeLabel;
                    const childrenXML = buildTree(node.id);
                    if (childrenXML) xml += `<${tag} name="${nodeName}">\n${childrenXML}</${tag}>\n`;
                    else xml += `<${tag} name="${nodeName}" />\n`;
                });
                return xml.split('\n').map(line => line ? '    ' + line : '').join('\n');
            };
            const rootNode = nodes.find(n => n.type === 'ROOT');
            const xmlContent = rootNode ? `<root main_tree_to_execute="MainTree">\n  <BehaviorTree ID="MainTree">\n    <Root>\n${buildTree(rootNode.id)}    </Root>\n  </BehaviorTree>\n</root>` : '<!-- No Root -->';

            return {
                'nav_zone.hpp': navZoneHpp,
                'nav_zone.cpp': navZoneCpp,
                'blackboard.hpp': blackboardHpp,
                'auto_actions.hpp': actionsHpp,
                'auto_actions.cpp': actionsCpp,
                'auto_conditions.hpp': conditionsHpp,
                'auto_conditions.cpp': conditionsCpp,
                'behavior_tree.xml': xmlContent
            };
        };
