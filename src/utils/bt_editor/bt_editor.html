        // ----------------------- MAIN COMPONENT -----------------------
        function BehaviorTreeEditor() {
            const [nodes, setNodes] = useState(INITIAL_NODES);
            const [edges, setEdges] = useState([]);
            const [selectedNodeId, setSelectedNodeId] = useState(null);
            const [blackboard, setBlackboard] = useState(INITIAL_BLACKBOARD);
            const [showCodeModal, setShowCodeModal] = useState(false);
            const [generatedFiles, setGeneratedFiles] = useState({});
            const [editingEnumIndex, setEditingEnumIndex] = useState(null);
            const [showROSModal, setShowROSModal] = useState(false);
            
            // ROS State
            const [ros, setRos] = useState(null);
            const [rosStatus, setRosStatus] = useState('Disconnected');
            const [rosTopics, setRosTopics] = useState([]);
            const [rosServices, setRosServices] = useState([]);
            const [rosConfig, setRosConfig] = useState({ url: 'ws://localhost:9090' });
            
            // Refs for Active ROS Objects
            const activeSubscribers = useRef({});
            const activePublishers = useRef({});
            
            // Layout State
            const [view, setView] = useState({ x: 0, y: 0, k: 1 });
            const [isPanning, setIsPanning] = useState(false);
            const [draggingNodeId, setDraggingNodeId] = useState(null);
            const [connectingSourceId, setConnectingSourceId] = useState(null);
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const [lastMousePos, setLastMousePos] = useState({ x: 0, y: 0 });
            const [rightPanelWidth, setRightPanelWidth] = useState(320);
            const [bottomPanelHeight, setBottomPanelHeight] = useState(250);
            const [isResizingPanel, setIsResizingPanel] = useState(false);
            const [isResizingBottom, setIsResizingBottom] = useState(false);
            const [isSimulating, setIsSimulating] = useState(false);
            
            const simulationRef = useRef(null);
            const canvasRef = useRef(null);
            const nodesRef = useRef(nodes);
            const blackboardRef = useRef(blackboard);
            
            // Keep refs in sync for simulation loop
            useEffect(() => { nodesRef.current = nodes; }, [nodes]);
            useEffect(() => { blackboardRef.current = blackboard; }, [blackboard]);

            const connectROS = (url) => {
                setRosConfig({ url });
                if (ros) ros.close();
                const newRos = new ROSLIB.Ros({ url: url });
                newRos.on('connection', () => { 
                    setRosStatus('Connected'); 
                    newRos.getTopics((r) => setRosTopics(r.topics.map((n, i) => ({ name: n, type: r.types[i] })))); 
                    newRos.getServices((r) => setRosServices(r)); 
                });
                newRos.on('error', () => setRosStatus('Error'));
                newRos.on('close', () => setRosStatus('Disconnected'));
                setRos(newRos);
            };

            // Helper to get nested value
            const getNestedValue = (obj, path) => {
                return path.split('.').reduce((acc, part) => acc && acc[part], obj);
            };

            // --- ROS Subscription & Publishing Management ---
            // Re-evaluates whenever nodes change or connection status changes
            useEffect(() => {
                if (!ros || rosStatus !== 'Connected') return;

                // 1. Manage Subscribers (Always active if connected to see real-time data)
                const currentSubIds = new Set();
                nodes.forEach(node => {
                    const ports = node.data.rosPorts || [];
                    ports.forEach(port => {
                        if (port.type === 'SUB' && port.topic && port.varKey) {
                            currentSubIds.add(port.id);
                            // If not already subscribed, subscribe
                            if (!activeSubscribers.current[port.id]) {
                                const listener = new ROSLIB.Topic({
                                    ros: ros,
                                    name: port.topic,
                                    messageType: port.msgType || 'std_msgs/String'
                                });
                                listener.subscribe((message) => {
                                    let val = message;
                                    if (port.fieldPath) {
                                        val = getNestedValue(message, port.fieldPath);
                                    } else if (typeof message.data !== 'undefined') {
                                        val = message.data;
                                    }
                                    
                                    // Update blackboard
                                    setBlackboard(prev => {
                                        const next = [...prev];
                                        const idx = next.findIndex(b => b.key === port.varKey);
                                        if (idx !== -1) {
                                            // Type conversion
                                            if (next[idx].type === 'int') next[idx].value = parseInt(val) || 0;
                                            else if (next[idx].type === 'float') next[idx].value = parseFloat(val) || 0.0;
                                            else if (next[idx].type === 'boolean') next[idx].value = !!val;
                                            else next[idx].value = String(val);
                                            return next;
                                        }
                                        return prev;
                                    });
                                    
                                    // Flash node visual
                                    setNodes(prev => prev.map(n => n.id === node.id ? {...n, data: {...n.data, lastActive: Date.now()}} : n));
                                });
                                activeSubscribers.current[port.id] = listener;
                                console.log(`[ROS] Subscribed to ${port.topic}`);
                            }
                        }
                    });
                });

                // Cleanup old subscribers
                Object.keys(activeSubscribers.current).forEach(id => {
                    if (!currentSubIds.has(id)) {
                        activeSubscribers.current[id].unsubscribe();
                        delete activeSubscribers.current[id];
                    }
                });

                // 2. Manage Publishers (Advertise them so they show up in 'ros2 topic list')
                nodes.forEach(node => {
                    const ports = node.data.rosPorts || [];
                    ports.forEach(port => {
                        if (port.type === 'PUB' && port.topic) {
                            if (!activePublishers.current[port.id]) {
                                const pub = new ROSLIB.Topic({
                                    ros: ros,
                                    name: port.topic,
                                    messageType: port.msgType || 'std_msgs/String'
                                });
                                pub.advertise(); // Critical for 'ros2 topic list' visibility
                                activePublishers.current[port.id] = pub;
                                console.log(`[ROS] Advertised ${port.topic}`);
                            }
                        }
                    });
                });

            }, [ros, rosStatus, nodes]);

            const runStep = useCallback(() => {
                const currentNodes = nodesRef.current;
                const nodeMap = new Map(currentNodes.map(n => [n.id, n]));
                const childrenMap = {};
                edges.forEach(edge => { if (!childrenMap[edge.source]) childrenMap[edge.source] = []; childrenMap[edge.source].push(edge.target); });
                Object.keys(childrenMap).forEach(parentId => { childrenMap[parentId].sort((a, b) => (nodeMap.get(a)?.x || 0) - (nodeMap.get(b)?.x || 0)); });

                const state = simState.current;
                
                // Reset logic
                if (state.isResetting) {
                    state.waitCounter++;
                    if (state.waitCounter > 5) {
                        state.isResetting = false; state.stack = []; state.nodeStatuses = {}; state.actionTicks = {}; state.waitCounter = 0;
                        const root = currentNodes.find(n => n.type === 'ROOT');
                        if (root) state.stack.push({ nodeId: root.id, childIndex: 0 });
                    }
                    setNodes(ns => ns.map(n => ({...n, data: {...n.data, status: state.nodeStatuses[n.id] || 'IDLE'}})));
                    return;
                }

                if (state.stack.length === 0) {
                    const root = currentNodes.find(n => n.type === 'ROOT');
                    if (root) state.stack.push({ nodeId: root.id, childIndex: 0 });
                    else return;
                }

                const frame = state.stack[state.stack.length - 1];
                const nodeId = frame.nodeId;
                const node = nodeMap.get(nodeId);
                
                if (!node) { state.stack.pop(); return; }

                const children = childrenMap[nodeId] || [];
                let currentStatus = state.nodeStatuses[nodeId] || 'IDLE';

                if (currentStatus === 'IDLE') {
                    state.nodeStatuses[nodeId] = 'RUNNING';
                    setNodes(ns => ns.map(n => n.id === nodeId ? {...n, data: {...n.data, status: 'RUNNING'}} : n));
                    return;
                }

                let result = 'RUNNING';

                if (node.data.forcedStatus && node.data.forcedStatus !== 'NONE') {
                    result = node.data.forcedStatus;
                } else if (['ROOT', 'SEQUENCE', 'FALLBACK'].includes(node.type)) {
                    if (frame.childIndex >= children.length) {
                        result = node.type === 'FALLBACK' ? 'FAILURE' : 'SUCCESS';
                    } else {
                        const childId = children[frame.childIndex];
                        const childStatus = state.nodeStatuses[childId] || 'IDLE';
                        
                        if (childStatus === 'IDLE') {
                            state.stack.push({ nodeId: childId, childIndex: 0 });
                            return;
                        } else if (childStatus === 'RUNNING') {
                            return;
                        } else {
                            if (node.type === 'SEQUENCE' || node.type === 'ROOT') {
                                if (childStatus === 'FAILURE') result = 'FAILURE';
                                else frame.childIndex++;
                            } else {
                                if (childStatus === 'SUCCESS') result = 'SUCCESS';
                                else frame.childIndex++;
                            }
                        }
                    }
                } else if (['ACTION', 'CONDITION'].includes(node.type)) {
                    if (!state.actionTicks[nodeId]) state.actionTicks[nodeId] = 0;
                    state.actionTicks[nodeId]++;
                    
                    const requiredTicks = node.type === 'ACTION' ? 5 : 2; 
                    
                    if (state.actionTicks[nodeId] >= requiredTicks) {
                        
                        // --- ROS Publishing Logic inside Simulation ---
                        if (node.type === 'ACTION' && node.data.rosPorts && ros && rosStatus === 'Connected') {
                            node.data.rosPorts.forEach(port => {
                                if (port.type === 'PUB' && activePublishers.current[port.id]) {
                                    // Construct Message
                                    const payload = {};
                                    // Simple mapping: if varKey is set, use it. Otherwise empty/default.
                                    let val = 0; // Default
                                    if (port.varKey) {
                                        const bbVar = blackboardRef.current.find(b => b.key === port.varKey);
                                        if (bbVar) val = bbVar.value;
                                    }
                                    
                                    // Handle simple vs complex field paths
                                    if (port.fieldPath) {
                                        // Simple approximation for 'data' or nested 'linear.x'
                                        const parts = port.fieldPath.split('.');
                                        if (parts.length === 1) {
                                            payload[parts[0]] = val;
                                        } else {
                                            // Handle depth 2: a.b = val
                                            if (!payload[parts[0]]) payload[parts[0]] = {};
                                            payload[parts[0]][parts[1]] = val;
                                        }
                                    } else {
                                        // Default to 'data' for std_msgs
                                        payload['data'] = val;
                                    }
                                    
                                    const msg = new ROSLIB.Message(payload);
                                    activePublishers.current[port.id].publish(msg);
                                    console.log(`[Sim] Published to ${port.topic}:`, payload);
                                }
                            });
                        }
                        
                        // --- Regular Logic ---
                        const mode = node.data.logicMode || 'simple';
                        let pass = true;

                        if (mode === 'complex') {
                            const exprs = node.data.expressions || [];
                            const logicOp = node.data.logicOp || '&&';
                            if (exprs.length > 0) {
                                const results = exprs.map(ex => {
                                    const bb = blackboardRef.current.find(b => b.key === ex.variable);
                                    if (!bb) return false;
                                    let tVal = ex.value;
                                    if (['int','float','double'].includes(bb.type)) tVal = parseFloat(tVal);
                                    if (bb.type === 'boolean') tVal = (String(tVal) === 'true');
                                    
                                    const cVal = bb.value;
                                    switch(ex.operator) {
                                        case '==': return cVal == tVal;
                                        case '!=': return cVal != tVal;
                                        case '>': return cVal > tVal;
                                        case '<': return cVal < tVal;
                                        default: return false;
                                    }
                                });
                                pass = logicOp === '&&' ? results.every(r=>r) : results.some(r=>r);
                            }
                        } else if (mode === 'simple') {
                            const variable = node.data.variable;
                            const bbItem = blackboardRef.current.find(b => b.key === variable);
                            if (node.type === 'CONDITION') {
                                if (bbItem) {
                                    let tVal = node.data.value;
                                    if (['int','float','double'].includes(bbItem.type)) tVal = parseFloat(tVal);
                                    if (bbItem.type === 'boolean') tVal = (String(tVal) === 'true');
                                    const op = node.data.operator || '==';
                                    if (op === '==') pass = bbItem.value == tVal;
                                    else if (op === '!=') pass = bbItem.value != tVal;
                                    else if (op === '>') pass = bbItem.value > tVal;
                                    else if (op === '<') pass = bbItem.value < tVal;
                                } else pass = false;
                            } else {
                                if (bbItem) {
                                    let val = node.data.value;
                                    if (['int','float','double'].includes(bbItem.type)) val = parseFloat(val);
                                    if (bbItem.type === 'boolean') val = (String(val) === 'true');
                                    
                                    const newList = [...blackboardRef.current];
                                    const idx = newList.findIndex(b => b.key === variable);
                                    if (idx >= 0) {
                                        if (node.data.op === '=') newList[idx].value = val;
                                        else if (node.data.op === '+=') newList[idx].value += val;
                                        else if (node.data.op === '-=') newList[idx].value -= val;
                                        setBlackboard(newList);
                                    }
                                }
                                pass = true;
                            }
                        }
                        
                        result = pass ? 'SUCCESS' : 'FAILURE';
                        state.actionTicks[nodeId] = 0;
                    }
                } else if (node.type === 'DECORATOR') {
                     if (children.length > 0) {
                        const childId = children[0];
                        const childStatus = state.nodeStatuses[childId] || 'IDLE';
                        if (childStatus === 'IDLE') { state.stack.push({ nodeId: childId, childIndex: 0 }); return; }
                        if (childStatus === 'RUNNING') return;
                        
                        const subType = node.data.subType || 'Inverter';
                        if (subType === 'Inverter') result = childStatus === 'SUCCESS' ? 'FAILURE' : 'SUCCESS';
                        else if (subType === 'AlwaysSucceed') result = 'SUCCESS';
                        else if (subType === 'AlwaysFail') result = 'FAILURE';
                     } else {
                         result = 'SUCCESS';
                     }
                }

                if (result !== 'RUNNING') {
                    state.nodeStatuses[nodeId] = result;
                    state.stack.pop();
                    if (state.stack.length === 0) state.isResetting = true;
                }
                
                setNodes(ns => ns.map(n => ({...n, data: {...n.data, status: state.nodeStatuses[n.id] || 'IDLE'}})));

            }, [edges, ros, rosStatus]); // Added ROS deps

            const simState = useRef({ stack: [], nodeStatuses: {}, actionTicks: {}, waitCounter: 0, isResetting: false });

            useEffect(() => {
                if (isSimulating) {
                    simState.current = { stack: [], nodeStatuses: {}, actionTicks: {}, waitCounter: 0, isResetting: false };
                    simulationRef.current = setInterval(runStep, 200); 
                }
                return () => {
                    clearInterval(simulationRef.current);
                    if (isSimulating) setNodes(prev => prev.map(n => ({ ...n, data: { ...n.data, status: 'IDLE' } })));
                };
            }, [isSimulating, runStep]);

            const screenToWorld = useCallback((sx, sy) => {
                if (!canvasRef.current) return { x: 0, y: 0 };
                const rect = canvasRef.current.getBoundingClientRect();
                return { x: (sx - rect.left - view.x) / view.k, y: (sy - rect.top - view.y) / view.k };
            }, [view]);

            const handleGlobalMouseMove = (e) => {
                const worldPos = screenToWorld(e.clientX, e.clientY);
                setMousePos(worldPos);
                if (isPanning) { setView(v => ({ ...v, x: v.x + e.clientX - lastMousePos.x, y: v.y + e.clientY - lastMousePos.y })); setLastMousePos({ x: e.clientX, y: e.clientY }); }
                else if (draggingNodeId) { setNodes(prev => prev.map(n => n.id === draggingNodeId ? { ...n, x: Math.round((worldPos.x - NODE_WIDTH/2) / 20) * 20, y: Math.round((worldPos.y - 20) / 20) * 20 } : n)); }
                else if (isResizingPanel) { e.preventDefault(); setRightPanelWidth(Math.max(250, Math.min(document.body.clientWidth - e.clientX, 600))); }
                else if (isResizingBottom) { e.preventDefault(); setBottomPanelHeight(Math.max(150, Math.min(document.body.clientHeight - e.clientY, 600))); }
            };

            const handleGlobalMouseUp = () => { setIsPanning(false); setDraggingNodeId(null); setIsResizingPanel(false); setIsResizingBottom(false); };
            const openCodeModal = () => { setGeneratedFiles(generateROSCpp(nodes, blackboard, edges)); setShowCodeModal(true); };
            const deleteNode = (id) => { if (id === 'root') return; setNodes(prev => prev.filter(n => n.id !== id)); setEdges(prev => prev.filter(e => e.source !== id && e.target !== id)); if (selectedNodeId === id) setSelectedNodeId(null); };
            const updateNodeData = (key, value) => { setNodes(ns => ns.map(n => n.id === selectedNodeId ? {...n, data: {...n.data, [key]: value}} : n)); };
            
            // --- Helper Wrappers ---
            const addROSPort = (type) => { setNodes(ns => ns.map(n => n.id === selectedNodeId ? {...n, data: {...n.data, rosPorts: [...(n.data.rosPorts||[]), { id: generateId('p'), type, topic: '', msgType: 'std_msgs/String', varKey: '', fieldPath: 'data' }]}} : n)); };
            
            const updateROSPort = (portId, field, val) => { 
                setNodes(ns => ns.map(n => {
                    if (n.id === selectedNodeId) {
                        return {...n, data: {...n.data, rosPorts: n.data.rosPorts.map(p => {
                            if (p.id === portId) {
                                const newP = { ...p, [field]: val };
                                // Auto msg type and field suggestion
                                if (field === 'topic') {
                                    const matched = rosTopics.find(t => t.name === val);
                                    if (matched) {
                                        newP.msgType = matched.type;
                                        const suggestions = getFieldSuggestions(matched.type);
                                        if (suggestions.length > 0) newP.fieldPath = suggestions[0];
                                    }
                                }
                                return newP;
                            }
                            return p;
                        })}};
                    }
                    return n;
                }));
            };
            
            const removeROSPort = (portId) => { setNodes(ns => ns.map(n => n.id === selectedNodeId ? {...n, data: {...n.data, rosPorts: n.data.rosPorts.filter(p => p.id !== portId)}} : n)); };
            const addExpression = () => { setNodes(ns => ns.map(n => n.id === selectedNodeId ? {...n, data: {...n.data, expressions: [...(n.data.expressions||[]), { variable: blackboard[0]?.key, operator: '==', op: '=', value: '' }]}} : n)); };
            const updateExpression = (idx, field, val) => { setNodes(ns => ns.map(n => n.id === selectedNodeId ? {...n, data: {...n.data, expressions: n.data.expressions.map((ex, i) => i === idx ? { ...ex, [field]: val } : ex)}} : n)); };
            const removeExpression = (idx) => { setNodes(ns => ns.map(n => n.id === selectedNodeId ? {...n, data: {...n.data, expressions: n.data.expressions.filter((_, i) => i !== idx)}} : n)); };
            
            const addBlackboardItem = () => { setBlackboard(prev => [...prev, { key: `var_${prev.length}`, value: 0, type: 'int' }]); };
            const updateBlackboardItem = (index, field, val) => { setBlackboard(prev => { const next = [...prev]; const item = { ...next[index], [field]: val }; if(field==='type' && val==='enum'){ item.value='IDLE'; item.enumName='MyEnum'; item.options=['IDLE','RUNNING']; } next[index] = item; return next; }); };
            const deleteBlackboardItem = (index) => { setBlackboard(prev => prev.filter((_, i) => i !== index)); };
            const saveEnum = (name, options) => { if (editingEnumIndex !== null) { setBlackboard(prev => { const next = [...prev]; next[editingEnumIndex] = { ...next[editingEnumIndex], enumName: name, options: options, value: options[0] || '' }; return next; }); setEditingEnumIndex(null); } };

            const selectedNode = nodes.find(n => n.id === selectedNodeId);
            const selectedBBVar = selectedNode && blackboard.find(b => b.key === selectedNode.data.variable);

            return (
                <div className="flex flex-col h-screen w-full bg-slate-100 text-slate-800 font-sans select-none overflow-hidden" onMouseMove={handleGlobalMouseMove} onMouseUp={handleGlobalMouseUp}>
                    {showCodeModal && <CodePreviewModal files={generatedFiles} onClose={() => setShowCodeModal(false)} />}
                    {showROSModal && <ROSConnectionModal config={rosConfig} status={rosStatus} topics={rosTopics} services={rosServices} onConnect={connectROS} onClose={() => setShowROSModal(false)} />}
                    {editingEnumIndex !== null && <EnumEditorModal item={blackboard[editingEnumIndex]} onSave={saveEnum} onClose={() => setEditingEnumIndex(null)} />}
                    
                    {/* Header */}
                    <div className="h-14 bg-white border-b flex items-center px-4 justify-between shadow-sm z-30 flex-shrink-0">
                        <div className="flex items-center gap-2 font-bold text-xl text-slate-700"><Icons.Activity className="text-blue-600" /><span>BT Visualizer Pro</span></div>
                        <div className="flex items-center gap-2">
                           <button onClick={() => setShowROSModal(true)} className={`flex items-center gap-1 px-3 py-1.5 rounded transition mr-2 text-sm font-bold border ${rosStatus === 'Connected' ? 'bg-green-50 border-green-200 text-green-600' : 'bg-red-50 border-red-200 text-red-600'}`}>
                               {rosStatus === 'Connected' ? <Icons.Wifi size={16}/> : <Icons.WifiOff size={16}/>} ROS2: {rosStatus === 'Connected' ? '已连接' : '未连接'}
                           </button>
                           <button onClick={() => setIsSimulating(!isSimulating)} className={`flex items-center gap-1 px-3 py-1.5 rounded transition mr-2 ${isSimulating ? 'bg-red-100 text-red-600 hover:bg-red-200' : 'bg-green-100 text-green-600 hover:bg-green-200'}`}>{isSimulating ? <><Icons.Square size={16} /> 停止</> : <><Icons.Play size={16} /> 仿真</>}</button>
                           <button onClick={openCodeModal} className="flex items-center gap-1 px-3 py-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded transition text-sm"><Icons.FileCode size={16} /> 生成完整代码</button>
                           <button onClick={() => downloadFile('bt.xml', generateROSCpp(nodes, blackboard, edges)['behavior_tree.xml'])} className="flex items-center gap-1 px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded transition text-sm border border-blue-200"><Icons.Download size={16} /> XML</button>
                        </div>
                    </div>

                    <div className="flex flex-1 overflow-hidden relative">
                        {/* Left Panel */}
                        <div className="w-48 bg-white border-r flex flex-col p-3 shadow-sm z-20 flex-shrink-0 overflow-y-auto">
                            <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">节点库</h3>
                            <div className="space-y-2">
                                {Object.entries(NODE_TYPES).filter(([key]) => key !== 'ROOT').map(([key, def]) => (
                                    <div key={key} draggable onDragStart={(e) => e.dataTransfer.setData('nodeType', key)} className="group flex flex-col p-2 rounded cursor-grab border border-gray-200 bg-gray-50 hover:bg-white hover:border-blue-300 hover:shadow-md transition active:cursor-grabbing">
                                        <div className="flex items-center gap-2">{React.createElement(def.icon, { size: 16, color: def.color })}<span className="text-sm font-medium">{def.label}</span></div>
                                        <span className="text-[10px] text-gray-400 mt-1 pl-6">{def.desc}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Canvas */}
                        <div className="flex-1 bg-slate-100 relative overflow-hidden cursor-default" ref={canvasRef} onMouseDown={(e) => { if (e.button === 0 || e.button === 1) { setIsPanning(true); setLastMousePos({ x: e.clientX, y: e.clientY }); setSelectedNodeId(null); } }} onWheel={(e) => { if(e.ctrlKey||true){ e.preventDefault(); setView(v => ({ ...v, k: Math.min(3, Math.max(0.1, v.k - e.deltaY * 0.001)) })); } }} onDragOver={(e) => e.preventDefault()} onDrop={(e) => {
                             e.preventDefault(); const type = e.dataTransfer.getData('nodeType'); if (!type) return;
                             const worldPos = screenToWorld(e.clientX, e.clientY);
                             setNodes(prev => [...prev, { id: generateId('n'), type, x: worldPos.x - NODE_WIDTH/2, y: worldPos.y - 20, data: { label: NODE_TYPES[type].label, status: 'IDLE' } }]);
                        }}>
                            <div style={{ transform: `translate(${view.x}px, ${view.y}px) scale(${view.k})`, transformOrigin: '0 0', width: '100%', height: '100%' }}>
                                <div className="absolute pointer-events-none opacity-20" style={{ top: -CANVAS_OFFSET, left: -CANVAS_OFFSET, width: CANVAS_OFFSET * 2, height: CANVAS_OFFSET * 2, backgroundImage: 'radial-gradient(#94a3b8 1px, transparent 1px)', backgroundSize: '20px 20px' }} />
                                <svg className="absolute pointer-events-none overflow-visible z-0" style={{ top: -CANVAS_OFFSET, left: -CANVAS_OFFSET, width: CANVAS_OFFSET * 2, height: CANVAS_OFFSET * 2 }}>
                                    {edges.map(edge => {
                                        const source = nodes.find(n => n.id === edge.source); const target = nodes.find(n => n.id === edge.target);
                                        if (!source || !target) return null;
                                        const startX = source.x + NODE_WIDTH / 2 + CANVAS_OFFSET; const startY = source.y + NODE_HEIGHT + 4 + CANVAS_OFFSET;
                                        const endX = target.x + NODE_WIDTH / 2 + CANVAS_OFFSET; const endY = target.y - 4 + CANVAS_OFFSET;
                                        return <path key={edge.id} d={getBezierPath(startX, startY, endX, endY)} stroke="#475569" strokeWidth="2.5" fill="none" className="cursor-pointer hover:stroke-red-500 transition-colors pointer-events-auto" onClick={(e) => { e.stopPropagation(); setEdges(es => es.filter(x => x.id !== edge.id)); }} />;
                                    })}
                                    {connectingSourceId && <path d={getBezierPath(nodes.find(n => n.id === connectingSourceId).x + NODE_WIDTH / 2 + CANVAS_OFFSET, nodes.find(n => n.id === connectingSourceId).y + NODE_HEIGHT + 4 + CANVAS_OFFSET, mousePos.x + CANVAS_OFFSET, mousePos.y + CANVAS_OFFSET)} stroke="#3b82f6" strokeWidth="3" strokeDasharray="6,4" fill="none" className="pointer-events-none" />}
                                </svg>
                                {nodes.map(node => (
                                    <div key={node.id} onMouseDown={(e) => { e.stopPropagation(); if(e.button!==0)return; if(connectingSourceId && connectingSourceId!==node.id){ setEdges(p=>[...p,{id:generateId('e'),source:connectingSourceId,target:node.id}]); setConnectingSourceId(null); return; } setSelectedNodeId(node.id); setDraggingNodeId(node.id); }} style={{ transform: `translate(${node.x}px, ${node.y}px)`, width: `${NODE_WIDTH}px`, height: `${NODE_HEIGHT}px` }} className={`absolute flex flex-col bg-white rounded-md shadow-sm border transition-all duration-200 group z-10 ${selectedNodeId === node.id ? 'border-blue-500 shadow-md ring-2 ring-blue-100' : 'border-gray-200'} ${node.data.status === 'RUNNING' ? 'border-yellow-400 ring-2 ring-yellow-100' : node.data.status === 'SUCCESS' ? 'border-green-500 ring-2 ring-green-100' : node.data.status === 'FAILURE' ? 'border-red-500 ring-2 ring-red-100' : ''}`}>
                                        <div className="flex items-center gap-2 px-3 py-2 border-b border-gray-100 rounded-t-md pointer-events-none" style={{backgroundColor: `${NODE_TYPES[node.type].color}15`}}>{React.createElement(NODE_TYPES[node.type].icon, { size: 14, color: NODE_TYPES[node.type].color })}<span className="text-xs font-bold uppercase tracking-tight" style={{color: NODE_TYPES[node.type].color}}>{NODE_TYPES[node.type].label}</span></div>
                                        <div className="p-2 text-center pointer-events-none flex-1 flex flex-col justify-center">
                                            <div className="text-sm font-medium text-slate-700 truncate">{node.data.label}</div>
                                            {node.data.rosPorts && node.data.rosPorts.length > 0 && <div className="flex justify-center gap-1 mt-1">{node.data.rosPorts.map(p=><span key={p.id} className={`w-2 h-2 rounded-full ${p.type==='PUB'?'bg-blue-400':p.type==='SUB'?'bg-green-400':'bg-purple-400'}`}></span>)}</div>}
                                            {node.data.lastActive && (Date.now() - node.data.lastActive < 500) && <div className="absolute inset-0 rounded-md border-2 border-green-400 animate-flash pointer-events-none"></div>}
                                        </div>
                                        <div onMouseDown={(e) => { e.stopPropagation(); if(e.button===0) setConnectingSourceId(prev => prev === node.id ? null : node.id); }} className={`absolute -bottom-3 left-1/2 -translate-x-1/2 w-6 h-6 flex items-center justify-center cursor-pointer z-20 transition-transform hover:scale-125 ${connectingSourceId === node.id ? 'scale-125' : ''}`}><div className={`w-4 h-4 bg-white border border-gray-400 rounded-full flex items-center justify-center shadow-sm ${connectingSourceId === node.id ? 'bg-blue-500 border-blue-600' : 'hover:border-blue-500'}`}/></div>
                                        {node.type !== 'ROOT' && <div className="absolute -top-1.5 left-1/2 -translate-x-1/2 w-4 h-4 bg-white border border-gray-400 rounded-full z-20 flex items-center justify-center"/>}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Right Panel */}
                        <div className="flex flex-col z-20 shadow-xl border-l h-full relative" style={{ width: rightPanelWidth }}>
                            <div className="resizer-col hover:bg-blue-500" onMouseDown={(e) => { e.preventDefault(); setIsResizingPanel(true); }}></div>
                            <div className="flex-1 bg-white overflow-y-auto flex flex-col" style={{ height: `calc(100% - ${bottomPanelHeight}px)` }}>
                                {selectedNode ? (
                                    <div className="flex flex-col h-full">
                                        <div className="p-4 border-b flex items-center justify-between bg-gray-50"><div className="flex items-center gap-2 font-bold text-slate-700">{NODE_TYPES[selectedNode.type] && React.createElement(NODE_TYPES[selectedNode.type].icon, { size: 16, color: NODE_TYPES[selectedNode.type].color })} 属性编辑</div>{selectedNode.type !== 'ROOT' && <button onClick={() => deleteNode(selectedNode.id)} className="text-red-500 hover:bg-red-50 p-1.5 rounded transition"><Icons.Trash2 size={16} /></button>}</div>
                                        <div className="p-4 space-y-4 overflow-y-auto flex-1">
                                            <div className="space-y-1"><label className="text-xs font-semibold text-gray-500 uppercase">节点名称</label><input type="text" className="w-full px-3 py-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white" value={selectedNode.data.label} onChange={(e) => updateNodeData('label', e.target.value)} /></div>

                                            {/* ROS2 CONFIGURATION */}
                                            {(selectedNode.type === 'ACTION' || selectedNode.type === 'CONDITION') && (
                                                <div className="p-3 bg-indigo-50 border border-indigo-100 rounded space-y-3">
                                                    <div className="text-xs font-bold text-indigo-700 flex items-center justify-between">
                                                        <span><Icons.Wifi size={12} className="inline mr-1"/> ROS2 接口配置</span>
                                                    </div>
                                                    <div className="flex gap-1">
                                                        <button onClick={() => addROSPort('PUB')} className="flex-1 py-1 text-[10px] bg-white border border-indigo-200 rounded text-indigo-600 hover:bg-indigo-100 flex justify-center items-center gap-1"><Icons.Send size={10}/> 发布 (Pub)</button>
                                                        <button onClick={() => addROSPort('SUB')} className="flex-1 py-1 text-[10px] bg-white border border-indigo-200 rounded text-indigo-600 hover:bg-indigo-100 flex justify-center items-center gap-1"><Icons.Inbox size={10}/> 订阅 (Sub)</button>
                                                        <button onClick={() => addROSPort('CLI')} className="flex-1 py-1 text-[10px] bg-white border border-indigo-200 rounded text-indigo-600 hover:bg-indigo-100 flex justify-center items-center gap-1"><Icons.Server size={10}/> 请求 (Client)</button>
                                                    </div>
                                                    
                                                    {(selectedNode.data.rosPorts || []).map(port => (
                                                        <div key={port.id} className="bg-white p-2 rounded border border-indigo-200 shadow-sm space-y-2">
                                                            <div className="flex justify-between items-center pb-1 border-b border-gray-100">
                                                                <span className={`text-[10px] font-bold px-1.5 rounded ${port.type==='PUB'?'bg-blue-100 text-blue-700':port.type==='SUB'?'bg-green-100 text-green-700':'bg-purple-100 text-purple-700'}`}>{port.type === 'PUB' ? 'Publisher (发送)' : port.type === 'SUB' ? 'Subscriber (接收)' : 'Service Client (请求)'}</span>
                                                                <button onClick={() => removeROSPort(port.id)} className="text-gray-400 hover:text-red-500"><Icons.X size={12}/></button>
                                                            </div>
                                                            <div>
                                                                <label className="text-[10px] text-gray-500 block">话题 / 服务名 (Topic/Service)</label>
                                                                <input list={`topics-${port.id}`} type="text" className="w-full border rounded px-2 py-1 text-xs" value={port.topic} onChange={(e) => updateROSPort(port.id, 'topic', e.target.value)} placeholder="/topic_name" />
                                                                <datalist id={`topics-${port.id}`}>
                                                                    {port.type === 'CLI' ? rosServices.map(s => <option key={s} value={s}/>) : rosTopics.map(t => <option key={t.name} value={t.name}/>)}
                                                                </datalist>
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <div className="flex-1">
                                                                    <label className="text-[10px] text-gray-500 block">消息类型 (Type)</label>
                                                                    <input type="text" className="w-full border rounded px-2 py-1 text-xs font-mono" value={port.msgType} onChange={(e) => updateROSPort(port.id, 'msgType', e.target.value)} placeholder="std_msgs/String" />
                                                                </div>
                                                            </div>
                                                            
                                                            {/* 字段路径建议 */}
                                                            <div>
                                                                <label className="text-[10px] text-gray-500 block">消息字段路径 (Msg Field Path)</label>
                                                                <div className="relative">
                                                                    <input list={`fields-${port.id}`} type="text" className="w-full border rounded px-2 py-1 text-xs font-mono" value={port.fieldPath} onChange={(e) => updateROSPort(port.id, 'fieldPath', e.target.value)} placeholder="data" />
                                                                    <datalist id={`fields-${port.id}`}>
                                                                        {getFieldSuggestions(port.msgType).map(f => <option key={f} value={f}/>)}
                                                                    </datalist>
                                                                </div>
                                                                <div className="text-[9px] text-gray-400 mt-0.5">例如: data, linear.x, position.y</div>
                                                            </div>

                                                            <div className="flex gap-2">
                                                                <div className="flex-1">
                                                                    <label className="text-[10px] text-gray-500 block">
                                                                        {port.type === 'PUB' ? '读取黑板变量 (Source)' : port.type === 'SUB' ? '写入黑板变量 (Target)' : '关联黑板变量'}
                                                                    </label>
                                                                    <select className="w-full border rounded px-2 py-1 text-xs" value={port.varKey} onChange={(e) => updateROSPort(port.id, 'varKey', e.target.value)}>
                                                                        <option value="">不关联 (纯逻辑)</option>
                                                                        {blackboard.map(b => <option key={b.key} value={b.key}>{b.key} ({b.type})</option>)}
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            {/* LOGIC CONFIGURATION */}
                                            {(selectedNode.type === 'ACTION' || selectedNode.type === 'CONDITION') && (
                                                <div className="space-y-3">
                                                    <div className="flex items-center gap-2 p-1 bg-gray-100 rounded">
                                                        {['simple', 'complex', 'custom'].map(m => (
                                                            <button key={m} onClick={() => updateNodeData('logicMode', m)} className={`flex-1 py-1 text-xs rounded ${selectedNode.data.logicMode === m ? 'bg-white shadow text-blue-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>{m === 'simple' ? '简单逻辑' : m === 'complex' ? '组合逻辑' : '自定义代码'}</button>
                                                        ))}
                                                    </div>

                                                    {selectedNode.data.logicMode === 'custom' ? (
                                                        <div className="space-y-1">
                                                            <label className="text-xs font-semibold text-gray-500">Custom C++ Logic</label>
                                                            <textarea className="w-full border rounded p-2 text-xs font-mono h-32" placeholder="// Access ROS ports via: pub_id->publish(msg);" value={selectedNode.data.customCode || ''} onChange={(e) => updateNodeData('customCode', e.target.value)}></textarea>
                                                        </div>
                                                    ) : selectedNode.data.logicMode === 'complex' ? (
                                                        <div className="space-y-2">
                                                            {selectedNode.type === 'CONDITION' && (
                                                                <div className="flex items-center gap-2 mb-2">
                                                                    <span className="text-xs font-bold text-gray-500">逻辑关系:</span>
                                                                    <select className="border rounded text-xs p-1" value={selectedNode.data.logicOp || '&&'} onChange={(e) => updateNodeData('logicOp', e.target.value)}><option value="&&">AND (满足所有)</option><option value="||">OR (满足任一)</option></select>
                                                                </div>
                                                            )}
                                                            <div className="space-y-2">
                                                                {(selectedNode.data.expressions || []).map((ex, idx) => (
                                                                    <div key={idx} className="flex gap-1 items-center bg-gray-50 p-1 rounded border">
                                                                        <select className="w-24 text-xs border rounded p-1" value={ex.variable} onChange={(e) => updateExpression(idx, 'variable', e.target.value)}>{blackboard.map(b => <option key={b.key} value={b.key}>{b.key}</option>)}</select>
                                                                        {selectedNode.type === 'CONDITION' ? 
                                                                            <select className="w-12 text-xs border rounded p-1" value={ex.operator} onChange={(e) => updateExpression(idx, 'operator', e.target.value)}><option value="==">==</option><option value="!=">!=</option><option value=">">&gt;</option><option value="<">&lt;</option></select> 
                                                                            : <select className="w-12 text-xs border rounded p-1" value={ex.op} onChange={(e) => updateExpression(idx, 'op', e.target.value)}><option value="=">=</option><option value="+=">+=</option><option value="-=">-=</option></select>
                                                                        }
                                                                        <input type="text" className="flex-1 text-xs border rounded p-1 w-10" value={ex.value} onChange={(e) => updateExpression(idx, 'value', e.target.value)} />
                                                                        <button onClick={() => removeExpression(idx)} className="text-red-500 hover:bg-red-100 p-1 rounded"><Icons.Trash2 size={12} /></button>
                                                                    </div>
                                                                ))}
                                                                <button onClick={addExpression} className="w-full py-1 border dashed border-gray-300 rounded text-xs text-gray-500 hover:bg-gray-50 flex items-center justify-center gap-1"><Icons.Plus size={12}/> 添加条目</button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className={`p-3 border rounded space-y-3 ${selectedNode.type==='CONDITION'?'bg-green-50 border-green-100':'bg-blue-50 border-blue-100'}`}>
                                                            <div><label className="text-[10px] text-gray-500">变量</label><select className="w-full border rounded px-2 py-1 text-sm bg-white" value={selectedNode.data.variable || ''} onChange={(e) => updateNodeData('variable', e.target.value)}><option value="">选择变量...</option>{blackboard.map(b => <option key={b.key} value={b.key}>{b.key} ({b.type})</option>)}</select></div>
                                                            <div className="flex gap-2">
                                                                <div className="w-1/3"><label className="text-[10px] text-gray-500">操作符</label><select className="w-full border rounded px-2 py-1 text-sm bg-white" value={selectedNode.type==='CONDITION'?(selectedNode.data.operator||'=='):(selectedNode.data.op||'=')} onChange={(e) => updateNodeData(selectedNode.type==='CONDITION'?'operator':'op', e.target.value)}>{selectedNode.type==='CONDITION' ? <><option value="==">==</option><option value="!=">!=</option>{['int','float','double'].includes(selectedBBVar?.type) && <><option value=">">&gt;</option><option value="<">&lt;</option></>}</> : <><option value="=">Set</option>{['int','float','double'].includes(selectedBBVar?.type) && <option value="+=">Add</option>}{['int','float','double'].includes(selectedBBVar?.type) && <option value="-=">Sub</option>}</>}</select></div>
                                                                <div className="w-2/3"><label className="text-[10px] text-gray-500">值</label>{selectedBBVar?.type === 'enum' ? <select className="w-full border rounded px-2 py-1 text-sm bg-white" value={selectedNode.data.value} onChange={(e) => updateNodeData('value', e.target.value)}>{selectedBBVar.options.map(o=><option key={o} value={o}>{o}</option>)}</select> : <input type="text" className="w-full border rounded px-2 py-1 text-sm" value={selectedNode.data.value || ''} onChange={(e) => updateNodeData('value', e.target.value)} />}</div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                            {selectedNode.type === 'DECORATOR' && <div className="space-y-1"><label className="text-xs font-semibold text-gray-500 uppercase">装饰器类型</label><select className="w-full border rounded px-2 py-1.5 text-sm bg-white" value={selectedNode.data.subType || 'Inverter'} onChange={(e) => updateNodeData('subType', e.target.value)}><option value="Inverter">Inverter (取反)</option><option value="AlwaysSucceed">Always Succeed</option><option value="AlwaysFail">Always Fail</option></select></div>}
                                            <div className="space-y-1"><label className="text-xs font-semibold text-gray-500 uppercase">状态监控</label><div className={`px-2 py-1.5 rounded text-sm font-bold border text-center ${selectedNode.data.status === 'RUNNING' ? 'bg-yellow-50 text-yellow-600 border-yellow-200' : selectedNode.data.status === 'SUCCESS' ? 'bg-green-50 text-green-600 border-green-200' : selectedNode.data.status === 'FAILURE' ? 'bg-red-50 text-red-600 border-red-200' : 'bg-gray-50 text-gray-500 border-gray-200'}`}>{selectedNode.data.status || 'IDLE'}</div></div>
                                        </div>
                                    </div>
                                ) : <div className="flex flex-col items-center justify-center h-full text-gray-400"><Icons.Activity size={64} className="text-gray-200 mb-4" /><p className="font-medium">未选择节点</p></div>}
                            </div>

                            <div className="bg-gray-50 border-t flex flex-col relative shadow-inner" style={{ height: bottomPanelHeight }}>
                                <div className="resizer-row hover:bg-blue-500" onMouseDown={(e) => { e.preventDefault(); setIsResizingBottom(true); }}></div>
                                <div className="p-3 border-b bg-gray-100 flex items-center justify-between"><div className="font-bold text-xs text-slate-700 flex items-center gap-2"><Icons.Database size={14} /> 黑板 (Blackboard)</div><button onClick={addBlackboardItem} className="text-xs flex items-center gap-1 bg-white border px-2 py-1 rounded hover:bg-blue-50 text-blue-600"><Icons.Plus size={12} /> 添加变量</button></div>
                                <div className="flex-1 overflow-y-auto p-2">
                                    <table className="w-full text-xs text-left border-collapse">
                                        <thead><tr className="text-gray-500 border-b"><th className="py-1 pl-2">Key</th><th className="py-1">Type</th><th className="py-1">Value</th><th className="py-1 w-8"></th></tr></thead>
                                        <tbody>
                                            {blackboard.map((item, idx) => (
                                                <tr key={idx} className="border-b last:border-0 hover:bg-white transition-colors">
                                                    <td className="p-1"><input type="text" className="w-full bg-transparent border-b border-transparent focus:border-blue-400 outline-none px-1" value={item.key} onChange={(e) => updateBlackboardItem(idx, 'key', e.target.value)} /></td>
                                                    <td className="p-1"><select className="w-full bg-transparent border-b border-transparent focus:border-blue-400 outline-none" value={item.type} onChange={(e) => updateBlackboardItem(idx, 'type', e.target.value)}><option value="int">Int</option><option value="float">Float</option><option value="string">String</option><option value="boolean">Boolean</option><option value="enum">Enum</option></select></td>
                                                    <td className="p-1">
                                                        {item.type==='enum' ? <select className="w-full bg-transparent border-b border-transparent focus:border-blue-400 outline-none text-blue-600 font-bold" value={item.value} onChange={(e)=>updateBlackboardItem(idx,'value',e.target.value)}>{(item.options||[]).map(o=><option key={o} value={o}>{o}</option>)}</select> : <input type="text" className="w-full bg-transparent border-b border-transparent focus:border-blue-400 outline-none px-1 font-mono text-blue-600" value={item.value} onChange={(e) => updateBlackboardItem(idx, 'value', e.target.value)} />}
                                                    </td>
                                                    <td className="p-1 text-center flex items-center justify-center gap-1">
                                                        {item.type==='enum' && <button onClick={() => setEditingEnumIndex(idx)} className="text-gray-400 hover:text-blue-500"><Icons.Settings size={12}/></button>}
                                                        <button onClick={() => deleteBlackboardItem(idx)} className="text-gray-400 hover:text-red-500"><Icons.Minus size={12} /></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BehaviorTreeEditor />);
    </script>
</body>
</html>
