<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM Sentry BT Editor Ultimate</title>

    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ROS Libs -->
    <script src="https://unpkg.com/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script src="https://unpkg.com/roslib@1.3.0/build/roslib.min.js"></script>

    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes flash-green { 0% { background-color: #dcfce7; } 100% { background-color: transparent; } }
        .animate-flash { animation: flash-green 1s ease-out; }
        @keyframes slide-down { 0% { transform: translate(-50%, -100%); opacity: 0; } 100% { transform: translate(-50%, 0); opacity: 1; } }
        .animate-toast { animation: slide-down 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .resizer-col { width: 5px; cursor: col-resize; position: absolute; top: 0; bottom: 0; left: 0; z-index: 50; transition: background 0.2s; }
        .resizer-col:hover { background: #3b82f6; }
        .resizer-row { height: 5px; cursor: row-resize; position: absolute; top: 0; left: 0; right: 0; z-index: 50; transition: background 0.2s; }
        .resizer-row:hover { background: #3b82f6; }
    </style>
</head>
<body>
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useCallback, useRef, useEffect } = React;

        // ==========================================
        // 1. 图标库 (Icons)
        // ==========================================
        const Icon = ({ path, size = 16, className, ...props }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{path}</svg>);
        const Icons = {
            ArrowRight: (p) => <Icon {...p} path={<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>} />,
            HelpCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />,
            RefreshCw: (p) => <Icon {...p} path={<><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>} />,
            CheckCircle: (p) => <Icon {...p} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Activity: (p) => <Icon {...p} path={<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>} />,
            Upload: (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>} />,
            Download: (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>} />,
            Trash2: (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />,
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            X: (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />,
            Shield: (p) => <Icon {...p} path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>} />,
            Crosshair: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></>} />,
            Zap: (p) => <Icon {...p} path={<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>} />,
            Play: (p) => <Icon {...p} path={<polygon points="5 3 19 12 5 21 5 3"/>} />,
            Square: (p) => <Icon {...p} path={<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>} />,
            Database: (p) => <Icon {...p} path={<><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></>} />,
            Wifi: (p) => <Icon {...p} path={<path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>} />,
            WifiOff: (p) => <Icon {...p} path={<><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></>} />,
            FileCode: (p) => <Icon {...p} path={<><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="m10 13-2 2 2 2"/><path d="m14 17 2-2-2-2"/></>} />,
            Save: (p) => <Icon {...p} path={<><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>} />,
            Star: (p) => <Icon {...p} path={<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>} />,
            PanelLeft: (p) => <Icon {...p} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></>} />,
            PanelRight: (p) => <Icon {...p} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="15" y1="3" x2="15" y2="21"/></>} />
        };

        // ==========================================
        // 2. 节点基础定义 (Node Types Definitions)
        // ==========================================
        const BASE_NODE_TYPES = {
            Sequence: { label: 'Sequence', group: 'flow', baseType: 'SEQUENCE', color: '#f59e0b', icon: 'ArrowRight', desc: '按序执行，遇失败即断' },
            ReactiveSequence: { label: 'ReactiveSequence', group: 'flow', baseType: 'SEQUENCE', color: '#f59e0b', icon: 'RefreshCw', desc: '响应式按序执行，每Tick从头检查' },
            Fallback: { label: 'Fallback', group: 'flow', baseType: 'FALLBACK', color: '#8b5cf6', icon: 'HelpCircle', desc: '依次尝试，遇成功即断' },
            ReactiveFallback: { label: 'ReactiveFallback', group: 'flow', baseType: 'FALLBACK', color: '#8b5cf6', icon: 'RefreshCw', desc: '响应式尝试，高优抢占' },
            Parallel: { label: 'Parallel', group: 'flow', baseType: 'PARALLEL', color: '#0ea5e9', icon: 'Activity', desc: '并行执行所有子节点' },
            ForceSuccess: { label: 'ForceSuccess', group: 'decorator', baseType: 'DECORATOR', color: '#ec4899', icon: 'CheckCircle', desc: '强制子节点返回成功' },
            ForceFailure: { label: 'ForceFailure', group: 'decorator', baseType: 'DECORATOR', color: '#ec4899', icon: 'X', desc: '强制子节点返回失败' },
            Inverter: { label: 'Inverter', group: 'decorator', baseType: 'DECORATOR', color: '#ec4899', icon: 'RefreshCw', desc: '取反子节点结果' },
            Timeout: { label: 'Timeout', group: 'decorator', baseType: 'DECORATOR', color: '#ec4899', icon: 'AlertCircle', desc: '超时强行打断返回失败' },
            Repeat: { label: 'Repeat', group: 'decorator', baseType: 'DECORATOR', color: '#ec4899', icon: 'RefreshCw', desc: '重复执行子节点N次' },
            Action: { label: 'Action (Sync)', group: 'action', baseType: 'ACTION', color: '#3b82f6', icon: 'Activity', desc: '通用同步动作(即刻返回结果)' },
            AsyncAction: { label: 'AsyncAction', group: 'action', baseType: 'ACTION', color: '#3b82f6', icon: 'Activity', desc: '异步动作(返回RUNNING)' },
            Condition: { label: 'Condition', group: 'condition', baseType: 'CONDITION', color: '#10b981', icon: 'AlertCircle', desc: '通用条件判断' }
        };

        const INITIAL_BLACKBOARD = [
            { key: 'health', value: '400', type: 'float' },
            { key: 'enemy_outpost_destroyed', value: 'false', type: 'boolean' },
            { key: 'target_valid', value: 'false', type: 'boolean' },
            { key: 'current_mode', value: 'PATROL', type: 'enum', optionsStr: 'PATROL,ATTACK,RETREAT' }
        ];

        const NODE_WIDTH = 180;
        const NODE_HEIGHT = 70;
        const CANVAS_OFFSET = 5000;

        const generateId = (prefix) => `${prefix}-${Math.random().toString(36).substr(2, 9)}`;
        const downloadFile = (filename, content) => {
            const element = document.createElement('a');
            element.href = URL.createObjectURL(new Blob([content], {type: 'text/plain'}));
            element.download = filename;
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        };

        // ==========================================
        // 3. UI 子组件 (Modals & Toast)
        // ==========================================
        const ToastMessage = ({ message, onClose }) => {
            useEffect(() => {
                if (!message) return;
                // --- Timeout 设置为 5000ms ---
                const timer = setTimeout(onClose, 5000);
                return () => clearTimeout(timer);
            }, [message, onClose]);

            if (!message) return null;
            return (
                <div className="fixed top-20 left-1/2 z-50 animate-toast" style={{ transform: 'translateX(-50%)' }}>
                    <div className="bg-emerald-600 text-white px-6 py-4 rounded-lg shadow-xl flex items-center gap-3 border border-emerald-400">
                        <Icons.CheckCircle size={20}/>
                        <pre className="font-bold text-sm leading-tight whitespace-pre-wrap font-sans">{message}</pre>
                    </div>
                </div>
            );
        };

        const ROSConnectionModal = ({ config, onConnect, onClose, status }) => {
            const [url, setUrl] = useState(config.url || 'ws://localhost:9090');
            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
                    <div className="bg-white p-6 rounded-lg shadow-lg w-96">
                        <h3 className="font-bold mb-4 text-slate-700 flex items-center gap-2"><Icons.Wifi className="text-blue-500"/> ROS2 Bridge 连接</h3>
                        <p className="text-xs text-red-500 mb-2 font-bold">重要: 必须运行 `ros2 run rosapi rosapi_node`</p>
                        <p className="text-xs text-gray-500 mb-4">通过 rosbridge 连接。为拉取消息结构，请务必保证上方指令已在终端运行。</p>
                        <div className="mb-4">
                            <label className="block text-xs text-gray-500 mb-1">WebSocket URL</label>
                            <input className="w-full border p-2 rounded text-sm font-mono" value={url} onChange={(e) => setUrl(e.target.value)} placeholder="ws://localhost:9090"/>
                        </div>
                        <div className="flex items-center gap-2 mb-4 text-sm">
                            状态: <span className={status === 'Connected' ? 'text-green-600 font-bold' : status === 'Error' ? 'text-red-600 font-bold' : 'text-gray-500'}>{status}</span>
                        </div>
                        <div className="flex justify-end gap-2">
                            <button onClick={onClose} className="px-3 py-1 text-sm text-gray-500 hover:bg-gray-100 rounded">关闭</button>
                            <button onClick={() => onConnect(url)} className="px-3 py-1 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">
                                {status === 'Connected' ? '重新连接' : '连接'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const CodePreviewModal = ({ files, onClose }) => {
            const [activeTab, setActiveTab] = useState(Object.keys(files)[0]);
            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-10">
                    <div className="bg-white w-full max-w-5xl h-[80vh] rounded-lg shadow-2xl flex flex-col overflow-hidden">
                        <div className="flex items-center justify-between p-4 border-b bg-gray-50">
                            <h3 className="font-bold text-slate-700 flex items-center gap-2"><Icons.FileCode className="text-blue-600" /> 代码预览与导出</h3>
                            <div className="flex gap-2">
                                <button onClick={() => { Object.entries(files).forEach(([name, content]) => downloadFile(name, content)); }} className="flex items-center gap-1 bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700"><Icons.Download size={14} /> 下载所有</button>
                                <button onClick={onClose} className="p-1 hover:bg-gray-200 rounded"><Icons.X size={20}/></button>
                            </div>
                        </div>
                        <div className="flex border-b bg-gray-100 overflow-x-auto">{Object.keys(files).map(fileName => (<button key={fileName} onClick={() => setActiveTab(fileName)} className={`px-4 py-2 text-xs font-mono border-r whitespace-nowrap ${activeTab === fileName ? 'bg-white text-blue-600 font-bold border-t-2 border-t-blue-500' : 'text-gray-600 hover:bg-gray-200'}`}>{fileName}</button>))}</div>
                        <div className="flex-1 overflow-hidden relative group"><pre className="h-full overflow-auto p-4 text-xs font-mono bg-[#1e1e1e] text-gray-300">{files[activeTab]}</pre></div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 4. 核心编辑器主程序 (Main Application)
        // ==========================================
        function BehaviorTreeEditor() {
            // -- 状态定义 --
            const [customPresets, setCustomPresets] = useState(() => JSON.parse(localStorage.getItem('rm_bt_presets') || '[]'));
            const [showLibrary, setShowLibrary] = useState(true);
            const [showRightPanel, setShowRightPanel] = useState(true);
            
            const [nodes, setNodes] = useState([]);
            const [edges, setEdges] = useState([]);
            const [selectedNodeId, setSelectedNodeId] = useState(null);
            const [blackboard, setBlackboard] = useState(INITIAL_BLACKBOARD);
            
            // 视图状态
            const [view, setView] = useState({ x: 0, y: 0, k: 1 });
            const [isPanning, setIsPanning] = useState(false);
            const [draggingNodeId, setDraggingNodeId] = useState(null);
            const [connectingSourceId, setConnectingSourceId] = useState(null);
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const [lastMousePos, setLastMousePos] = useState({ x: 0, y: 0 });
            
            const [rightPanelWidth, setRightPanelWidth] = useState(380);
            const [bottomPanelHeight, setBottomPanelHeight] = useState(250);
            const [isResizingPanel, setIsResizingPanel] = useState(false);
            const [isResizingBottom, setIsResizingBottom] = useState(false);
            
            // 模态框, 反馈与 ROS
            const [showCodeModal, setShowCodeModal] = useState(false);
            const [showROSModal, setShowROSModal] = useState(false);
            const [presetToDelete, setPresetToDelete] = useState(null); // --- 自定义删除确认 UI 状态 ---
            
            const [generatedFiles, setGeneratedFiles] = useState({});
            const [toastMessage, setToastMessage] = useState(null);
            
            const [ros, setRos] = useState(null);
            const [rosStatus, setRosStatus] = useState('Disconnected');
            const [rosTopics, setRosTopics] = useState([]); 
            const [rosConfig, setRosConfig] = useState({ url: 'ws://localhost:9090' });
            
            // 仿真控制
            const [isSimulating, setIsSimulating] = useState(false);
            const canvasRef = useRef(null);
            const xmlInputRef = useRef(null);
            const cppInputRef = useRef(null);
            
            // 仿真内存
            const simMemory = useRef({ nodeStatus: {}, runningChild: {}, actionTimers: {}, needsReset: false });
            const tickTimer = useRef(null);
            const nodesRef = useRef(nodes);
            const edgesRef = useRef(edges);
            const bbRef = useRef(blackboard);

            useEffect(() => { nodesRef.current = nodes; }, [nodes]);
            useEffect(() => { edgesRef.current = edges; }, [edges]);
            useEffect(() => { bbRef.current = blackboard; }, [blackboard]);

            // 初始化空树
            useEffect(() => {
                if(nodes.length === 0) {
                    setNodes([{ id: generateId('n'), type: 'ReactiveSequence', x: window.innerWidth/2 - NODE_WIDTH/2, y: 100, data: { label: 'SentryMainLogic', attributes: { name: 'SentryMainLogic' } } }]);
                }
            }, []);

            // 动态获取节点定义 (带启发式智能推断)
            const getDef = useCallback((type) => {
                if (BASE_NODE_TYPES[type]) return BASE_NODE_TYPES[type];
                const preset = customPresets.find(p => p.type === type);
                if (preset) return { label: preset.label, group: 'custom', baseType: preset.baseType, color: preset.color, icon: preset.icon, desc: preset.desc };
                
                // --- 启发式推断 (Heuristics for imported unknown nodes) ---
                if (/Check|Condition|Is|Can|Has/.test(type)) {
                    return { label: type, group: 'condition', baseType: 'CONDITION', color: '#10b981', icon: 'AlertCircle', desc: '导入的条件节点 (推断)' };
                }
                if (/Action|Set|Change|Navigate|Select|Wait|Accumulate|Descend/.test(type)) {
                     return { label: type, group: 'action', baseType: 'ACTION', color: '#3b82f6', icon: 'Activity', desc: '导入的动作节点 (推断)' };
                }
                
                return { label: type, group: 'action', baseType: 'ACTION', color: '#64748b', icon: 'Activity', desc: '未知自定义节点' };
            }, [customPresets]);

            // ==========================================
            // ROS2 集成逻辑 & 自动化 Payload 解析
            // ==========================================
            const connectROS = (url) => {
                setRosConfig({ url });
                if (ros) ros.close();
                const newRos = new ROSLIB.Ros({ url: url });
                newRos.on('connection', () => { 
                    setRosStatus('Connected'); 
                    newRos.getTopics((result) => {
                        const topicsList = result.topics.map((t, i) => ({ name: t, type: result.types[i] }));
                        setRosTopics(topicsList);
                    });
                });
                newRos.on('error', () => setRosStatus('Error'));
                newRos.on('close', () => setRosStatus('Disconnected'));
                setRos(newRos);
                setShowROSModal(false);
            };

            const publishToROS = (topicName, msgType, payloadStr) => {
                if (!ros || rosStatus !== 'Connected') return;
                try {
                    const topic = new ROSLIB.Topic({ ros: ros, name: topicName, messageType: msgType });
                    const payload = JSON.parse(payloadStr);
                    const msg = new ROSLIB.Message(payload);
                    topic.publish(msg);
                } catch(e) {
                    console.error("ROS Publish Error:", e);
                }
            };

            const generateRosPayloadTemplate = (msgType, callback) => {
                if (!ros || rosStatus !== 'Connected') {
                    callback('{\n  \n}'); return;
                }
                
                // 防卡死超时处理: 如果 rosapi 未运行，则平滑降级，仅返回 {}
                let hasReturned = false;
                const fallbackTimer = setTimeout(() => {
                    if (!hasReturned) {
                        hasReturned = true;
                        setToastMessage("ROS API 解析超时！未获取到消息结构体。\n这不影响正常使用，你可以手动填入 JSON。\n若需自动生成，请确保后台已运行：\nros2 run rosapi rosapi_node");
                        callback('{\n  \n}'); // 兜底防止文本框里出现难看的报错
                    }
                }, 1500);

                const detailClient = new ROSLIB.MessageDetailsClient({ ros: ros, type: msgType });
                detailClient.getDetails((details) => {
                    if (hasReturned) return;
                    hasReturned = true;
                    clearTimeout(fallbackTimer);

                    if(!details || details.length === 0) { callback('{\n  \n}'); return; }
                    
                    const buildTemplate = (typeName) => {
                        const def = details.find(d => d.type === typeName);
                        if (!def) {
                            if (typeName.includes('int') || typeName.includes('float')) return 0.0;
                            if (typeName === 'bool') return false;
                            return "";
                        }
                        const obj = {};
                        def.fieldnames.forEach((fn, i) => {
                            const ftype = def.fieldtypes[i];
                            const isArray = def.fieldarraylen[i] !== -1; 
                            let val;
                            if (['int8','uint8','int16','uint16','int32','uint32','int64','uint64','float32','float64'].includes(ftype)) val = 0.0;
                            else if (ftype === 'bool') val = false;
                            else if (ftype === 'string') val = "";
                            else val = buildTemplate(ftype); 

                            obj[fn] = isArray ? [val] : val;
                        });
                        return obj;
                    };

                    const templateObj = buildTemplate(msgType);
                    callback(JSON.stringify(templateObj, null, 2));
                });
            };

            const updateNodeDataMulti = (id, updates) => {
                setNodes(ns => ns.map(n => n.id === id ? {...n, data: {...n.data, ...updates}} : n));
            };

            // ==========================================
            // C++ 多头文件两阶段跨文件解析 (Two-Pass Parsing)
            // ==========================================
            const handleImportCPP = async (event) => {
                const files = Array.from(event.target.files); if (!files.length) return;
                
                let newVars = [...bbRef.current];
                let addedNames = [];
                let globalEnumDict = {}; // 全局字典：横跨所有选中的文件

                try {
                    const contents = await Promise.all(files.map(file => new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = e => resolve(e.target.result);
                        reader.onerror = reject;
                        reader.readAsText(file);
                    })));
                    
                    // --- 第一阶段 (PASS 1)：收集所有文件里的枚举和结构体 ---
                    contents.forEach(content => {
                        // 匹配 enum class Name { ... } 或 enum Name { ... }
                        const enumRegex1 = /enum\s+(?:class\s+)?(\w+)\s*\{([^}]+)\}/g;
                        let match1;
                        while ((match1 = enumRegex1.exec(content)) !== null) {
                            const enumName = match1[1];
                            const enumBody = match1[2];
                            const options = enumBody.split(',').map(s => s.split('=')[0].trim().split('//')[0].trim()).filter(Boolean);
                            if (options.length > 0) globalEnumDict[enumName] = options.join(',');
                        }

                        // 匹配 typedef enum _Name { ... } Name;
                        const enumRegex2 = /typedef\s+enum\s+(?:\w+)?\s*\{([^}]+)\}\s*(\w+)\s*;/g;
                        let match2;
                        while ((match2 = enumRegex2.exec(content)) !== null) {
                            const enumBody = match2[1];
                            const enumName = match2[2];
                            const options = enumBody.split(',').map(s => s.split('=')[0].trim().split('//')[0].trim()).filter(Boolean);
                            if (options.length > 0) globalEnumDict[enumName] = options.join(',');
                        }
                    });

                    // --- 第二阶段 (PASS 2)：依据合并后的全局字典提取变量 ---
                    contents.forEach(content => {
                        const setRegex = /blackboard_->set(?:<([^>]+)>)?\(\s*"([^"]+)"\s*,\s*(.*?)\s*\);/g;
                        let matchSet;
                        while ((matchSet = setRegex.exec(content)) !== null) {
                            const rawType = matchSet[1] || '';
                            const key = matchSet[2];
                            const rawVal = matchSet[3].trim();

                            let bbType = 'string';
                            let defaultVal = '0';
                            let optionsStr = '';

                            if (rawVal.includes('Point2D') || rawVal.includes('Pose') || rawVal.includes('Twist')) {
                                bbType = 'string'; defaultVal = '{}';
                            } else if (rawVal.includes('vector')) {
                                bbType = 'string'; defaultVal = '[]';
                            } else if (!isNaN(parseFloat(rawVal)) && !rawVal.includes('::')) {
                                bbType = 'float'; defaultVal = parseFloat(rawVal).toString();
                            } else if (rawVal.includes('true') || rawVal.includes('false')) {
                                bbType = 'boolean'; defaultVal = rawVal.includes('true') ? 'true' : 'false';
                            } else if (globalEnumDict[rawType]) {
                                bbType = 'enum'; optionsStr = globalEnumDict[rawType]; defaultVal = rawVal.split('::').pop() || '';
                            } else if (rawVal.includes('::')) {
                                bbType = 'enum';
                                const inferredEnumName = rawVal.split('::')[0].split(' ').pop(); 
                                optionsStr = globalEnumDict[inferredEnumName] || rawVal.split('::').pop();
                                defaultVal = rawVal.split('::').pop();
                            } else if (rawType.includes('msg')) {
                                 bbType = 'string'; defaultVal = "{}";
                            } else {
                                defaultVal = rawVal.replace(/['"]/g, ''); 
                            }

                            let existing = newVars.find(v => v.key === key);
                            if (!existing) {
                                newVars.push({ key, type: bbType, value: defaultVal, optionsStr });
                                if (!addedNames.includes(key)) addedNames.push(key);
                            } else if (bbType === 'enum') {
                                existing.type = 'enum';
                                // 如果现有的 enum 选项残缺，我们更新它
                                if (!existing.optionsStr || optionsStr.length > existing.optionsStr.length) {
                                    existing.optionsStr = optionsStr;
                                }
                            }
                        }

                        const portRegex = /BT::(?:InputPort|OutputPort)<([^>]+)>\(\s*"([^"]+)"\s*\)/g;
                        let matchPort;
                        while ((matchPort = portRegex.exec(content)) !== null) {
                            const rawType = matchPort[1];
                            const key = matchPort[2];
                            let bbType = 'string';
                            let optionsStr = '';

                            if (rawType.includes('int') || rawType.includes('double') || rawType.includes('float')) bbType = 'float';
                            if (rawType.includes('bool')) bbType = 'boolean';
                            if (globalEnumDict[rawType]) { bbType = 'enum'; optionsStr = globalEnumDict[rawType]; }
                            
                            let existing = newVars.find(v => v.key === key);
                            if (!existing) {
                                newVars.push({ key, type: bbType, value: bbType === 'boolean' ? 'false' : '0', optionsStr });
                                if (!addedNames.includes(key)) addedNames.push(key);
                            } else if (bbType === 'enum') {
                                existing.type = 'enum';
                                if (!existing.optionsStr || optionsStr.length > existing.optionsStr.length) {
                                    existing.optionsStr = optionsStr;
                                }
                            }
                        }
                    });
                    
                    setBlackboard([...newVars]);
                    if (addedNames.length > 0) {
                        setToastMessage(`成功两阶段解析 ${files.length} 个文件，提取到 ${addedNames.length} 个新变量:\n${addedNames.slice(0, 8).join(', ')}${addedNames.length > 8 ? ' ...等' : ''}`);
                    } else {
                        setToastMessage(`解析完成！\n已更新现有变量字典，未发现新变量名。`);
                    }
                } catch (err) {
                    setToastMessage(`解析失败: ${err}`);
                }
                event.target.value = null; 
            };

            // ==========================================
            // 自定义预制节点保存与UI删除功能
            // ==========================================
            const handleSavePreset = () => {
                if (!selectedNodeId) return;
                const node = nodes.find(n => n.id === selectedNodeId);
                const newName = prompt("请输入预制节点名称 (如 'CheckMyCondition', 请使用合法的 C++ 类命名):", node.type);
                if (!newName || newName.trim() === '') return;
                
                const baseDef = getDef(node.type);
                const newPreset = {
                    id: 'tpl_' + Date.now(),
                    type: newName.trim(),
                    baseType: baseDef.baseType,
                    label: newName.trim(),
                    group: 'custom',
                    color: '#0d9488', // 给自定义节点专门的颜色区分
                    icon: 'Star',
                    desc: '用户自定义节点',
                    dataTemplate: { ...node.data, label: newName.trim(), attributes: { ...(node.data.attributes || {}), name: newName.trim() } }
                };

                const updated = [...customPresets.filter(p => p.type !== newName.trim()), newPreset];
                setCustomPresets(updated);
                localStorage.setItem('rm_bt_presets', JSON.stringify(updated));
                setToastMessage(`已成功保存自定义节点: ${newName.trim()}\n您现在可以在左侧节点库复用它。`);
            };

            const confirmDeletePreset = (id, e) => {
                e.stopPropagation();
                setPresetToDelete(id);
            };

            const executeDeletePreset = () => {
                if (presetToDelete) {
                    const updated = customPresets.filter(p => p.id !== presetToDelete);
                    setCustomPresets(updated);
                    localStorage.setItem('rm_bt_presets', JSON.stringify(updated));
                    setPresetToDelete(null);
                }
            };

            // ==========================================
            // XML 导入与导出
            // ==========================================
            const handleImportXML = (event) => {
                const file = event.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const parser = new DOMParser(); const doc = parser.parseFromString(e.target.result, "text/xml");
                    let parsedNodes = []; let parsedEdges = [];
                    const parseElement = (el) => {
                        if(el.nodeType !== 1) return null;
                        const tagName = el.tagName;
                        if(['root', 'BehaviorTree', 'TreeNodesModel', 'SubTree'].includes(tagName) && el.children.length === 1) return parseElement(el.firstElementChild);
                        const id = generateId('n'); const attrs = {}; Array.from(el.attributes).forEach(a => attrs[a.name] = a.value);
                        
                        const preset = customPresets.find(p => p.type === tagName);
                        const nodeData = preset ? JSON.parse(JSON.stringify(preset.dataTemplate)) : { label: attrs.name || tagName };
                        nodeData.attributes = attrs; 
                        
                        parsedNodes.push({ id, type: tagName, x: 0, y: 0, data: nodeData });
                        Array.from(el.children).forEach(child => { const childId = parseElement(child); if(childId) parsedEdges.push({ id: generateId('e'), source: id, target: childId }); });
                        return id;
                    };
                    const rootId = parseElement(doc.documentElement);
                    if(rootId) {
                        parsedNodes = autoLayout(rootId, parsedNodes, parsedEdges);
                        setNodes(parsedNodes); setEdges(parsedEdges); setView({x: 0, y: 50, k: 0.8});
                        setToastMessage("XML 导入成功！已智能推断未知节点类型。");
                    }
                };
                reader.readAsText(file); event.target.value = null;
            };

            const handleExportXML = () => {
                const rootNodes = nodes.filter(n => !edges.some(e => e.target === n.id));
                if(rootNodes.length === 0) { alert("没有找到有效的根节点！"); return; }
                const buildXML = (nodeId, indent) => {
                    const node = nodes.find(n => n.id === nodeId); if(!node) return '';
                    let attrsStr = ''; const attrs = node.data.attributes || {};
                    Object.entries(attrs).forEach(([k, v]) => { if (v.trim() !== '') attrsStr += ` ${k}="${v}"`; });
                    if(!attrs.name && node.data.label !== node.type) attrsStr += ` name="${node.data.label}"`;
                    
                    const childrenIds = edges.filter(e => e.source === nodeId).map(e => e.target);
                    childrenIds.sort((a, b) => (nodes.find(n=>n.id===a)?.x || 0) - (nodes.find(n=>n.id===b)?.x || 0));
                    
                    if(childrenIds.length === 0) return `${indent}<${node.type}${attrsStr}/>\n`;
                    let xml = `${indent}<${node.type}${attrsStr}>\n`;
                    childrenIds.forEach(cid => { xml += buildXML(cid, indent + '  '); });
                    xml += `${indent}</${node.type}>\n`; return xml;
                };
                const finalXML = `<root main_tree_to_execute="MainTree">\n  <BehaviorTree ID="MainTree">\n${buildXML(rootNodes[0].id, '    ')}  </BehaviorTree>\n</root>`;
                downloadFile('sentry_bt.xml', finalXML);
                setToastMessage("XML 已成功导出！");
            };

            // ==========================================
            // 精确的 BT 仿真引擎 (Tick Engine)
            // ==========================================
            const evaluateConditions = (conds) => {
                if (!conds || conds.length === 0) return true; // 空条件默认通过
                let finalResult = true;
                let currentLink = '&&';
                
                for (let i = 0; i < conds.length; i++) {
                     const cond = conds[i];
                     const bbItem = bbRef.current.find(b => b.key === cond.variable);
                     let val1 = bbItem ? bbItem.value : null;
                     let val2 = cond.value;

                     if (bbItem) {
                         if (bbItem.type === 'float' || bbItem.type === 'int') { val1 = Number(val1); val2 = Number(val2); }
                         if (bbItem.type === 'boolean') { val1 = (String(val1) === 'true'); val2 = (String(val2) === 'true'); }
                     }

                     let stepResult = false;
                     if (cond.operator === '==') stepResult = (val1 == val2);
                     else if (cond.operator === '!=') stepResult = (val1 != val2);
                     else if (cond.operator === '>') stepResult = (val1 > val2);
                     else if (cond.operator === '<') stepResult = (val1 < val2);
                     else if (cond.operator === '>=') stepResult = (val1 >= val2);
                     else if (cond.operator === '<=') stepResult = (val1 <= val2);

                     if (i === 0) finalResult = stepResult;
                     else {
                         if (currentLink === '&&') finalResult = finalResult && stepResult;
                         else if (currentLink === '||') finalResult = finalResult || stepResult;
                     }
                     currentLink = cond.logicLink || '&&';
                }
                return finalResult;
            };

            const tickNode = (nodeId) => {
                const mem = simMemory.current;
                const node = nodesRef.current.find(n => n.id === nodeId);
                if (!node) return 'FAILURE';
                
                const def = getDef(node.type);
                const bType = def.baseType;
                
                const childrenIds = edgesRef.current.filter(e => e.source === nodeId).map(e => e.target);
                childrenIds.sort((a, b) => (nodesRef.current.find(n=>n.id===a)?.x || 0) - (nodesRef.current.find(n=>n.id===b)?.x || 0));

                let status = 'SUCCESS';

                if (bType === 'SEQUENCE' || bType === 'FALLBACK') {
                    const isReactive = node.type.includes('Reactive');
                    let childIndex = (isReactive || mem.runningChild[nodeId] === undefined) ? 0 : mem.runningChild[nodeId];
                    
                    status = bType === 'SEQUENCE' ? 'SUCCESS' : 'FAILURE';

                    while (childIndex < childrenIds.length) {
                        const childId = childrenIds[childIndex];
                        const childStatus = tickNode(childId);
                        
                        if (childStatus === 'RUNNING') {
                            status = 'RUNNING';
                            mem.runningChild[nodeId] = childIndex;
                            break;
                        } else if (bType === 'SEQUENCE') {
                            if (childStatus === 'FAILURE') { status = 'FAILURE'; mem.runningChild[nodeId] = 0; break; }
                        } else if (bType === 'FALLBACK') {
                            if (childStatus === 'SUCCESS') { status = 'SUCCESS'; mem.runningChild[nodeId] = 0; break; }
                        }
                        childIndex++;
                    }
                    if (status !== 'RUNNING') mem.runningChild[nodeId] = 0;
                } 
                else if (bType === 'CONDITION') {
                    status = evaluateConditions(node.data.conditions) ? 'SUCCESS' : 'FAILURE';
                }
                else if (bType === 'ACTION') {
                    const timeout = parseInt(node.data.timeout || 0);
                    if (timeout > 0) {
                        if (!mem.actionTimers[nodeId]) {
                            mem.actionTimers[nodeId] = { ticks: 0, max: timeout };
                            status = 'RUNNING';
                        } else {
                            mem.actionTimers[nodeId].ticks++;
                            if (mem.actionTimers[nodeId].ticks >= mem.actionTimers[nodeId].max) {
                                status = 'SUCCESS';
                                delete mem.actionTimers[nodeId];
                            } else {
                                status = 'RUNNING';
                            }
                        }
                    } else {
                        status = 'SUCCESS';
                    }

                    if (status === 'SUCCESS') {
                        if (node.data.setBbKey) {
                            setBlackboard(prev => {
                                const newBb = [...prev];
                                const item = newBb.find(b => b.key === node.data.setBbKey);
                                if (item) item.value = node.data.setBbVal;
                                else newBb.push({ key: node.data.setBbKey, type: 'string', value: node.data.setBbVal });
                                return newBb;
                            });
                        }
                        if (node.data.rosTopic && node.data.rosMsgType && node.data.rosPayload) {
                            publishToROS(node.data.rosTopic, node.data.rosMsgType, node.data.rosPayload);
                        }
                    }
                }
                else if (bType === 'DECORATOR') {
                    if (childrenIds.length > 0) {
                        const childStatus = tickNode(childrenIds[0]);
                        if (childStatus === 'RUNNING') status = 'RUNNING';
                        else {
                            if (node.type === 'ForceSuccess') status = 'SUCCESS';
                            else if (node.type === 'ForceFailure') status = 'FAILURE';
                            else if (node.type === 'Inverter') status = childStatus === 'SUCCESS' ? 'FAILURE' : 'SUCCESS';
                            else status = childStatus;
                        }
                    } else {
                        status = 'SUCCESS';
                    }
                }

                mem.nodeStatus[nodeId] = status;
                return status;
            };

            const simulationTick = useCallback(() => {
                const rootNodes = nodesRef.current.filter(n => !edgesRef.current.some(e => e.target === n.id));
                if (rootNodes.length === 0) return;
                
                // 核心重置机制：若前一次运行完毕，则进入一帧的纯净停顿，清空 UI 后再继续跑
                if (simMemory.current.needsReset) {
                    simMemory.current = { nodeStatus: {}, runningChild: {}, actionTimers: {}, needsReset: false };
                    setNodes(ns => ns.map(n => ({...n, data: {...n.data, status: 'IDLE'}}))); // 视觉强制刷新白板
                    return; // 停顿一帧 (0.5s)，表现为循环刷新
                }

                simMemory.current.nodeStatus = {}; 
                tickNode(rootNodes[0].id);
                
                const rootStatus = simMemory.current.nodeStatus[rootNodes[0].id];
                if (rootStatus === 'SUCCESS' || rootStatus === 'FAILURE') {
                    simMemory.current.needsReset = true; // 树执行到底，打上重置标记
                }
                
                setNodes(ns => ns.map(n => ({...n, data: {...n.data, status: simMemory.current.nodeStatus[n.id] || 'IDLE'}})));
            }, []);

            useEffect(() => {
                if (isSimulating) {
                    simMemory.current = { nodeStatus: {}, runningChild: {}, actionTimers: {}, needsReset: false };
                    tickTimer.current = setInterval(simulationTick, 500);
                } else {
                    clearInterval(tickTimer.current);
                    setNodes(ns => ns.map(n => ({...n, data: {...n.data, status: 'IDLE'}})));
                }
                return () => clearInterval(tickTimer.current);
            }, [isSimulating, simulationTick]);

            // ==========================================
            // 交互与布局
            // ==========================================
            const screenToWorld = useCallback((sx, sy) => {
                if (!canvasRef.current) return { x: 0, y: 0 };
                const rect = canvasRef.current.getBoundingClientRect();
                return { x: (sx - rect.left - view.x) / view.k, y: (sy - rect.top - view.y) / view.k };
            }, [view]);

            const handleGlobalMouseMove = (e) => {
                const worldPos = screenToWorld(e.clientX, e.clientY);
                setMousePos(worldPos);
                if (isPanning) { setView(v => ({ ...v, x: v.x + e.clientX - lastMousePos.x, y: v.y + e.clientY - lastMousePos.y })); setLastMousePos({ x: e.clientX, y: e.clientY }); }
                else if (draggingNodeId) { setNodes(prev => prev.map(n => n.id === draggingNodeId ? { ...n, x: Math.round((worldPos.x - NODE_WIDTH/2)/20)*20, y: Math.round((worldPos.y - 10)/20)*20 } : n)); }
                else if (isResizingPanel) { e.preventDefault(); setRightPanelWidth(Math.max(350, Math.min(document.body.clientWidth - e.clientX, 800))); }
                else if (isResizingBottom) { e.preventDefault(); setBottomPanelHeight(Math.max(150, Math.min(document.body.clientHeight - e.clientY, 600))); }
            };

            const handleGlobalMouseUp = () => { setIsPanning(false); setDraggingNodeId(null); setIsResizingPanel(false); setIsResizingBottom(false); };

            const autoLayout = (rootId, allNodes, allEdges) => {
                const childrenMap = {}; allEdges.forEach(e => { if(!childrenMap[e.source]) childrenMap[e.source] = []; childrenMap[e.source].push(e.target); });
                let leafX = 0; const H_SPACE = 220; const V_SPACE = 140;
                const assignPositions = (nodeId, depth) => {
                    const children = childrenMap[nodeId] || []; let myX = 0;
                    if (children.length === 0) { myX = leafX; leafX += H_SPACE; } 
                    else { let minX = Infinity, maxX = -Infinity; children.forEach(childId => { const cx = assignPositions(childId, depth + 1); minX = Math.min(minX, cx); maxX = Math.max(maxX, cx); }); myX = (minX + maxX) / 2; }
                    const nIdx = allNodes.findIndex(n => n.id === nodeId);
                    if (nIdx > -1) { allNodes[nIdx].x = myX; allNodes[nIdx].y = 50 + depth * V_SPACE; }
                    return myX;
                };
                assignPositions(rootId, 0);
                const rootNode = allNodes.find(n => n.id === rootId);
                const offset = (window.innerWidth / 2) - 150 - (rootNode ? rootNode.x : 0);
                allNodes.forEach(n => { n.x += offset; });
                return allNodes;
            };

            // 数据操作
            const updateNodeAttr = (key, value) => {
                setNodes(ns => ns.map(n => n.id === selectedNodeId ? { ...n, data: { ...n.data, attributes: { ...(n.data.attributes || {}), [key]: value } } } : n));
            };
            const updateNodeData = (key, value) => { setNodes(ns => ns.map(n => n.id === selectedNodeId ? {...n, data: {...n.data, [key]: value}} : n)); };
            const deleteNode = (id) => { setNodes(ns => ns.filter(n => n.id !== id)); setEdges(es => es.filter(e => e.source !== id && e.target !== id)); if(selectedNodeId === id) setSelectedNodeId(null); };
            
            // Condition 多维条件修改器
            const addConditionRow = () => {
                const conds = selectedNode?.data?.conditions || [];
                updateNodeData('conditions', [...conds, { variable: blackboard[0]?.key || '', operator: '==', value: '', logicLink: '&&' }]);
            };
            const updateConditionRow = (idx, field, val) => {
                const conds = [...(selectedNode.data.conditions || [])];
                conds[idx][field] = val;
                updateNodeData('conditions', conds);
            };
            const removeConditionRow = (idx) => {
                const conds = [...(selectedNode.data.conditions || [])];
                conds.splice(idx, 1);
                updateNodeData('conditions', conds);
            };

            const selectedNode = nodes.find(n => n.id === selectedNodeId);
            const selectedDef = selectedNode ? getDef(selectedNode.type) : null;
            const getBezierPath = (x1, y1, x2, y2) => `M ${x1} ${y1} C ${x1} ${y1+60} ${x2} ${y2-60} ${x2} ${y2}`;

            return (
                <div className="flex flex-col h-screen w-full bg-[#f8fafc] text-slate-800 font-sans select-none overflow-hidden" onMouseMove={handleGlobalMouseMove} onMouseUp={handleGlobalMouseUp}>
                    <datalist id="bb-keys-list">
                        {blackboard.map((item, idx) => <option key={idx} value={item.key} />)}
                    </datalist>
                    <datalist id="ros-topics-list">
                        {rosTopics.map((topic, idx) => <option key={idx} value={topic.name}>{topic.type}</option>)}
                    </datalist>

                    <ToastMessage message={toastMessage} onClose={() => setToastMessage(null)} />

                    {/* --- 自定义预置删除确认 UI 弹窗 --- */}
                    {presetToDelete && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
                            <div className="bg-white p-5 rounded-lg shadow-xl w-80">
                                <h3 className="font-bold text-slate-800 mb-2 flex items-center gap-2"><Icons.AlertCircle className="text-red-500"/> 确认删除</h3>
                                <p className="text-sm text-gray-600 mb-5">您确定要删除这个自定义预置节点吗？该操作无法撤销。</p>
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setPresetToDelete(null)} className="px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100 rounded transition-colors border border-gray-200">取消</button>
                                    <button onClick={executeDeletePreset} className="px-3 py-1.5 text-sm bg-red-500 text-white rounded hover:bg-red-600 font-bold transition-colors shadow-sm">确定删除</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <input type="file" accept=".xml" ref={xmlInputRef} onChange={handleImportXML} className="hidden" />
                    <input type="file" accept=".cpp,.hpp,.h" multiple ref={cppInputRef} onChange={handleImportCPP} className="hidden" />
                    
                    {showROSModal && <ROSConnectionModal config={rosConfig} status={rosStatus} onConnect={connectROS} onClose={() => setShowROSModal(false)} />}
                    {showCodeModal && <CodePreviewModal files={generatedFiles} onClose={() => setShowCodeModal(false)} />}

                    {/* 顶部工具栏 */}
                    <div className="h-14 bg-white border-b flex items-center px-5 justify-between shadow-sm z-30 shrink-0">
                        <div className="flex items-center gap-4">
                            <div className="flex items-center gap-2 font-black text-xl text-slate-800 tracking-tight">
                                <Icons.Zap className="text-amber-500" size={24}/> BT Ultimate <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full border border-blue-200 ml-2">v2.5 Pro</span>
                            </div>
                            
                            <div className="flex gap-1 border-l pl-4 border-gray-200">
                                <button onClick={() => setShowLibrary(!showLibrary)} className={`p-1.5 rounded transition-colors ${showLibrary ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-100'}`} title="显示/隐藏节点库"><Icons.PanelLeft size={18}/></button>

                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="flex flex-col items-center justify-center h-full text-gray-400 mt-20">
                                                <Icons.Activity size={48} className="mb-3 opacity-20" />
                                                <p className="text-sm font-medium">在画布中选中节点以编辑属性</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* 黑板面板 (底部) */}
                                <div className="bg-slate-50 border-t flex flex-col relative shadow-[0_-4px_10px_rgba(0,0,0,0.02)]" style={{ height: bottomPanelHeight }}>
                                    <div className="resizer-row" onMouseDown={(e) => { e.preventDefault(); setIsResizingBottom(true); }}></div>
                                    <div className="p-2 border-b bg-slate-100 flex items-center justify-between shadow-sm z-10">
                                        <div className="font-bold text-xs text-slate-700 flex items-center gap-1.5"><Icons.Database size={12} className="text-blue-500"/> 全局黑板 (Blackboard)</div>
                                        <button onClick={() => setBlackboard(p => [...p, { key: `var_${p.length}`, value: '0', type: 'float' }])} className="text-[10px] flex items-center gap-1 bg-white border border-slate-300 px-2 py-1 rounded shadow-sm hover:bg-blue-50 hover:border-blue-300 text-blue-600 font-bold transition"><Icons.Plus size={10} /> 新增变量</button>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-1 relative">
                                        <table className="w-full text-xs text-left border-collapse">
                                            <thead className="sticky top-0 bg-slate-50 shadow-sm z-10">
                                                <tr className="text-slate-500"><th className="py-1.5 pl-2 font-semibold">Key (变量名)</th><th className="py-1.5 font-semibold w-24">Type</th><th className="py-1.5 font-semibold">Current Value</th><th className="py-1.5 w-8"></th></tr>
                                            </thead>
                                            <tbody>
                                                {blackboard.map((item, idx) => (
                                                    <tr key={idx} className="border-b border-slate-100 last:border-0 hover:bg-white transition-colors group align-top">
                                                        <td className="p-1 pt-2"><input type="text" className="w-full bg-transparent border-b border-transparent focus:border-blue-400 outline-none px-1 font-medium text-slate-700" value={item.key} onChange={(e) => { const n=[...blackboard]; n[idx].key=e.target.value; setBlackboard(n); }} /></td>
                                                        <td className="p-1 pt-2">
                                                            <select className="w-full bg-transparent text-slate-600 font-medium outline-none border border-gray-200 rounded px-1" value={item.type} onChange={(e) => { const n=[...blackboard]; n[idx].type=e.target.value; setBlackboard(n); }}>
                                                                <option value="int">int</option>
                                                                <option value="float">float</option>
                                                                <option value="string">string</option>
                                                                <option value="boolean">bool</option>
                                                                <option value="enum">enum</option>
                                                            </select>
                                                            {item.type === 'enum' && (
                                                                <div className="mt-1">
                                                                    <input type="text" className="w-full text-[9px] bg-slate-50 border border-slate-300 rounded px-1 py-0.5 placeholder-gray-400 outline-none focus:border-blue-400" placeholder="枚举项(A,B,C...)" value={item.optionsStr || ''} onChange={(e) => { const n=[...blackboard]; n[idx].optionsStr=e.target.value; setBlackboard(n); }} title="输入枚举选项，以逗号分隔"/>
                                                                </div>
                                                            )}
                                                        </td>
                                                        <td className="p-1 pt-2">
                                                            {item.type === 'boolean' ? (
                                                                <select className="w-full bg-transparent text-blue-600 font-bold outline-none" value={item.value} onChange={(e)=>{ const n=[...blackboard]; n[idx].value=e.target.value; setBlackboard(n); }}><option value="true">true</option><option value="false">false</option></select> 
                                                            ) : item.type === 'enum' ? (
                                                                <select className="w-full bg-transparent text-blue-600 font-bold outline-none" value={item.value} onChange={(e)=>{ const n=[...blackboard]; n[idx].value=e.target.value; setBlackboard(n); }}>
                                                                    {(item.optionsStr || '').split(',').filter(Boolean).map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                                                </select>
                                                            ) : (
                                                                <input type="text" className="w-full bg-transparent border-b border-transparent focus:border-blue-400 outline-none px-1 font-mono text-blue-600 font-bold" value={item.value} onChange={(e) => { const n=[...blackboard]; n[idx].value=e.target.value; setBlackboard(n); }} />
                                                            )}
                                                        </td>
                                                        <td className="p-1 pt-2 text-center">
                                                            <button onClick={() => setBlackboard(p=>p.filter((_,i)=>i!==idx))} className="text-transparent group-hover:text-red-400 hover:!text-red-600 transition-colors p-1"><Icons.Trash2 size={12} /></button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BehaviorTreeEditor />);
    </script>
</body>
</html>
