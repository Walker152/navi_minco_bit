pcd2ele_node:
  ros__parameters:
    pcd_file_path: "src/navigation/navi2_bringup/maps/pcd/2026rmuc.pcd"
    output_folder: "src/utils/pcd2ele/maps"
    output_name: "elevation_map"
    z_min: 0.0
    z_max: 5.0
    filter_radius: 0.5
    filter_min_neighbors: 10
    resolution: 0.05
    use_radius_filter: true
    use_pass_through_filter: true
    use_dilation: true
    dilation_radius: 1
