<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudLab Studio - 专业点云与地图编辑器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        .ui-panel { z-index: 10; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: #3b82f6; cursor: pointer; margin-top: -8px; border: 2px solid #1f2937;
            box-shadow: 0 0 4px rgba(0,0,0,0.5); 
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #4b5563; border-radius: 2px;
        }
        /* 去掉 number input 的箭头 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top: 3px solid #3b82f6;
            width: 20px; height: 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #error-boundary {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 9999;
            pointer-events: none; padding: 20px;
        }
        .error-msg {
            background: rgba(220, 38, 38, 0.9); color: white; padding: 10px 20px;
            border-radius: 5px; margin-bottom: 10px; pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); max-width: 600px;
        }

        :root {
            --studio-bg: #071018;
            --studio-panel: #0c1722;
            --studio-panel-2: #101e2c;
            --studio-border: #263849;
            --studio-muted: #7890a3;
            --studio-text: #dce8f2;
            --studio-accent: #27b3ff;
            --studio-green: #35d39a;
            --studio-warn: #f7b955;
        }
        * { box-sizing: border-box; }
        button, input, select, textarea { font: inherit; }
        .studio-shell { position: fixed; inset: 0; display: grid; grid-template-rows: 46px 1fr 28px; background: var(--studio-bg); color: var(--studio-text); z-index: 50; }
        .studio-topbar { display: flex; align-items: center; gap: 7px; padding: 0 10px; background: #09141e; border-bottom: 1px solid var(--studio-border); min-width: 0; }
        .studio-brand { display: flex; align-items: center; gap: 8px; font-weight: 750; letter-spacing: .2px; white-space: nowrap; margin-right: 8px; }
        .studio-logo { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; color: #03121c; background: linear-gradient(135deg, #57d8ff, #2d7bff); font-weight: 900; }
        .studio-version { color: var(--studio-muted); font-size: 10px; font-weight: 500; }
        .studio-button { height: 30px; border: 1px solid var(--studio-border); border-radius: 5px; background: #112131; color: #c9d8e5; padding: 0 10px; cursor: pointer; transition: .15s; white-space: nowrap; }
        .studio-button:hover:not(:disabled) { border-color: #3e6684; background: #162b3e; }
        .studio-button:disabled { opacity: .4; cursor: not-allowed; }
        .studio-button.primary { background: #12689b; border-color: #268dcc; color: white; }
        .studio-button.success { background: #11674e; border-color: #21966f; color: white; }
        .studio-button.danger { background: #71323a; border-color: #9f4653; color: white; }
        .studio-spacer { flex: 1; min-width: 8px; }
        .studio-mode { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--studio-muted); white-space: nowrap; }
        .studio-dot { width: 7px; height: 7px; border-radius: 50%; background: #637381; box-shadow: 0 0 0 3px rgba(99,115,129,.12); }
        .studio-dot.online { background: var(--studio-green); box-shadow: 0 0 0 3px rgba(53,211,154,.12); }
        .studio-main { min-height: 0; display: flex; position: relative; }
        .studio-dock { min-width: 0; height: 100%; display: flex; flex-direction: column; background: var(--studio-panel); overflow: hidden; }
        .studio-left { border-right: 1px solid var(--studio-border); }
        .studio-right { border-left: 1px solid var(--studio-border); }
        .studio-dock-header { height: 38px; flex: 0 0 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 11px; border-bottom: 1px solid var(--studio-border); background: #0a151f; color: #b9cad7; font-size: 11px; text-transform: uppercase; letter-spacing: .9px; font-weight: 700; }
        .studio-collapse { background: transparent; border: 0; color: #7d97aa; cursor: pointer; font-size: 15px; }
        .studio-scroll { overflow: auto; min-height: 0; padding: 9px; }
        .studio-resizer { width: 5px; flex: 0 0 5px; cursor: col-resize; background: transparent; position: relative; z-index: 4; }
        .studio-resizer::after { content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: transparent; }
        .studio-resizer:hover::after, .studio-resizer.dragging::after { background: var(--studio-accent); box-shadow: 0 0 8px rgba(39,179,255,.7); }
        .studio-viewport { flex: 1; min-width: 180px; min-height: 0; position: relative; overflow: hidden; background: #071018; }
        .studio-viewport .canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; }
        .studio-view-tools { position: absolute; z-index: 12; top: 9px; left: 9px; display: flex; gap: 4px; padding: 4px; background: rgba(7,16,24,.84); border: 1px solid rgba(55,79,99,.9); border-radius: 6px; backdrop-filter: blur(8px); }
        .studio-view-tools button { background: transparent; border: 0; color: #9cb0c0; height: 26px; padding: 0 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .studio-view-tools button:hover, .studio-view-tools button.active { background: #17344a; color: #71d6ff; }
        .studio-selection-note { position: absolute; z-index: 12; bottom: 10px; left: 10px; padding: 7px 9px; border-radius: 5px; background: rgba(7,16,24,.86); border: 1px solid #31485b; color: #9db3c4; font-size: 11px; pointer-events: none; }
        .studio-section { border: 1px solid var(--studio-border); border-radius: 7px; background: var(--studio-panel-2); margin-bottom: 8px; overflow: hidden; }
        .studio-section-title { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; font-size: 12px; font-weight: 650; border-bottom: 1px solid rgba(38,56,73,.75); }
        .studio-section-body { padding: 10px; }
        .studio-pipeline-item { width: 100%; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 7px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #a9bdcc; padding: 8px; margin-bottom: 3px; text-align: left; cursor: pointer; }
        .studio-pipeline-item:hover { background: #112536; }
        .studio-pipeline-item.active { color: #e8f7ff; background: #12324a; border-color: #265b7c; }
        .studio-step-icon { width: 21px; height: 21px; display: grid; place-items: center; border-radius: 5px; background: #182b3c; font-size: 11px; }
        .studio-pipeline-item.active .studio-step-icon { background: #1475aa; }
        .studio-step-meta { color: #648096; font-size: 9px; }
        .studio-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .studio-stat { padding: 8px; background: #0a1620; border: 1px solid #213545; border-radius: 6px; }
        .studio-stat span { display: block; color: var(--studio-muted); font-size: 9px; margin-bottom: 3px; }
        .studio-stat strong { color: #d8e9f5; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .studio-field { margin-bottom: 10px; }
        .studio-label { display: flex; align-items: center; justify-content: space-between; color: #92a8b8; font-size: 10px; margin-bottom: 5px; }
        .studio-input, .studio-select { width: 100%; height: 30px; border: 1px solid #2a4357; border-radius: 5px; background: #08131c; color: #d9e6ef; padding: 0 8px; outline: none; }
        .studio-input:focus, .studio-select:focus { border-color: #2d92ca; }
        .studio-row { display: flex; gap: 6px; align-items: center; }
        .studio-row > * { min-width: 0; flex: 1; }
        .studio-range { width: 100%; }
        .studio-check { display: flex; gap: 6px; align-items: center; color: #9cb0c0; font-size: 11px; margin: 6px 0; }
        .studio-chip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .studio-chip { border: 1px solid #2b4355; border-radius: 5px; background: #0c1a25; color: #a9becc; padding: 6px 7px; font-size: 10px; cursor: pointer; text-align: left; }
        .studio-chip.active { border-color: var(--chip); box-shadow: inset 3px 0 var(--chip); color: white; }
        .studio-help { color: #6f899c; font-size: 10px; line-height: 1.45; }
        .studio-history { padding: 6px 0 0; margin: 0; list-style: none; }
        .studio-history li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 1px; color: #8fa5b5; font-size: 10px; border-bottom: 1px solid rgba(38,56,73,.45); }
        .studio-history li:last-child { border-bottom: 0; }
        .studio-progress { height: 3px; background: #172b3b; position: relative; overflow: hidden; }
        .studio-progress > div { height: 100%; background: linear-gradient(90deg,#1f95d0,#47d6ff); transition: width .2s; }
        .studio-task { position: absolute; z-index: 20; right: 12px; bottom: 40px; width: min(340px, calc(100% - 24px)); border: 1px solid #31546c; border-radius: 7px; background: rgba(8,20,30,.96); box-shadow: 0 10px 35px rgba(0,0,0,.42); overflow: hidden; }
        .studio-task-body { padding: 9px 11px; display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: #a8c1d2; }
        .studio-status { display: flex; align-items: center; gap: 16px; min-width: 0; padding: 0 10px; background: #07111a; border-top: 1px solid var(--studio-border); color: #6f8799; font-size: 10px; }
        .studio-status strong { color: #a8bfce; font-weight: 500; }
        .studio-map-preview { display: block; width: 100%; height: auto; max-height: 260px; object-fit: contain; image-rendering: pixelated; border: 1px solid #314a5c; border-radius: 5px; background: #111; }
        .studio-warning { padding: 8px; border: 1px solid #6d5530; background: rgba(116,75,19,.18); color: #e6bd76; border-radius: 5px; font-size: 10px; line-height: 1.45; }
        @media (max-width: 900px) {
            .studio-left { position: absolute; z-index: 18; left: 0; top: 0; bottom: 0; box-shadow: 8px 0 25px rgba(0,0,0,.35); }
            .studio-right { position: absolute; z-index: 18; right: 0; top: 0; bottom: 0; box-shadow: -8px 0 25px rgba(0,0,0,.35); }
            .studio-resizer { display: none; }
            .studio-topbar .studio-button.optional { display: none; }
        }
    </style>
</head>
<body>
    <div id="error-boundary"></div>
    <div id="root"></div>

    <script>
        window.onerror = function(msg, url, line, col, error) {
            const div = document.createElement('div');
            div.className = 'error-msg';
            div.innerHTML = `<strong>系统错误:</strong> ${msg}<br><small>${url}:${line}</small>`;
            document.getElementById('error-boundary').appendChild(div);
            return false;
        };
    </script>

    <script id="cloudlab-core">
    /* CLOUDLAB_CORE_START */
    (() => {
        'use strict';

        const SEMANTIC = Object.freeze({
            UNCLASSIFIED: 0,
            GROUND: 1,
            SLOPE: 2,
            WALL: 3,
            OBSTACLE: 4,
            NOISE: 5,
        });

        const cameraGestureForButton = (button, selectionMode = 'none') => {
            if (button === 0) return selectionMode === 'none' ? 'orbit' : 'select';
            if (button === 1 || button === 2) return 'pan';
            return 'none';
        };

        const finitePoints = (points) => {
            const result = [];
            for (let i = 0; i + 2 < points.length; i += 3) {
                const x = points[i], y = points[i + 1], z = points[i + 2];
                if (Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z)) result.push(x, y, z);
            }
            return new Float32Array(result);
        };

        const computeBounds = (points) => {
            let minX = Infinity, minY = Infinity, minZ = Infinity;
            let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
            for (let i = 0; i + 2 < points.length; i += 3) {
                const x = points[i], y = points[i + 1], z = points[i + 2];
                if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;
                minX = Math.min(minX, x); minY = Math.min(minY, y); minZ = Math.min(minZ, z);
                maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); maxZ = Math.max(maxZ, z);
            }
            if (!Number.isFinite(minX)) return { minX: 0, minY: 0, minZ: 0, maxX: 0, maxY: 0, maxZ: 0 };
            return { minX, minY, minZ, maxX, maxY, maxZ };
        };

        const parsePcd = (buffer) => {
            const bytes = new Uint8Array(buffer);
            const decoder = new TextDecoder();
            const header = { fields: [], size: [], type: [], count: [], points: 0, data: '', dataOffset: 0 };
            let start = 0;
            for (let cursor = 0; cursor < bytes.length; cursor++) {
                if (bytes[cursor] !== 10) continue;
                const line = decoder.decode(bytes.subarray(start, cursor)).trim();
                start = cursor + 1;
                if (!line || line.startsWith('#')) continue;
                const parts = line.split(/\s+/);
                const key = parts[0].toUpperCase();
                if (key === 'FIELDS' || key === 'FIELD') header.fields = parts.slice(1).map(v => v.toLowerCase());
                else if (key === 'SIZE') header.size = parts.slice(1).map(Number);
                else if (key === 'TYPE') header.type = parts.slice(1).map(v => v.toUpperCase());
                else if (key === 'COUNT') header.count = parts.slice(1).map(Number);
                else if (key === 'POINTS') header.points = Number(parts[1]);
                else if (key === 'WIDTH' && !header.points) header.points = Number(parts[1]);
                else if (key === 'DATA') {
                    header.data = (parts[1] || '').toLowerCase();
                    header.dataOffset = cursor + 1;
                    break;
                }
            }
            if (!header.fields.length || !header.data) throw new Error('PCD 头部不完整');
            if (header.data === 'binary_compressed') throw new Error('binary_compressed PCD 需要启动 Open3D 后端');
            if (header.data !== 'ascii' && header.data !== 'binary') throw new Error(`不支持 PCD DATA ${header.data}`);
            while (header.size.length < header.fields.length) header.size.push(4);
            while (header.type.length < header.fields.length) header.type.push('F');
            while (header.count.length < header.fields.length) header.count.push(1);
            const xField = header.fields.indexOf('x'), yField = header.fields.indexOf('y'), zField = header.fields.indexOf('z');
            if (xField < 0 || yField < 0 || zField < 0) throw new Error('PCD 文件缺少 x, y, z 字段');
            const intensityField = header.fields.indexOf('intensity');
            const labelField = header.fields.indexOf('label');
            const points = [];
            const intensity = [];
            const labels = [];

            const tokenOffsets = [];
            const byteOffsets = [];
            let tokenStride = 0, byteStride = 0;
            for (let i = 0; i < header.fields.length; i++) {
                tokenOffsets[i] = tokenStride;
                byteOffsets[i] = byteStride;
                tokenStride += header.count[i];
                byteStride += header.size[i] * header.count[i];
            }

            if (header.data === 'ascii') {
                const rows = decoder.decode(bytes.subarray(header.dataOffset)).split(/\r?\n/);
                for (const row of rows) {
                    const clean = row.trim();
                    if (!clean || clean.startsWith('#')) continue;
                    const values = clean.split(/\s+/);
                    const x = Number(values[tokenOffsets[xField]]);
                    const y = Number(values[tokenOffsets[yField]]);
                    const z = Number(values[tokenOffsets[zField]]);
                    if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;
                    points.push(x, y, z);
                    if (intensityField >= 0) intensity.push(Number(values[tokenOffsets[intensityField]]) || 0);
                    if (labelField >= 0) labels.push(Number(values[tokenOffsets[labelField]]) || 0);
                }
            } else {
                const view = new DataView(buffer, header.dataOffset);
                const readScalar = (offset, size, type) => {
                    if (type === 'F') return size === 8 ? view.getFloat64(offset, true) : view.getFloat32(offset, true);
                    if (type === 'I') {
                        if (size === 1) return view.getInt8(offset);
                        if (size === 2) return view.getInt16(offset, true);
                        return view.getInt32(offset, true);
                    }
                    if (size === 1) return view.getUint8(offset);
                    if (size === 2) return view.getUint16(offset, true);
                    return view.getUint32(offset, true);
                };
                const available = Math.floor(view.byteLength / byteStride);
                const count = Math.min(header.points || available, available);
                for (let p = 0; p < count; p++) {
                    const row = p * byteStride;
                    const x = readScalar(row + byteOffsets[xField], header.size[xField], header.type[xField]);
                    const y = readScalar(row + byteOffsets[yField], header.size[yField], header.type[yField]);
                    const z = readScalar(row + byteOffsets[zField], header.size[zField], header.type[zField]);
                    if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;
                    points.push(x, y, z);
                    if (intensityField >= 0) intensity.push(readScalar(row + byteOffsets[intensityField], header.size[intensityField], header.type[intensityField]));
                    if (labelField >= 0) labels.push(readScalar(row + byteOffsets[labelField], header.size[labelField], header.type[labelField]));
                }
            }
            return {
                points: new Float32Array(points),
                intensity: intensityField >= 0 ? new Float32Array(intensity) : null,
                labels: labelField >= 0 ? new Uint8Array(labels) : null,
                header,
            };
        };

        const voxelGridFilter = (points, leafSize) => {
            if (!(leafSize > 0)) return new Float32Array(points);
            const voxels = new Map();
            const inv = 1 / leafSize;
            for (let i = 0; i + 2 < points.length; i += 3) {
                const x = points[i], y = points[i + 1], z = points[i + 2];
                const key = `${Math.floor(x * inv)},${Math.floor(y * inv)},${Math.floor(z * inv)}`;
                const cell = voxels.get(key);
                if (cell) {
                    cell.x += x; cell.y += y; cell.z += z; cell.count += 1;
                } else {
                    voxels.set(key, { x, y, z, count: 1 });
                }
            }
            const result = new Float32Array(voxels.size * 3);
            let offset = 0;
            voxels.forEach(cell => {
                result[offset++] = cell.x / cell.count;
                result[offset++] = cell.y / cell.count;
                result[offset++] = cell.z / cell.count;
            });
            return result;
        };

        const cropByBox = (points, box, keepInside = true) => {
            const result = [];
            for (let i = 0; i + 2 < points.length; i += 3) {
                const x = points[i], y = points[i + 1], z = points[i + 2];
                const inside = x >= box.minX && x <= box.maxX &&
                    y >= box.minY && y <= box.maxY && z >= box.minZ && z <= box.maxZ;
                if (inside === keepInside) result.push(x, y, z);
            }
            return new Float32Array(result);
        };

        const pointInOrientedBox = (x, y, z, box) => {
            const centerX = box.centerX ?? (box.minX + box.maxX) / 2;
            const centerY = box.centerY ?? (box.minY + box.maxY) / 2;
            const centerZ = box.centerZ ?? (box.minZ + box.maxZ) / 2;
            const halfX = (box.sizeX ?? (box.maxX - box.minX)) / 2;
            const halfY = (box.sizeY ?? (box.maxY - box.minY)) / 2;
            const halfZ = (box.sizeZ ?? (box.maxZ - box.minZ)) / 2;
            const angle = -(box.yawDeg || 0) * Math.PI / 180;
            const dx = x - centerX, dy = y - centerY;
            const localX = dx * Math.cos(angle) - dy * Math.sin(angle);
            const localY = dx * Math.sin(angle) + dy * Math.cos(angle);
            return Math.abs(localX) <= halfX + 1e-8 && Math.abs(localY) <= halfY + 1e-8 && Math.abs(z - centerZ) <= halfZ + 1e-8;
        };

        const cropByOrientedBox = (points, box, keepInside = true) => {
            const result = [];
            for (let i = 0; i + 2 < points.length; i += 3) {
                const inside = pointInOrientedBox(points[i], points[i + 1], points[i + 2], box);
                if (inside === keepInside) result.push(points[i], points[i + 1], points[i + 2]);
            }
            return new Float32Array(result);
        };

        const pointOnSegment = (x, y, ax, ay, bx, by) => {
            const cross = (x - ax) * (by - ay) - (y - ay) * (bx - ax);
            if (Math.abs(cross) > 1e-8) return false;
            const dot = (x - ax) * (x - bx) + (y - ay) * (y - by);
            return dot <= 1e-8;
        };

        const pointInPolygon = (x, y, polygon) => {
            if (!polygon || polygon.length < 3) return false;
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const [xi, yi] = polygon[i], [xj, yj] = polygon[j];
                if (pointOnSegment(x, y, xi, yi, xj, yj)) return true;
                const crosses = ((yi > y) !== (yj > y)) &&
                    (x < (xj - xi) * (y - yi) / ((yj - yi) || Number.EPSILON) + xi);
                if (crosses) inside = !inside;
            }
            return inside;
        };

        const cropByPolygon = (points, polygon, keepInside = true, minZ = -Infinity, maxZ = Infinity) => {
            const result = [];
            for (let i = 0; i + 2 < points.length; i += 3) {
                const x = points[i], y = points[i + 1], z = points[i + 2];
                const inside = z >= minZ && z <= maxZ && pointInPolygon(x, y, polygon);
                if (inside === keepInside) result.push(x, y, z);
            }
            return new Float32Array(result);
        };

        const radiusOutlierFilter = (points, radius, minNeighbors) => {
            if (!(radius > 0) || minNeighbors <= 0) return new Float32Array(points);
            const inv = 1 / radius;
            const buckets = new Map();
            const keyOf = (x, y, z) => `${Math.floor(x * inv)},${Math.floor(y * inv)},${Math.floor(z * inv)}`;
            for (let i = 0; i < points.length; i += 3) {
                const key = keyOf(points[i], points[i + 1], points[i + 2]);
                if (!buckets.has(key)) buckets.set(key, []);
                buckets.get(key).push(i);
            }
            const radiusSq = radius * radius;
            const result = [];
            for (let i = 0; i < points.length; i += 3) {
                const x = points[i], y = points[i + 1], z = points[i + 2];
                const ix = Math.floor(x * inv), iy = Math.floor(y * inv), iz = Math.floor(z * inv);
                let neighbors = 0;
                outer: for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dz = -1; dz <= 1; dz++) {
                            const bucket = buckets.get(`${ix + dx},${iy + dy},${iz + dz}`) || [];
                            for (const j of bucket) {
                                if (j === i) continue;
                                const qx = points[j] - x, qy = points[j + 1] - y, qz = points[j + 2] - z;
                                if (qx * qx + qy * qy + qz * qz <= radiusSq && ++neighbors >= minNeighbors) break outer;
                            }
                        }
                    }
                }
                if (neighbors >= minNeighbors) result.push(x, y, z);
            }
            return new Float32Array(result);
        };

        const classifyNormals = (normals, config = {}) => {
            const groundMax = config.groundMaxDeg ?? 8;
            const slopeMax = config.slopeMaxDeg ?? 38;
            const wallMin = config.wallMinDeg ?? 70;
            const labels = new Uint8Array(Math.floor(normals.length / 3));
            for (let i = 0, p = 0; i + 2 < normals.length; i += 3, p++) {
                const nx = normals[i], ny = normals[i + 1], nz = normals[i + 2];
                const length = Math.hypot(nx, ny, nz) || 1;
                const angle = Math.acos(Math.min(1, Math.max(0, Math.abs(nz) / length))) * 180 / Math.PI;
                labels[p] = angle <= groundMax ? SEMANTIC.GROUND :
                    angle <= slopeMax ? SEMANTIC.SLOPE :
                    angle >= wallMin ? SEMANTIC.WALL : SEMANTIC.OBSTACLE;
            }
            return labels;
        };

        const classifySurface = (points, config = {}) => {
            const cellSize = config.cellSize ?? 0.3;
            if (!(cellSize > 0)) throw new Error('坡面网格必须大于 0');
            const bounds = computeBounds(points);
            const width = Math.max(1, Math.floor((bounds.maxX - bounds.minX) / cellSize) + 1);
            const height = Math.max(1, Math.floor((bounds.maxY - bounds.minY) / cellSize) + 1);
            const cells = new Map();
            for (let i = 0, p = 0; i + 2 < points.length; i += 3, p++) {
                const ix = Math.min(width - 1, Math.floor((points[i] - bounds.minX) / cellSize));
                const iy = Math.min(height - 1, Math.floor((points[i + 1] - bounds.minY) / cellSize));
                const idx = iy * width + ix;
                const z = points[i + 2];
                const cell = cells.get(idx) || { count: 0, sum: 0, sumSq: 0, min: Infinity, max: -Infinity };
                cell.count++; cell.sum += z; cell.sumSq += z * z;
                cell.min = Math.min(cell.min, z); cell.max = Math.max(cell.max, z);
                cells.set(idx, cell);
            }
            cells.forEach(cell => {
                cell.mean = cell.sum / cell.count;
                cell.roughness = Math.sqrt(Math.max(0, cell.sumSq / cell.count - cell.mean * cell.mean));
            });
            const meanAt = (x, y) => {
                if (x < 0 || y < 0 || x >= width || y >= height) return null;
                const cell = cells.get(y * width + x);
                return cell ? cell.mean : null;
            };
            const cellLabels = new Uint8Array(width * height);
            cells.forEach((cell, idx) => {
                const x = idx % width, y = Math.floor(idx / width);
                const left = meanAt(x - 1, y), right = meanAt(x + 1, y);
                const down = meanAt(x, y - 1), up = meanAt(x, y + 1);
                const dzdx = left !== null && right !== null ? (right - left) / (2 * cellSize) :
                    right !== null ? (right - cell.mean) / cellSize : left !== null ? (cell.mean - left) / cellSize : 0;
                const dzdy = down !== null && up !== null ? (up - down) / (2 * cellSize) :
                    up !== null ? (up - cell.mean) / cellSize : down !== null ? (cell.mean - down) / cellSize : 0;
                const span = cell.max - cell.min;
                if (span >= (config.wallHeightMin ?? 1.0)) cellLabels[idx] = SEMANTIC.WALL;
                else if (cell.roughness > (config.roughnessMax ?? 0.2)) cellLabels[idx] = SEMANTIC.OBSTACLE;
                else cellLabels[idx] = classifyNormals(new Float32Array([-dzdx, -dzdy, 1]), config)[0];
            });
            const labels = new Uint8Array(Math.floor(points.length / 3));
            for (let i = 0, p = 0; i + 2 < points.length; i += 3, p++) {
                const ix = Math.min(width - 1, Math.floor((points[i] - bounds.minX) / cellSize));
                const iy = Math.min(height - 1, Math.floor((points[i + 1] - bounds.minY) / cellSize));
                labels[p] = cellLabels[iy * width + ix] || SEMANTIC.UNCLASSIFIED;
            }
            return labels;
        };

        const gridDimensions = (config) => {
            if (!(config.resolution > 0)) throw new Error('分辨率必须大于 0');
            const width = Math.max(1, Math.ceil((config.maxX - config.minX) / config.resolution));
            const height = Math.max(1, Math.ceil((config.maxY - config.minY) / config.resolution));
            if (width * height > 100000000) throw new Error('地图栅格超过 1 亿，需提高分辨率或缩小范围');
            return { width, height };
        };

        const cleanupOccupancy = (input, width, height, config = {}) => {
            if (input.length !== width * height) throw new Error('占据图清理尺寸不匹配');
            let data = new Uint8Array(input);
            const neighborCounts = (source, row, column) => {
                let occupied = 0, free = 0;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (!dr && !dc) continue;
                        const r = row + dr, c = column + dc;
                        if (r < 0 || c < 0 || r >= height || c >= width) continue;
                        const value = source[r * width + c];
                        if (value === 0) occupied++;
                        else if (value === 254) free++;
                    }
                }
                return { occupied, free };
            };
            if (config.removeIsolated) {
                const source = data, output = new Uint8Array(source);
                const minimum = config.minOccupiedNeighbors ?? 1;
                for (let row = 0; row < height; row++) for (let column = 0; column < width; column++) {
                    const idx = row * width + column;
                    if (source[idx] !== 0) continue;
                    const counts = neighborCounts(source, row, column);
                    if (counts.occupied < minimum) output[idx] = counts.free ? 254 : 205;
                }
                data = output;
            }
            if (config.fillHoles) {
                const source = data, output = new Uint8Array(source);
                const minimum = config.fillHoleNeighbors ?? 8;
                for (let row = 0; row < height; row++) for (let column = 0; column < width; column++) {
                    const idx = row * width + column;
                    if (source[idx] !== 254) continue;
                    if (neighborCounts(source, row, column).occupied >= minimum) output[idx] = 0;
                }
                data = output;
            }
            return data;
        };

        const buildOccupancyGrid = (points, labels, config) => {
            const { width, height } = gridDimensions(config);
            const cellCount = width * height;
            const occupied = new Uint32Array(cellCount);
            const free = new Uint32Array(cellCount);
            const semanticFree = new Uint32Array(cellCount);
            const minZ = config.minZ ?? -Infinity, maxZ = config.maxZ ?? Infinity;
            const obstacleMinZ = config.obstacleMinZ ?? 0.15;
            for (let i = 0, p = 0; i + 2 < points.length; i += 3, p++) {
                const x = points[i], y = points[i + 1], z = points[i + 2];
                if (z < minZ || z > maxZ) continue;
                const ix = Math.floor((x - config.minX) / config.resolution);
                const iy = Math.floor((y - config.minY) / config.resolution);
                if (ix < 0 || iy < 0 || ix >= width || iy >= height) continue;
                const row = height - iy - 1;
                const idx = row * width + ix;
                const label = labels && p < labels.length ? labels[p] : SEMANTIC.UNCLASSIFIED;
                if (label === SEMANTIC.NOISE) continue;
                if (label === SEMANTIC.WALL || label === SEMANTIC.OBSTACLE ||
                    (label === SEMANTIC.UNCLASSIFIED && z >= obstacleMinZ)) occupied[idx] += 1;
                else {
                    free[idx] += 1;
                    if (label === SEMANTIC.GROUND || label === SEMANTIC.SLOPE) semanticFree[idx] += 1;
                }
            }
            const minimum = Math.max(1, config.minPointsPerCell || 1);
            let data = new Uint8Array(cellCount);
            data.fill(205);
            for (let i = 0; i < cellCount; i++) {
                if (occupied[i] >= minimum) data[i] = 0;
                else if (free[i] >= minimum) data[i] = 254;
            }
            if (config.removeIsolated || config.fillHoles) data = cleanupOccupancy(data, width, height, config);
            let estimatedCells = 0, estimatedMask;
            if (config.estimateSemanticFree) {
                const semanticFreeMask = new Uint8Array(cellCount);
                for (let i = 0; i < cellCount; i++) if (semanticFree[i] >= minimum) semanticFreeMask[i] = 1;
                const estimate = estimateSemanticFreeSpace(data, width, height, semanticFreeMask, {
                    radiusCells: Math.ceil((config.estimateRadius ?? 0.25) / config.resolution),
                    obstacleClearanceCells: Math.ceil((config.obstacleClearance ?? 0.15) / config.resolution),
                });
                data = estimate.data; estimatedCells = estimate.estimatedCells; estimatedMask = estimate.estimatedMask;
            }
            let occupiedCells = 0, freeCells = 0;
            for (const value of data) { if (value === 0) occupiedCells++; else if (value === 254) freeCells++; }
            let grid = {
                width, height, data,
                resolution: config.resolution,
                originX: config.minX,
                originY: config.minY,
                estimatedMask,
                stats: { occupied: occupiedCells, free: freeCells, unknown: cellCount - occupiedCells - freeCells, estimated: estimatedCells },
            };
            if (config.autoTrimUnknown) grid = trimUnknownBorder(grid, Math.ceil((config.trimPadding ?? 0.25) / config.resolution));
            if (grid.width !== width || grid.height !== height) {
                occupiedCells = 0; freeCells = 0;
                for (const value of grid.data) { if (value === 0) occupiedCells++; else if (value === 254) freeCells++; }
                grid.stats = { ...grid.stats, occupied: occupiedCells, free: freeCells, unknown: grid.data.length - occupiedCells - freeCells };
            }
            return grid;
        };

        const edt1d = (source) => {
            const n = source.length;
            const result = new Float64Array(n);
            const sites = [];
            for (let i = 0; i < n; i++) if (Number.isFinite(source[i])) sites.push(i);
            if (!sites.length) { result.fill(Infinity); return result; }
            const v = new Int32Array(n);
            const z = new Float64Array(n + 1);
            let k = 0;
            v[0] = sites[0]; z[0] = -Infinity; z[1] = Infinity;
            for (let sidx = 1; sidx < sites.length; sidx++) {
                const q = sites[sidx];
                let intersection;
                do {
                    const p = v[k];
                    intersection = ((source[q] + q * q) - (source[p] + p * p)) / (2 * (q - p));
                    if (intersection <= z[k]) k--;
                    else break;
                } while (k >= 0);
                k++;
                v[k] = q;
                z[k] = intersection;
                z[k + 1] = Infinity;
            }
            k = 0;
            for (let q = 0; q < n; q++) {
                while (z[k + 1] < q) k++;
                const delta = q - v[k];
                result[q] = delta * delta + source[v[k]];
            }
            return result;
        };

        const distanceTransform = (sourceMask, width, height) => {
            const first = new Float64Array(width * height);
            const output = new Float64Array(width * height);
            for (let r = 0; r < height; r++) {
                const row = new Float64Array(width);
                for (let c = 0; c < width; c++) row[c] = sourceMask[r * width + c] ? 0 : Infinity;
                first.set(edt1d(row), r * width);
            }
            for (let c = 0; c < width; c++) {
                const column = new Float64Array(height);
                for (let r = 0; r < height; r++) column[r] = first[r * width + c];
                const transformed = edt1d(column);
                for (let r = 0; r < height; r++) output[r * width + c] = transformed[r];
            }
            return output;
        };

        const estimateSemanticFreeSpace = (input, width, height, semanticFreeMask, config = {}) => {
            if (input.length !== width * height || semanticFreeMask.length !== input.length) throw new Error('语义补全尺寸不匹配');
            const data = new Uint8Array(input);
            const radiusCells = Math.max(0, Math.round(config.radiusCells || 0));
            const obstacleClearanceCells = Math.max(0, Math.round(config.obstacleClearanceCells || 0));
            if (!radiusCells) return { data, estimatedCells: 0, estimatedMask: new Uint8Array(data.length) };
            const occupiedMask = new Uint8Array(data.length);
            let hasSemanticFree = false;
            let observedTop = height, observedBottom = -1, observedLeft = width, observedRight = -1;
            for (let i = 0; i < data.length; i++) {
                occupiedMask[i] = data[i] === 0 ? 1 : 0;
                if (semanticFreeMask[i]) hasSemanticFree = true;
                if (data[i] !== 205) {
                    const row = Math.floor(i / width), column = i % width;
                    observedTop = Math.min(observedTop, row); observedBottom = Math.max(observedBottom, row);
                    observedLeft = Math.min(observedLeft, column); observedRight = Math.max(observedRight, column);
                }
            }
            const estimatedMask = new Uint8Array(data.length);
            if (!hasSemanticFree) return { data, estimatedCells: 0, estimatedMask };
            const freeDistance = distanceTransform(semanticFreeMask, width, height);
            const occupiedDistance = distanceTransform(occupiedMask, width, height);
            const radiusSquared = radiusCells * radiusCells;
            const clearanceSquared = obstacleClearanceCells * obstacleClearanceCells;
            let estimatedCells = 0;
            for (let i = 0; i < data.length; i++) {
                const row = Math.floor(i / width), column = i % width;
                if (config.limitToObservedBounds !== false &&
                    (row < observedTop || row > observedBottom || column < observedLeft || column > observedRight)) continue;
                if (data[i] !== 205 || freeDistance[i] > radiusSquared || occupiedDistance[i] <= clearanceSquared) continue;
                data[i] = 254;
                estimatedMask[i] = 1;
                estimatedCells++;
            }
            return { data, estimatedCells, estimatedMask };
        };

        const trimUnknownBorder = (grid, paddingCells = 0) => {
            if (!grid || grid.data.length !== grid.width * grid.height) throw new Error('地图裁边尺寸不匹配');
            let top = grid.height, bottom = -1, left = grid.width, right = -1;
            for (let row = 0; row < grid.height; row++) for (let column = 0; column < grid.width; column++) {
                if (grid.data[row * grid.width + column] === 205) continue;
                top = Math.min(top, row); bottom = Math.max(bottom, row);
                left = Math.min(left, column); right = Math.max(right, column);
            }
            if (bottom < 0) return { ...grid, data: new Uint8Array(grid.data) };
            const padding = Math.max(0, Math.round(paddingCells || 0));
            top = Math.max(0, top - padding); bottom = Math.min(grid.height - 1, bottom + padding);
            left = Math.max(0, left - padding); right = Math.min(grid.width - 1, right + padding);
            const width = right - left + 1, height = bottom - top + 1;
            const data = new Uint8Array(width * height);
            const estimatedMask = grid.estimatedMask ? new Uint8Array(width * height) : undefined;
            for (let row = top; row <= bottom; row++) {
                const sourceOffset = row * grid.width + left, targetOffset = (row - top) * width;
                data.set(grid.data.subarray(sourceOffset, sourceOffset + width), targetOffset);
                if (estimatedMask) estimatedMask.set(grid.estimatedMask.subarray(sourceOffset, sourceOffset + width), targetOffset);
            }
            const removedBottomRows = grid.height - bottom - 1;
            return {
                ...grid, width, height, data, estimatedMask,
                originX: grid.originX + left * grid.resolution,
                originY: grid.originY + removedBottomRows * grid.resolution,
            };
        };

        const buildSignedEsdf = (pixels, width, height, config = {}) => {
            if (pixels.length !== width * height) throw new Error('ESDF 输入尺寸不匹配');
            const occupied = new Uint8Array(pixels.length);
            const free = new Uint8Array(pixels.length);
            for (let i = 0; i < pixels.length; i++) {
                const isUnknown = pixels[i] === 205;
                const isOccupied = pixels[i] < 128 || (isUnknown && config.treatUnknownAsObstacle);
                occupied[i] = isOccupied ? 1 : 0;
                free[i] = isOccupied ? 0 : 1;
            }
            const outward = distanceTransform(occupied, width, height);
            const inward = distanceTransform(free, width, height);
            const resolution = config.resolution ?? 0.05;
            const maxDistance = config.maxDistance ?? 5;
            const result = new Float32Array(pixels.length);
            for (let i = 0; i < pixels.length; i++) {
                const squared = occupied[i] ? inward[i] : outward[i];
                const distance = Number.isFinite(squared) ? Math.sqrt(squared) * resolution : maxDistance;
                result[i] = (occupied[i] ? -1 : 1) * Math.min(distance, maxDistance);
            }
            return result;
        };

        const buildElevationGrid = (points, config, aggregation = 'median') => {
            const { width, height } = gridDimensions(config);
            const buckets = new Map();
            for (let i = 0; i + 2 < points.length; i += 3) {
                const ix = Math.floor((points[i] - config.minX) / config.resolution);
                const iy = Math.floor((points[i + 1] - config.minY) / config.resolution);
                if (ix < 0 || iy < 0 || ix >= width || iy >= height) continue;
                const idx = iy * width + ix;
                if (!buckets.has(idx)) buckets.set(idx, []);
                buckets.get(idx).push(points[i + 2]);
            }
            const values = new Float32Array(width * height);
            values.fill(NaN);
            buckets.forEach((samples, idx) => {
                samples.sort((a, b) => a - b);
                if (aggregation === 'min') values[idx] = samples[0];
                else if (aggregation === 'max') values[idx] = samples[samples.length - 1];
                else if (aggregation === 'p90') values[idx] = samples[Math.floor((samples.length - 1) * 0.9)];
                else {
                    const mid = Math.floor(samples.length / 2);
                    values[idx] = samples.length % 2 ? samples[mid] : (samples[mid - 1] + samples[mid]) / 2;
                }
            });
            return { width, height, values, resolution: config.resolution, originX: config.minX, originY: config.minY };
        };

        const concatBytes = (parts) => {
            const size = parts.reduce((sum, part) => sum + part.length, 0);
            const result = new Uint8Array(size);
            let offset = 0;
            for (const part of parts) { result.set(part, offset); offset += part.length; }
            return result;
        };

        const serializePgm = (grid) => {
            if (!grid || grid.data.length !== grid.width * grid.height) throw new Error('PGM 数据尺寸不匹配');
            const header = new TextEncoder().encode(`P5\n${grid.width} ${grid.height}\n255\n`);
            return concatBytes([header, new Uint8Array(grid.data)]);
        };

        const serializeMapYaml = (imageName, config) => [
            `image: ${imageName}`,
            'mode: trinary',
            `resolution: ${config.resolution}`,
            `origin: [${config.originX}, ${config.originY}, 0]`,
            'negate: 0',
            `occupied_thresh: ${config.occupiedThresh ?? 0.65}`,
            `free_thresh: ${config.freeThresh ?? 0.25}`,
            '',
        ].join('\n');

        const serializeEsdfPcd = (distances, config) => {
            const count = config.width * config.height;
            if (distances.length !== count) throw new Error('ESDF PCD 数据尺寸不匹配');
            const header = new TextEncoder().encode(
                '# .PCD v0.7 - Point Cloud Data file format\n' +
                'VERSION 0.7\nFIELDS x y z intensity\nSIZE 4 4 4 4\nTYPE F F F F\nCOUNT 1 1 1 1\n' +
                `WIDTH ${count}\nHEIGHT 1\nVIEWPOINT 0 0 0 1 0 0 0\nPOINTS ${count}\nDATA binary\n`
            );
            const body = new Uint8Array(count * 16);
            const view = new DataView(body.buffer);
            for (let r = 0; r < config.height; r++) {
                for (let c = 0; c < config.width; c++) {
                    const idx = r * config.width + c;
                    const offset = idx * 16;
                    view.setFloat32(offset, config.originX + c * config.resolution, true);
                    view.setFloat32(offset + 4, config.originY + (config.height - r - 1) * config.resolution, true);
                    view.setFloat32(offset + 8, 0, true);
                    view.setFloat32(offset + 12, distances[idx], true);
                }
            }
            return concatBytes([header, body]);
        };

        const serializeXyzPcd = (points, labels = null, binary = false) => {
            const count = Math.floor(points.length / 3);
            const withLabel = labels && labels.length === count;
            const fields = withLabel ? 'x y z label' : 'x y z';
            const sizes = withLabel ? '4 4 4 1' : '4 4 4';
            const types = withLabel ? 'F F F U' : 'F F F';
            const headerText = '# .PCD v0.7 - Point Cloud Data file format\nVERSION 0.7\n' +
                `FIELDS ${fields}\nSIZE ${sizes}\nTYPE ${types}\nCOUNT ${withLabel ? '1 1 1 1' : '1 1 1'}\n` +
                `WIDTH ${count}\nHEIGHT 1\nVIEWPOINT 0 0 0 1 0 0 0\nPOINTS ${count}\nDATA ${binary ? 'binary' : 'ascii'}\n`;
            const header = new TextEncoder().encode(headerText);
            if (!binary) {
                const rows = [];
                for (let i = 0, p = 0; i < points.length; i += 3, p++) {
                    rows.push(`${points[i]} ${points[i + 1]} ${points[i + 2]}${withLabel ? ` ${labels[p]}` : ''}\n`);
                }
                return concatBytes([header, new TextEncoder().encode(rows.join(''))]);
            }
            const stride = withLabel ? 13 : 12;
            const body = new Uint8Array(count * stride);
            const view = new DataView(body.buffer);
            for (let i = 0, p = 0; p < count; i += 3, p++) {
                const offset = p * stride;
                view.setFloat32(offset, points[i], true);
                view.setFloat32(offset + 4, points[i + 1], true);
                view.setFloat32(offset + 8, points[i + 2], true);
                if (withLabel) view.setUint8(offset + 12, labels[p]);
            }
            return concatBytes([header, body]);
        };

        globalThis.CloudLabCore = Object.freeze({
            SEMANTIC,
            cameraGestureForButton,
            finitePoints,
            computeBounds,
            parsePcd,
            voxelGridFilter,
            cropByBox,
            pointInOrientedBox,
            cropByOrientedBox,
            pointInPolygon,
            cropByPolygon,
            radiusOutlierFilter,
            classifyNormals,
            classifySurface,
            cleanupOccupancy,
            estimateSemanticFreeSpace,
            trimUnknownBorder,
            buildOccupancyGrid,
            buildSignedEsdf,
            buildElevationGrid,
            serializePgm,
            serializeMapYaml,
            serializeEsdfPcd,
            serializeXyzPcd,
        });
    })();
    /* CLOUDLAB_CORE_END */
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- 1. PCD 解析器 ---
        const parsePCD = (buffer) => {
            const textDecoder = new TextDecoder();
            const header = { data: 'ascii', fields: [], size: [], type: [], count: 1, points: 0, headerLen: 0 };
            const view = new Uint8Array(buffer);
            let line = '';
            let ptr = 0;
            while (ptr < buffer.byteLength) {
                const char = String.fromCharCode(view[ptr]);
                ptr++;
                if (char === '\n') {
                    const cleanLine = line.trim();
                    if (cleanLine.length > 0) {
                        const parts = cleanLine.split(/\s+/);
                        const tag = parts[0].toUpperCase();
                        if (tag === 'FIELDS') header.fields = parts.slice(1).map(f => f.toLowerCase());
                        else if (tag === 'SIZE') header.size = parts.slice(1).map(x => parseInt(x));
                        else if (tag === 'TYPE') header.type = parts.slice(1);
                        else if (tag === 'COUNT') header.count = parts.slice(1).map(x => parseInt(x));
                        else if (tag === 'WIDTH') header.points = parseInt(parts[1]); 
                        else if (tag === 'POINTS') header.points = parseInt(parts[1]);
                        else if (tag === 'DATA') { header.data = parts[1]; header.headerLen = ptr; break; }
                    }
                    line = '';
                } else { line += char; }
            }
            const xIdx = header.fields.indexOf('x'); const yIdx = header.fields.indexOf('y'); const zIdx = header.fields.indexOf('z');
            if (xIdx === -1 || yIdx === -1 || zIdx === -1) throw new Error("PCD 文件缺少 x, y, z 字段");
            const points = [];
            if (header.data === 'ascii') {
                const bodyStr = textDecoder.decode(buffer.slice(header.headerLen));
                const lines = bodyStr.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    const l = lines[i].trim();
                    if (l === '') continue;
                    const parts = l.split(/\s+/);
                    if (parts.length > zIdx) {
                        const x = parseFloat(parts[xIdx]), y = parseFloat(parts[yIdx]), z = parseFloat(parts[zIdx]);
                        if (!isNaN(x) && !isNaN(y) && !isNaN(z)) points.push(x, y, z);
                    }
                }
            } else if (header.data === 'binary') {
                const dataView = new DataView(buffer, header.headerLen);
                let rowStep = 0; header.size.forEach(s => rowStep += s);
                let xOffset = 0, yOffset = 0, zOffset = 0;
                for(let i=0; i<xIdx; i++) xOffset += header.size[i];
                for(let i=0; i<yIdx; i++) yOffset += header.size[i];
                for(let i=0; i<zIdx; i++) zOffset += header.size[i];
                for (let i = 0; i < header.points; i++) {
                    const rowStart = i * rowStep;
                    if (rowStart + rowStep > dataView.byteLength) break;
                    points.push(
                        dataView.getFloat32(rowStart + xOffset, true),
                        dataView.getFloat32(rowStart + yOffset, true),
                        dataView.getFloat32(rowStart + zOffset, true)
                    );
                }
            }
            return new Float32Array(points);
        };

        // --- 2. PGM 解析器 ---
        const parsePGM = (buffer) => {
            const view = new Uint8Array(buffer);
            let ptr = 0;
            const nextWord = () => {
                let word = '';
                while (ptr < view.length) {
                    let code = view[ptr];
                    let char = String.fromCharCode(code);
                    ptr++;
                    if (char === '#') { while (ptr < view.length && view[ptr] !== 10) ptr++; } 
                    else if (code <= 32) { if (word.length > 0) return word; } 
                    else { word += char; }
                }
                return word;
            };
            const magic = nextWord();
            if (magic !== 'P5' && magic !== 'P2') throw new Error("仅支持 PGM (P2/P5) 格式");
            const width = parseInt(nextWord());
            const height = parseInt(nextWord());
            const maxVal = parseInt(nextWord());
            const pixelCount = width * height;
            const data = new Uint8Array(pixelCount);
            if (magic === 'P5') {
                if (view.length - ptr < pixelCount) {
                    const start = view.length - pixelCount;
                    data.set(view.slice(start, view.length));
                } else {
                    data.set(view.slice(ptr, ptr + pixelCount));
                }
            } else {
                let valIdx = 0;
                while(valIdx < pixelCount) {
                    const w = nextWord();
                    if(!w) break;
                    data[valIdx++] = parseInt(w);
                }
            }
            return { width, height, data, maxVal };
        };

        // --- 3. 滤波 ---
        const voxelGridFilter = (points, leafSize) => {
            if (leafSize <= 0) return points;
            const voxelMap = new Map();
            const invLeaf = 1.0 / leafSize;
            for (let i = 0; i < points.length; i += 3) {
                const x = points[i], y = points[i+1], z = points[i+2];
                const ix = Math.floor(x * invLeaf), iy = Math.floor(y * invLeaf), iz = Math.floor(z * invLeaf);
                const key = `${ix},${iy},${iz}`;
                if (!voxelMap.has(key)) voxelMap.set(key, { sx: x, sy: y, sz: z, count: 1 });
                else { const v = voxelMap.get(key); v.sx += x; v.sy += y; v.sz += z; v.count++; }
            }
            const filtered = [];
            voxelMap.forEach(v => filtered.push(v.sx / v.count, v.sy / v.count, v.sz / v.count));
            return new Float32Array(filtered);
        };

        const generateDemoData = () => {
            const points = [];
            for (let i = 0; i < 15000; i++) {
                const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI * 2;
                const R = 10, r = 4;
                points.push(
                    (R + r * Math.cos(v)) * Math.cos(u) + (Math.random() - 0.5) * 0.2, // x
                    (R + r * Math.cos(v)) * Math.sin(u) + (Math.random() - 0.5) * 0.2, // y
                    r * Math.sin(v) + (Math.random() - 0.5) * 0.2 // z
                );
            }
            return new Float32Array(points);
        };

        // --- 3D Viewer (Z-UP MODE) ---
        const PointCloudViewer = ({ points, transforms, cropSettings, setBoundingBoxInfo, mapData, mapSettings }) => {
            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            const rendererRef = useRef(null);
            const cameraRef = useRef(null);
            const pointsRef = useRef(null);
            const boxHelperRef = useRef(null);
            const cropBoxHelperRef = useRef(null);
            const mapMeshRef = useRef(null);
            const requestRef = useRef(null);
            const isDragging = useRef(false);
            const isRightDragging = useRef(false);
            const lastMouse = useRef({ x: 0, y: 0 });
            const camState = useRef({ r: 40, theta: Math.PI/4, phi: Math.PI/3, target: new THREE.Vector3() });

            if (typeof THREE === 'undefined') throw new Error("Three.js Not Loaded");

            useEffect(() => {
                const w = window.innerWidth, h = window.innerHeight;
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x111827);
                sceneRef.current = scene;

                const grid = new THREE.GridHelper(100, 100, 0x444444, 0x222222);
                grid.rotation.x = Math.PI / 2; 
                scene.add(grid);
                scene.add(new THREE.AxesHelper(5));
                scene.add(new THREE.AmbientLight(0xffffff, 1));

                const camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 2000);
                camera.up.set(0, 0, 1);
                cameraRef.current = camera;
                updateCam();

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(w, h);
                mountRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                const onResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', onResize);

                const animate = () => {
                    requestRef.current = requestAnimationFrame(animate);
                    renderer.render(scene, camera);
                };
                animate();

                return () => {
                    window.removeEventListener('resize', onResize);
                    cancelAnimationFrame(requestRef.current);
                    if (mountRef.current && renderer.domElement) mountRef.current.removeChild(renderer.domElement);
                };
            }, []);

            const updateCam = () => {
                if (!cameraRef.current) return;
                const { r, theta, phi, target } = camState.current;
                const x = target.x + r * Math.sin(phi) * Math.cos(theta);
                const y = target.y + r * Math.sin(phi) * Math.sin(theta);
                const z = target.z + r * Math.cos(phi);
                cameraRef.current.position.set(x, y, z);
                cameraRef.current.lookAt(target);
            };

            useEffect(() => {
                if (!sceneRef.current || !points) return;
                if (pointsRef.current) {
                    sceneRef.current.remove(pointsRef.current);
                    sceneRef.current.remove(boxHelperRef.current);
                    pointsRef.current.geometry.dispose();
                    pointsRef.current.material.dispose();
                }
                
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(points, 3));
                
                let minZ = Infinity, maxZ = -Infinity;
                for(let i=2; i<points.length; i+=3) {
                    if(points[i] < minZ) minZ = points[i];
                    if(points[i] > maxZ) maxZ = points[i];
                }
                const range = maxZ - minZ || 1;
                const colors = [];
                const c1 = new THREE.Color(0x3b82f6), c2 = new THREE.Color(0x10b981);
                for(let i=0; i<points.length; i+=3) {
                    const t = (points[i+2] - minZ) / range;
                    const c = c1.clone().lerp(c2, t);
                    colors.push(c.r, c.g, c.b);
                }
                geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));

                const mesh = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.15, vertexColors: true }));
                pointsRef.current = mesh;
                sceneRef.current.add(mesh);

                const boxHelp = new THREE.BoxHelper(mesh, 0xffff00);
                boxHelperRef.current = boxHelp;
                sceneRef.current.add(boxHelp);

                geo.computeBoundingBox();
                const b = geo.boundingBox;
                if(b) {
                    const s = new THREE.Vector3(), c = new THREE.Vector3();
                    b.getSize(s); b.getCenter(c);
                    setBoundingBoxInfo({ count: points.length/3, size: {x:s.x,y:s.y,z:s.z}, center: {x:c.x,y:c.y,z:c.z} });
                }
            }, [points]);

            useEffect(() => {
                if(!sceneRef.current) return;
                if(mapMeshRef.current) {
                    sceneRef.current.remove(mapMeshRef.current);
                    mapMeshRef.current.geometry.dispose();
                    mapMeshRef.current.material.dispose();
                    mapMeshRef.current = null;
                }
                if(mapData && mapSettings.visible) {
                    const { width, height, data } = mapData;
                    const rgba = new Uint8Array(width*height*4);
                    for(let i=0; i<width*height; i++) {
                        const val = data[i];
                        const idx = i*4;
                        if(val < 10) { rgba[idx]=0; rgba[idx+1]=0; rgba[idx+2]=0; rgba[idx+3]=255; }
                        else if(val > 240) { rgba[idx]=255; rgba[idx+1]=255; rgba[idx+2]=255; rgba[idx+3]=30; }
                        else { rgba[idx]=128; rgba[idx+1]=128; rgba[idx+2]=128; rgba[idx+3]=0; }
                    }
                    const tex = new THREE.DataTexture(rgba, width, height, THREE.RGBAFormat);
                    tex.flipY = mapSettings.flipY; 
                    tex.needsUpdate = true;
                    
                    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: mapSettings.opacity, side: THREE.DoubleSide });
                    const planeWidth = width*mapSettings.resolution;
                    const planeHeight = height*mapSettings.resolution;
                    const plane = new THREE.Mesh(new THREE.PlaneGeometry(planeWidth, planeHeight), mat);
                    
                    const cx = mapSettings.originX + planeWidth / 2.0;
                    const cy = mapSettings.originY + planeHeight / 2.0;

                    plane.position.set(cx, cy, mapSettings.zOffset);
                    plane.rotation.z = THREE.MathUtils.degToRad(mapSettings.rotation);

                    sceneRef.current.add(plane);
                    mapMeshRef.current = plane;
                }
            }, [mapData, mapSettings]);

            useEffect(() => {
                if(pointsRef.current) {
                    pointsRef.current.position.set(transforms.x, transforms.y, transforms.z);
                    pointsRef.current.rotation.set(THREE.MathUtils.degToRad(transforms.rotX), THREE.MathUtils.degToRad(transforms.rotY), THREE.MathUtils.degToRad(transforms.rotZ));
                    pointsRef.current.updateMatrixWorld();
                    if(boxHelperRef.current) boxHelperRef.current.update();
                }
            }, [transforms]);

            useEffect(() => {
                if(!sceneRef.current) return;
                if(cropBoxHelperRef.current) { sceneRef.current.remove(cropBoxHelperRef.current); cropBoxHelperRef.current = null; }
                if(cropSettings.active) {
                    const w = cropSettings.maxX - cropSettings.minX, h = cropSettings.maxY - cropSettings.minY, d = cropSettings.maxZ - cropSettings.minZ;
                    const cx = (cropSettings.minX+cropSettings.maxX)/2, cy = (cropSettings.minY+cropSettings.maxY)/2, cz = (cropSettings.minZ+cropSettings.maxZ)/2;
                    const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)), new THREE.LineBasicMaterial({ color: 0xff0000 }));
                    box.position.set(cx, cy, cz);
                    cropBoxHelperRef.current = box;
                    sceneRef.current.add(box);
                }
            }, [cropSettings]);

            const onMouseDown = e => { if(e.button===0) isDragging.current=true; if(e.button===2) isRightDragging.current=true; lastMouse.current={x:e.clientX, y:e.clientY}; };
            const onMouseUp = () => { isDragging.current=false; isRightDragging.current=false; };
            const onMouseMove = e => {
                const dx = e.clientX - lastMouse.current.x, dy = e.clientY - lastMouse.current.y;
                lastMouse.current = {x:e.clientX, y:e.clientY};
                if(isDragging.current) {
                    camState.current.theta -= dx*0.01; 
                    camState.current.phi -= dy*0.01;
                    camState.current.phi = Math.max(0.1, Math.min(Math.PI-0.1, camState.current.phi));
                    updateCam();
                } else if(isRightDragging.current) {
                    const fwd = new THREE.Vector3(); 
                    cameraRef.current.getWorldDirection(fwd); 
                    fwd.z = 0; fwd.normalize();
                    const rt = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,0,1));
                    camState.current.target.addScaledVector(rt, -dx*0.05);
                    camState.current.target.addScaledVector(fwd, dy*0.05);
                    updateCam();
                }
            };
            const onWheel = e => {
                camState.current.r += e.deltaY*0.05; camState.current.r = Math.max(1, camState.current.r);
                updateCam();
            };

            return <div ref={mountRef} className="canvas-container cursor-move" onMouseDown={onMouseDown} onMouseUp={onMouseUp} onMouseMove={onMouseMove} onMouseLeave={onMouseUp} onWheel={onWheel} onContextMenu={e=>e.preventDefault()} />;
        };

        const App = () => {
            const [points, setPoints] = useState(generateDemoData());
            const [mapData, setMapData] = useState(null);
            const [activeTab, setActiveTab] = useState('transform');
            const [transforms, setTransforms] = useState({ x:0,y:0,z:0,rotX:0,rotY:0,rotZ:0 });
            const [cropSettings, setCropSettings] = useState({ active:false, minX:-20,maxX:20, minY:-20,maxY:20, minZ:-20,maxZ:20 });
            const [mapSettings, setMapSettings] = useState({ resolution:0.05, opacity:0.6, visible:true, rotation:0, zOffset:-0.5, originX: 0.0, originY: 0.0, flipY: true });
            const [voxelLeaf, setVoxelLeaf] = useState(0.5);
            const [filtering, setFiltering] = useState(false);
            const [info, setInfo] = useState({ count:0, size:{x:0,y:0,z:0}, center:{x:0,y:0,z:0} });

            const handleFile = e => {
                const f = e.target.files[0]; if(!f) return;
                const r = new FileReader();
                r.onload = ev => {
                    try {
                        let pts;
                        if(f.name.toLowerCase().endsWith('.pcd')) pts = parsePCD(ev.target.result);
                        else {
                            const lines = ev.target.result.split(/\r\n|\n/);
                            const arr = [];
                            lines.forEach(l => {
                                if(l.startsWith('#')) return;
                                const p = l.trim().split(/\s+/);
                                if(p.length>=3) {
                                    const x=parseFloat(p[0]), y=parseFloat(p[1]), z=parseFloat(p[2]);
                                    if(!isNaN(x)&&!isNaN(y)&&!isNaN(z)) arr.push(x,y,z);
                                }
                            });
                            pts = new Float32Array(arr);
                        }
                        if(pts && pts.length) { setPoints(pts); setTransforms({x:0,y:0,z:0,rotX:0,rotY:0,rotZ:0}); }
                        else alert("未找到点数据");
                    } catch(err) { alert("解析失败: "+err.message); }
                };
                if(f.name.toLowerCase().endsWith('.pcd')) r.readAsArrayBuffer(f); else r.readAsText(f);
            };

            const handleMap = e => {
                const f = e.target.files[0]; if(!f) return;
                const r = new FileReader();
                r.onload = ev => {
                    try { setMapData(parsePGM(ev.target.result)); } catch(err) { alert("地图解析失败: "+err.message); }
                };
                r.readAsArrayBuffer(f);
            };

            const doExportMap = () => {
                if (!mapData) return;
                const { width, height, data } = mapData;
                
                // 1. 创建源 Canvas
                const srcCanvas = document.createElement('canvas');
                srcCanvas.width = width;
                srcCanvas.height = height;
                const ctx = srcCanvas.getContext('2d');
                const imgData = ctx.createImageData(width, height);
                
                // 填充源数据
                for(let i=0; i<width*height; i++) {
                    const val = data[i];
                    imgData.data[i*4] = val;
                    imgData.data[i*4+1] = val;
                    imgData.data[i*4+2] = val;
                    imgData.data[i*4+3] = 255;
                }
                ctx.putImageData(imgData, 0, 0);

                // 2. 计算旋转后的新尺寸
                const angleRad = THREE.MathUtils.degToRad(mapSettings.rotation);
                const absCos = Math.abs(Math.cos(angleRad));
                const absSin = Math.abs(Math.sin(angleRad));
                const newWidth = Math.ceil(width * absCos + height * absSin);
                const newHeight = Math.ceil(width * absSin + height * absCos);

                // 3. 创建目标 Canvas 并旋转绘制
                const dstCanvas = document.createElement('canvas');
                dstCanvas.width = newWidth;
                dstCanvas.height = newHeight;
                const dCtx = dstCanvas.getContext('2d');
                
                // 填充背景为灰色 (ROS Unknown 205)
                dCtx.fillStyle = "rgb(205,205,205)"; 
                dCtx.fillRect(0, 0, newWidth, newHeight);

                dCtx.translate(newWidth/2, newHeight/2);
                dCtx.rotate(-angleRad); // Canvas 旋转方向通常顺时针，需要注意
                // 如果需要和显示一致，可能需要根据 mapSettings.flipY 调整
                if(mapSettings.flipY) dCtx.scale(1, -1);
                dCtx.drawImage(srcCanvas, -width/2, -height/2);

                // 4. 导出为 PGM (P5 Binary)
                const resData = dCtx.getImageData(0, 0, newWidth, newHeight).data;
                const pgmHeader = `P5\n${newWidth} ${newHeight}\n255\n`;
                const headerBytes = new TextEncoder().encode(pgmHeader);
                const pgmBody = new Uint8Array(newWidth * newHeight);
                
                for(let i=0; i<newWidth*newHeight; i++) {
                    // 取红色通道作为灰度值
                    pgmBody[i] = resData[i*4];
                }

                const blob = new Blob([headerBytes, pgmBody], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'rotated_map.pgm';
                a.click();
                URL.revokeObjectURL(url);
            };

            const doFilter = () => {
                setFiltering(true);
                setTimeout(() => {
                    setPoints(voxelGridFilter(points, voxelLeaf));
                    setFiltering(false);
                }, 50);
            };
            
            const doCrop = () => {
                const m = new THREE.Matrix4();
                m.makeRotationFromEuler(new THREE.Euler(
                    THREE.MathUtils.degToRad(transforms.rotX), THREE.MathUtils.degToRad(transforms.rotY), THREE.MathUtils.degToRad(transforms.rotZ)
                ));
                m.setPosition(transforms.x, transforms.y, transforms.z);
                const v = new THREE.Vector3(), arr=[];
                for(let i=0; i<points.length; i+=3) {
                    v.set(points[i], points[i+1], points[i+2]).applyMatrix4(m);
                    if(v.x>=cropSettings.minX && v.x<=cropSettings.maxX && v.y>=cropSettings.minY && v.y<=cropSettings.maxY && v.z>=cropSettings.minZ && v.z<=cropSettings.maxZ)
                        arr.push(v.x, v.y, v.z);
                }
                if(!arr.length) return alert("区域内无点");
                setPoints(new Float32Array(arr));
                setTransforms({x:0,y:0,z:0,rotX:0,rotY:0,rotZ:0});
                setCropSettings({...cropSettings, active:false});
            };

            const doExportXYZ = () => {
                let s = "";
                const m = new THREE.Matrix4();
                m.makeRotationFromEuler(new THREE.Euler(
                    THREE.MathUtils.degToRad(transforms.rotX), THREE.MathUtils.degToRad(transforms.rotY), THREE.MathUtils.degToRad(transforms.rotZ)
                ));
                m.setPosition(transforms.x, transforms.y, transforms.z);
                const v = new THREE.Vector3();
                for(let i=0; i<points.length; i+=3) {
                    v.set(points[i], points[i+1], points[i+2]).applyMatrix4(m);
                    s += `${v.x.toFixed(4)} ${v.y.toFixed(4)} ${v.z.toFixed(4)}\n`;
                }
                const b = new Blob([s], {type:'text/plain'});
                const u = URL.createObjectURL(b);
                const a = document.createElement('a'); a.href=u; a.download='processed.xyz'; a.click();
            };

            const doExportPCD = () => {
                const count = points.length / 3;
                let s = "# .PCD v0.7 - Point Cloud Data file format\n";
                s += "VERSION 0.7\nFIELDS x y z\nSIZE 4 4 4\nTYPE F F F\nCOUNT 1 1 1\n";
                s += `WIDTH ${count}\nHEIGHT 1\nVIEWPOINT 0 0 0 1 0 0 0\nPOINTS ${count}\nDATA ascii\n`;
                const m = new THREE.Matrix4();
                m.makeRotationFromEuler(new THREE.Euler(
                    THREE.MathUtils.degToRad(transforms.rotX), THREE.MathUtils.degToRad(transforms.rotY), THREE.MathUtils.degToRad(transforms.rotZ)
                ));
                m.setPosition(transforms.x, transforms.y, transforms.z);
                const v = new THREE.Vector3();
                for(let i=0; i<points.length; i+=3) {
                    v.set(points[i], points[i+1], points[i+2]).applyMatrix4(m);
                    s += `${v.x.toFixed(4)} ${v.y.toFixed(4)} ${v.z.toFixed(4)}\n`;
                }
                const b = new Blob([s], {type:'text/plain'});
                const u = URL.createObjectURL(b);
                const a = document.createElement('a'); a.href=u; a.download='processed.pcd'; a.click();
            };

            return (
                <div className="w-full h-full relative font-sans">
                    <PointCloudViewer points={points} transforms={transforms} cropSettings={cropSettings} setBoundingBoxInfo={setInfo} mapData={mapData} mapSettings={mapSettings} />
                    
                    <div className="absolute top-0 left-0 p-4 z-10">
                        <h1 className="text-xl font-bold bg-gray-900/80 px-4 py-2 rounded text-blue-400 border border-gray-700 backdrop-blur">
                            CloudLab <span className="text-xs text-gray-400">Pro v2.7</span>
                        </h1>
                    </div>

                    <div className="absolute top-0 right-0 h-full w-[480px] bg-gray-900/95 border-l border-gray-700 flex flex-col z-10 backdrop-blur">
                        <div className="p-6 border-b border-gray-700 bg-gray-800/50">
                            <h2 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">统计信息</h2>
                            <div className="grid grid-cols-2 gap-4 text-xs">
                                <div className="bg-gray-800 p-3 rounded"><span className="text-gray-500">点数</span> <span className="text-blue-400 font-bold block text-lg mt-1">{info.count.toLocaleString()}</span></div>
                                <div className="bg-gray-800 p-3 rounded"><span className="text-gray-500">尺寸</span> <span className="text-green-400 block mt-1 text-sm font-mono">{info.size.x.toFixed(1)} x {info.size.y.toFixed(1)} x {info.size.z.toFixed(1)}</span></div>
                            </div>
                        </div>
